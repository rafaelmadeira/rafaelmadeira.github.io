<main class="workspace">
 <div class="content-limit">
  <div class="page-head">
   <div><h1 id="pageTitle">All your things</h1><div class="subtitle" id="pageSubtitle">Whatever you need, right where you left it.</div></div>
   <div class="view-actions"><button id="bookmarkViewBtn" class="iconbtn" title="Bookmark this filtered view" aria-label="Bookmark this view"><span data-icon="bookmark-plus"></span></button></div>
  </div>
  <div class="filterbar" id="filterbar">
   <button class="filter-btn" id="tagFilter"><span data-icon="tag"></span> Tags <span data-icon="chevron-down"></span></button>
   <button class="filter-btn" id="typeFilter"><span data-icon="filter"></span> Types <span data-icon="chevron-down"></span></button>
   <button class="filter-btn" id="colorFilter"><span data-icon="palette"></span> Colors <span data-icon="chevron-down"></span></button>
   <div class="active-pills" id="activePills"></div>
  </div>
  <div class="capture" id="capture">
   <div class="capture-collapsed" id="captureCollapsed">
    <button class="capture-trigger" id="captureTrigger">Take a note...</button>
    <div class="quick-tools">
      <button class="iconbtn" data-new="checklist" title="New checklist" aria-label="New checklist"><span data-icon="checklist"></span></button>
      <button class="iconbtn" data-new="bookmark" title="Save link" aria-label="Save link"><span data-icon="link"></span></button>
      <button class="iconbtn" data-new="image" title="Add image or media" aria-label="Add image or media"><span data-icon="image"></span></button>
      <button class="iconbtn" data-new="collection" title="New collection" aria-label="New collection"><span data-icon="collection"></span></button>
    </div>
   </div>
   <div class="capture-expanded hidden" id="captureExpanded">
    <input id="captureTitle" class="capture-title" placeholder="Title (optional)" aria-label="Note title">
    <textarea id="captureText" class="capture-text" placeholder="What's on your mind?" aria-label="Note contents"></textarea>
    <div class="capture-bottom"><span class="micro">Auto-tags in your current view · Ctrl + Enter to save</span><button class="textbtn" id="captureDone">Save note</button></div>
   </div>
  </div>
  <div id="objectsArea"></div>
 </div>
</main>
<div id="popover" class="popover hidden"></div>
<div id="modalLayer" class="modal-layer hidden"><div id="dialog" class="dialog"></div></div>
<div id="pickerLayer" class="picker-layer hidden">
 <div class="picker-dialog"><div class="picker-head"><h2 id="pickerTitle">Choose an object</h2><input id="pickerSearch" class="picker-search" type="search" placeholder="Search your things..." aria-label="Search objects to reference"></div><div id="pickerResults" class="picker-results"></div></div>
</div>
<div id="mentionMenu" class="mention-menu hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="dropveil" class="dropveil hidden">Drop to keep it ✨</div>

function icon(n,size){return '<svg width="'+(size||17)+'" height="'+(size||17)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(PATHS[n]||PATHS.note)+'</svg>';}

const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'o'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

 const art='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360"><rect width="640" height="360" fill="#e8dabb"/><circle cx="465" cy="128" r="86" fill="#f5ae54"/><path d="M0 290 Q100 170 240 260 T500 255 T700 220 V400 H0" fill="#799684"/><path d="M0 328 Q170 220 325 320 T700 290 V400 H0" fill="#3f6960"/><path d="M120 235 Q180 105 230 240" fill="none" stroke="#534e42" stroke-width="15" stroke-linecap="round"/></svg>';
 return {objects:[
 {id:'a1',type:'note',title:'Things worth remembering',html:'<p>The best organizational system is the one that doesn’t get in your way.</p><p>Keep it simple. Let structure emerge when you need it.</p>',tags:['ideas','personal'],color:'yellow',pinned:true,created:1,updated:1},
 {id:'a2',type:'checklist',title:'Website refresh',items:[{id:'c1',html:'Review the layout',done:true},{id:'c2',html:'Collect design references',done:true},{id:'c3',html:'Update the homepage',done:false},{id:'c4',html:'Test on mobile',done:false}],tags:['work','website'],color:'blue',pinned:true,created:2,updated:2},
 {id:'a3',type:'bookmark',title:'Laws of UX',url:'https://lawsofux.com/',description:'Useful principles for designing better interfaces.',tags:['design','reading'],color:'none',created:3,updated:3},
 {id:'a4',type:'note',title:'An idea for a tiny app',html:'<p>What if collecting ideas felt as effortless as writing on a sticky note, but you could still connect everything?</p><p>See <span class="ref-inline" contenteditable="false" data-ref="a5">My reading list</span> for inspiration.</p>',tags:['ideas','design'],color:'mint',created:4,updated:4},
 {id:'a5',type:'collection',title:'My reading list',refs:['a3','a8','a4'],tags:['reading'],color:'peach',created:5,updated:5},
 {id:'a6',type:'image',title:'Color study',data:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(art),filename:'landscape-study.svg',mime:'image/svg+xml',tags:['inspiration','design'],color:'none',created:6,updated:6},
 {id:'a7',type:'checklist',title:'For the weekend',items:[{id:'c7',html:'Pick up the package',done:false},{id:'c8',html:'Get groceries',done:false},{id:'c9',html:'Call a friend',done:true}],tags:['personal'],color:'coral',created:7,updated:7},
 {id:'a8',type:'bookmark',title:'Are.na',url:'https://www.are.na/',description:'A quiet corner of the internet for connecting ideas.',tags:['reading','inspiration'],color:'lavender',created:8,updated:8},
 {id:'a9',type:'collection',title:'Website project',refs:['a2','a3','a4'],tags:['work','website'],color:'none',created:9,updated:9},
 {id:'a10',type:'file',title:'Project brief.pdf',filename:'Project brief.pdf',size:0,mime:'application/pdf',demo:true,tags:['work','website'],color:'gray',created:10,updated:10}
 ],bookmarks:[{id:'b1',kind:'object',target:'a9',label:'Website project'},{id:'b2',kind:'view',label:'Design inspiration',filters:{tags:['design'],types:[],colors:[],query:''}},{id:'b3',kind:'object',target:'a5',label:'My reading list'}],ui:{bookmarksOpen:true,tagsOpen:true,compact:false}};
}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.objects)&&Array.isArray(v.bookmarks))return v;}catch(e){}return seed();}
let db=load(),nav='home',filters={tags:[],types:[],colors:[],query:''},activeBookmark=null,openMenu=null,modalStack=[],picker=null,mention=null,toastTimer=null,captureOpen=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){showToast('Storage is full. Try a smaller file or export your data.');}}
function obj(id){return db.objects.find(o=>o.id===id);}
function visibleObjects(){return db.objects.filter(o=>nav==='trash'?!!o.deleted:nav==='archive'?!o.deleted&&!!o.archived:!o.deleted&&!o.archived);}
function plain(html){const t=document.createElement('div');t.innerHTML=String(html||'');return t.textContent||'';}
function allText(o){return [o.title||'',o.description||'',o.url||'',o.filename||'',o.html?plain(o.html):'',o.items?o.items.map(i=>plain(i.html)).join(' '):'',o.tags?o.tags.join(' '):''].join(' ').toLowerCase();}
function matches(o,ft){return (!ft.tags.length||ft.tags.every(t=>(o.tags||[]).includes(t)))&&(!ft.types.length||ft.types.includes(o.type))&&(!ft.colors.length||ft.colors.includes(o.color||'none'))&&(!ft.query||allText(o).includes(ft.query.toLowerCase()));}
function filtered(){return visibleObjects().filter(o=>matches(o,filters)).sort((a,b)=>(b.updated||0)-(a.updated||0));}
function tagsAvailable(){let test=visibleObjects().filter(o=>matches(o,filters));let counts={};test.forEach(o=>(o.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));filters.tags.forEach(t=>counts[t]=counts[t]||0);return Object.entries(counts).sort((a,b)=>a[0].localeCompare(b[0]));}
function countType(type){return visibleObjects().filter(o=>matches(o,{...filters,types:[]})&&o.type===type).length;}
function makeBase(type){return {id:uid(),type,title:'',tags:[...filters.tags],color:filters.colors.length===1?filters.colors[0]:'none',pinned:false,created:Date.now(),updated:Date.now(),...(type==='note'?{html:''}:type==='checklist'?{items:[{id:uid(),html:'',done:false}]}:type==='collection'?{refs:[]}:type==='bookmark'?{url:'',description:''}:{})};}
function touch(o){o.updated=Date.now();save();}
function displayTitle(o){return o.title||(o.type==='note'?'Untitled note':o.type==='checklist'?'Untitled checklist':o.type==='collection'?'Untitled collection':o.filename||o.url||'Untitled '+TYPES[o.type]);}
function sanitize(html){
 const t=document.createElement('template');t.innerHTML=String(html||'');
 const allow=new Set(['DIV','P','BR','STRONG','B','EM','I','U','UL','OL','LI','H2','H3','BLOCKQUOTE','SPAN','A','INPUT','S']);
 Array.from(t.content.querySelectorAll('*')).forEach(el=>{
  if(!allow.has(el.tagName)){el.replaceWith(...el.childNodes);return;}
  Array.from(el.attributes).forEach(a=>el.removeAttribute(a.name));
 });
 return sanitizeTags(t,html);
}
function sanitizeTags(template,original){
 const src=document.createElement('template');src.innerHTML=String(original||'');
 let e1=Array.from(template.content.querySelectorAll('*')),e2=Array.from(src.content.querySelectorAll('*'));
 e1.forEach((el,i)=>{
  const orig=e2[i];if(!orig)return;
  if(el.tagName==='SPAN'&&orig.getAttribute('data-ref')){el.className='ref-inline';el.dataset.ref=orig.getAttribute('data-ref').replace(/[^a-zA-Z0-9_-]/g,'');el.setAttribute('contenteditable','false');}
  if(el.tagName==='INPUT'&&orig.type==='checkbox'){el.type='checkbox';if(orig.hasAttribute('checked'))el.setAttribute('checked','');}
  if(el.tagName==='A'){const href=orig.getAttribute('href')||'';if(/^https?:\/\//i.test(href)){el.href=href;el.rel='noopener noreferrer';el.target='_blank';}}
 });
 return template.innerHTML;
}
function cleanHtml(raw){
 const t=document.createElement('template');t.innerHTML=String(raw||'');
 const allow=new Set(['DIV','P','BR','STRONG','B','EM','I','U','UL','OL','LI','H2','H3','BLOCKQUOTE','SPAN','A','INPUT','S']);
 Array.from(t.content.querySelectorAll('*')).forEach(el=>{
  if(!allow.has(el.tagName)){el.replaceWith(...el.childNodes);return;}
  const ref=el.getAttribute('data-ref'),href=el.getAttribute('href'),checked=el.hasAttribute('checked'),type=el.getAttribute('type');
  Array.from(el.attributes).forEach(a=>el.removeAttribute(a.name));
  if(el.tagName==='SPAN'&&ref){el.className='ref-inline';el.dataset.ref=ref.replace(/[^a-zA-Z0-9_-]/g,'');el.setAttribute('contenteditable','false');}
  if(el.tagName==='INPUT'&&type==='checkbox'){el.type='checkbox';if(checked)el.setAttribute('checked','');}
  if(el.tagName==='A'&&/^https?:\/\//i.test(href||'')){el.href=href;el.rel='noopener noreferrer';el.target='_blank';}
 });
 return t.innerHTML;
}
function decorate(html){
 const t=document.createElement('template');t.innerHTML=cleanHtml(html);
 t.content.querySelectorAll('.ref-inline').forEach(el=>{const target=obj(el.dataset.ref);el.textContent=target?displayTitle(target):'Missing object';el.dataset.type=target?target.type:'note';});
 return t.innerHTML;
}
function tagPills(o){if(!o.tags||!o.tags.length)return '';return '<div class="tagline">'+o.tags.slice(0,4).map(t=>'<span class="tiny-tag">#'+esc(t)+'</span>').join('')+(o.tags.length>4?'<span class="tiny-tag">+'+(o.tags.length-4)+'</span>':'')+'</div>';}
function cardBody(o){
 if(o.type==='note')return '<div class="card-preview">'+(o.html?decorate(o.html):'<span class="faint-text">Empty note</span>')+'</div>';
 if(o.type==='checklist'){
  const items=(o.items||[]).slice(0,7);const done=(o.items||[]).filter(i=>i.done).length;
  return '<div class="check-preview">'+items.map(i=>'<div class="check-row '+(i.done?'done':'')+'"><input type="checkbox" data-check-preview="'+esc(o.id)+'" data-item="'+esc(i.id)+'" '+(i.done?'checked':'')+' aria-label="Toggle checklist item"><div class="check-body">'+decorate(i.html||'')+'</div></div>').join('')+'</div><div class="check-summary">'+done+' of '+(o.items||[]).length+' completed'+((o.items||[]).length>7?' · +'+((o.items||[]).length-7)+' more':'')+'</div>';
 }
 if(o.type==='bookmark'){let host='';try{host=new URL(o.url).hostname.replace(/^www\./,'');}catch(e){host=o.url||'No URL yet';}return '<div class="card-preview">'+esc(o.description||'')+'</div><div class="external-url">'+icon('external',12)+' '+esc(host)+'</div>';}
 if(o.type==='collection'){const members=(o.refs||[]).map(id=>obj(id)).filter(Boolean);return '<div class="collection-list">'+members.slice(0,5).map(m=>'<div class="member-line">'+icon(m.type==='bookmark'?'link':m.type,14)+'<span>'+esc(displayTitle(m))+'</span></div>').join('')+'</div><div class="check-summary">'+members.length+' objects'+(members.length>5?' · +'+(members.length-5)+' more':'')+'</div>';}
 if(o.type==='image'){return o.data&&o.mime&&o.mime.startsWith('image/')?'<img loading="lazy" class="image-preview" src="'+esc(o.data)+'" alt="'+esc(o.title||'Image')+'">':'<div class="file-thumbnail">'+icon('image',27)+' <div>'+esc(o.filename||'Media file')+'<small>Open to view</small></div></div>';}
 if(o.type==='file'){return '<div class="file-thumbnail">'+icon('file',27)+'<div style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+esc(o.filename||'No file attached')+'<small>'+(o.demo?'Example · no attachment':o.size?formatSize(o.size):'Upload a file to attach')+'</small></div></div>';}
 return '';
}
function formatSize(n){return n>1024*1024?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':n+' B';}
function card(o){
 return '<article class="card color-'+esc(o.color||'none')+(o.pinned?' pinned':'')+(o.type==='image'?' has-image':'')+'" data-open="'+esc(o.id)+'" role="button" tabindex="0" aria-label="Open '+esc(displayTitle(o))+'">'+
 (o.type==='image'&&o.data&&o.mime&&o.mime.startsWith('image/')?cardBody(o):'')+
 '<div class="card-inner"><div class="card-top"><div class="object-kicker">'+icon(o.type==='bookmark'?'link':o.type,13)+' '+esc(TYPES[o.type])+'</div><div class="card-tools">'+
 (nav==='trash'?'<button class="iconbtn" data-restore="'+esc(o.id)+'" title="Restore">'+icon('rotate',16)+'</button>':'<button class="iconbtn pin-btn '+(o.pinned?'active':'')+'" data-pin="'+esc(o.id)+'" title="'+(o.pinned?'Unpin':'Pin')+'">'+icon('pin',16)+'</button>')+
 '<button class="iconbtn" data-card-more="'+esc(o.id)+'" title="More options">'+icon('more',17)+'</button></div></div>'+
 '<h3>'+esc(displayTitle(o))+'</h3>'+(o.type==='image'&&o.data&&o.mime&&o.mime.startsWith('image/')?'':cardBody(o))+tagPills(o)+'</div></article>';
}
function renderSidebar(){
 document.querySelectorAll('[data-nav]').forEach(e=>e.classList.toggle('selected',e.dataset.nav===nav&&!activeBookmark));

function renderFilters(){
 const ch=filters.tags.length+filters.types.length+filters.colors.length;
 $('tagFilter').classList.toggle('on',!!filters.tags.length);$('typeFilter').classList.toggle('on',!!filters.types.length);$('colorFilter').classList.toggle('on',!!filters.colors.length);
 $('activePills').innerHTML=filters.tags.map(t=>'<button class="filter-pill" data-remove-filter="tags" data-value="'+esc(t)+'">#'+esc(t)+' '+icon('x',12)+'</button>').join('')+filters.types.map(t=>'<button class="filter-pill" data-remove-filter="types" data-value="'+esc(t)+'">'+esc(TYPES[t])+' '+icon('x',12)+'</button>').join('')+filters.colors.map(c=>'<button class="filter-pill" data-remove-filter="colors" data-value="'+esc(c)+'"><span class="pill-dot" style="background:'+COLORS[c]+'"></span>'+esc(c==='none'?'White':c)+' '+icon('x',12)+'</button>').join('')+(ch?'<button class="textbtn" data-clear-filters="true" style="padding:5px 8px;color:#999">Clear</button>':'');
 const saved=db.bookmarks.some(b=>b.kind==='view'&&JSON.stringify(b.filters)===JSON.stringify(filters));

 $('bookmarkViewBtn').classList.toggle('hidden',nav!=='home');

function renderCards(){
 const arr=filtered(),pinned=arr.filter(o=>o.pinned),other=arr.filter(o=>!o.pinned);
 $('pageTitle').textContent=nav==='archive'?'Archive':nav==='trash'?'Trash':activeBookmark?db.bookmarks.find(b=>b.id===activeBookmark)?.label||'Saved view':'All your things';

 else document.execCommand(format,false,null);
 editorChanged();}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kept-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}
function importData(f){const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!Array.isArray(v.objects)||!Array.isArray(v.bookmarks))throw Error('Invalid format');if(!confirm('Replace the current prototype data with this backup?'))return;db=v;db.ui=db.ui||{bookmarksOpen:true,tagsOpen:true};nav='home';filters={tags:[],types:[],colors:[],query:''};activeBookmark=null;save();render();showToast('Data imported');}catch(e){alert('That is not a valid Kept JSON backup.');}};r.readAsText(f);}
function clickAction(el,e){
 const b=el.closest('button');if(!b)return false;
 if(b.dataset.nav){setNav(b.dataset.nav);return true;}
 if(b.dataset.new){createAndOpen(b.dataset.new);return true;}
 if(b.dataset.sidebarTag){toggleFilter('tags',b.dataset.sidebarTag);closeSidebar();return true;}
 if(b.dataset.openBookmark){openBookmark(b.dataset.openBookmark);return true;}
 if(b.dataset.removeFilter){toggleFilter(b.dataset.removeFilter,b.dataset.value);return true;}
 if(b.dataset.clearFilters){filters={tags:[],types:[],colors:[],query:''};activeBookmark=null;render();return true;}
 if(b.dataset.toggleFilter){toggleFilter(b.dataset.toggleFilter,b.dataset.value);showFilterMenu(b.dataset.toggleFilter==='tags'?'tag':b.dataset.toggleFilter==='types'?'type':'color');return true;}
 if(b.dataset.pin){objectAction('pin',b.dataset.pin);return true;}
 if(b.dataset.restore){objectAction('restore',b.dataset.restore);return true;}
 if(b.dataset.cardMore){cardMenu(b,b.dataset.cardMore);return true;}
 if(b.dataset.objAction){objectAction(b.dataset.objAction,b.dataset.id);return true;}
 if(b.dataset.dialogAction){const a=b.dataset.dialogAction;if(a==='close')closeEditor();else objectAction(a,modalStack[modalStack.length-1]);return true;}
 if(b.dataset.tagRemove){const o=obj(modalStack[modalStack.length-1]);o.tags=o.tags.filter(t=>t!==b.dataset.tagRemove);touch(o);renderDialog();return true;}
 if(b.dataset.editorColor){const o=obj(modalStack[modalStack.length-1]);o.color=b.dataset.editorColor;touch(o);renderDialog();return true;}
 if(b.dataset.format){runFormat(b.dataset.format);return true;}
 if(b.dataset.itemUp){checklistMove(b.dataset.itemUp,-1);return true;}
 if(b.dataset.itemDown){checklistMove(b.dataset.itemDown,1);return true;}
 if(b.dataset.itemRemove){const o=obj(modalStack[modalStack.length-1]);o.items=o.items.filter(i=>i.id!==b.dataset.itemRemove);if(!o.items.length)o.items.push({id:uid(),html:'',done:false});touch(o);renderDialog();return true;}
 if(b.dataset.memberOpen){openEditor(b.dataset.memberOpen);return true;}
 if(b.dataset.memberRemove){const o=obj(modalStack[modalStack.length-1]);o.refs=o.refs.filter(x=>x!==b.dataset.memberRemove);touch(o);renderDialog();return true;}
 if(b.dataset.pick){const cb=pickerCallback;if(cb)cb(b.dataset.pick);if(!$('pickerLayer').classList.contains('hidden'))closePicker();return true;}
 if(b.dataset.mention){insertReference(b.dataset.mention);return true;}
 if(b.dataset.settings){closePopover();if(b.dataset.settings==='export')exportData();if(b.dataset.settings==='import')$('importInput').click();if(b.dataset.settings==='reset'&&confirm('Reset the demo? This will replace all your prototype data.')){db=seed();filters={tags:[],types:[],colors:[],query:''};nav='home';activeBookmark=null;save();render();showToast('Demo reset');}return true;}
 return false;
}
document.addEventListener('click',e=>{
 if(e.target.closest('.ref-inline[data-ref]')){const el=e.target.closest('.ref-inline[data-ref]');e.preventDefault();e.stopPropagation();openEditor(el.dataset.ref);return;}
 if(clickAction(e.target,e))return;
 const cardEl=e.target.closest('.card[data-open]');if(cardEl){openEditor(cardEl.dataset.open);return;}
 if(!$('popover').contains(e.target)&&!e.target.closest('#newBtn,#settingsBtn,#tagFilter,#typeFilter,#colorFilter,[data-card-more]'))closePopover();
 if(captureOpen&&!e.target.closest('#capture')&&!e.target.closest('#modalLayer')&&!e.target.closest('#popover'))commitCapture();
});
$('mobileMenu').onclick=()=>{$('sidebar').classList.toggle('open');$('sidebarBackdrop').classList.toggle('hidden');};
$('sidebarBackdrop').onclick=closeSidebar;
$('bookmarksToggle').onclick=()=>{db.ui.bookmarksOpen=db.ui.bookmarksOpen===false;save();renderSidebar();};
$('tagsToggle').onclick=()=>{db.ui.tagsOpen=db.ui.tagsOpen===false;save();renderSidebar();};
$('newBtn').onclick=e=>newMenu(e.currentTarget);
$('settingsBtn').onclick=e=>settingsMenu(e.currentTarget);
$('tagFilter').onclick=()=>showFilterMenu('tag');
$('typeFilter').onclick=()=>showFilterMenu('type');
$('colorFilter').onclick=()=>showFilterMenu('color');
$('bookmarkViewBtn').onclick=bookmarkView;
$('toggleLayout').onclick=()=>{db.ui.compact=!db.ui.compact;save();renderCards();showToast(db.ui.compact?'Compact layout':'Comfortable layout');};
$('captureTrigger').onclick=expandCapture;
$('captureDone').onclick=commitCapture;
$('captureText').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();commitCapture();}});
$('searchInput').addEventListener('input',e=>{filters.query=e.target.value;activeBookmark=null;renderCards();renderSidebar();});
$('modalLayer').addEventListener('click',e=>{if(e.target===$('modalLayer'))closeEditor();});
$('pickerLayer').addEventListener('click',e=>{if(e.target===$('pickerLayer'))closePicker();});
$('pickerSearch').addEventListener('input',renderPicker);
$('importInput').addEventListener('change',e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';});
$('dialog').addEventListener('input',e=>{
 const t=e.target;if(t.id==='editorTitle'||t.id==='noteContent'||t.id==='linkUrl'||t.id==='linkDesc'){editorChanged();if(t.id==='noteContent')findAndShowMention(t);}
 if(t.dataset.itemEdit)checklistInput(t);
});
$('dialog').addEventListener('change',e=>{
 const t=e.target,o=obj(modalStack[modalStack.length-1]);if(!o)return;
 if(t.dataset.itemCheck){const item=o.items.find(x=>x.id===t.dataset.itemCheck);if(item){item.done=t.checked;touch(o);t.closest('.check-edit-row')?.classList.toggle('done',item.done);}}
 if(t.id==='uploadFile')handleUpload(t.files[0],o);
 if(t.id==='noteContent')editorChanged();
 if(t.type==='checkbox'&&t.closest('#noteContent')){t.toggleAttribute('checked',t.checked);editorChanged();}
});
$('dialog').addEventListener('keydown',e=>{
 const t=e.target;
 if(t.id==='tagInput'&&(e.key==='Enter'||e.key===',')){e.preventDefault();addTag();}
 if(t.dataset.itemEdit&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();addChecklistItem(t.dataset.itemEdit);}
 if(t.dataset.itemEdit&&e.key==='Backspace'&&!t.textContent.trim()){const o=obj(modalStack[modalStack.length-1]);if(o.items.length>1){e.preventDefault();const idx=o.items.findIndex(i=>i.id===t.dataset.itemEdit);o.items.splice(idx,1);touch(o);renderDialog();document.querySelectorAll('[data-item-edit]')[Math.max(0,idx-1)]?.focus();}}
 if(t.dataset.itemEdit&&(e.ctrlKey||e.metaKey)&&e.key===' '){e.preventDefault();insertReferenceUsingPicker();}
 if(t.id==='noteContent'&&e.key==='Escape')closeMention();
});
$('dialog').addEventListener('click',e=>{
 const t=e.target;
 if(t.id==='editorBack')closeEditor(true);
 if(t.id==='addCheckItem')addChecklistItem();
 if(t.id==='addExisting'){const o=obj(modalStack[modalStack.length-1]);openPicker('Add to '+displayTitle(o),id=>{if(!o.refs.includes(id)){o.refs.push(id);touch(o);}closePicker();renderDialog();},[o.id,...o.refs]);}
});
$('objectsArea').addEventListener('change',e=>{const t=e.target;if(t.dataset.checkPreview){const o=obj(t.dataset.checkPreview),item=o?.items?.find(x=>x.id===t.dataset.item);if(item){item.done=t.checked;touch(o);renderCards();}}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('mentionMenu').classList.contains('hidden'))closeMention();else if(!$('pickerLayer').classList.contains('hidden'))closePicker();else if(openMenu)closePopover();else if(!$('modalLayer').classList.contains('hidden'))closeEditor();else if(captureOpen)commitCapture();else closeSidebar();return;}
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('searchInput').focus();$('searchInput').select();return;}
 const editing=e.target.closest('input,textarea,[contenteditable=true]');if(!editing&&e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();expandCapture();}
 if(!editing&&(e.key==='Enter'||e.key===' ')&&e.target.closest('.card[data-open]')){e.preventDefault();openEditor(e.target.closest('.card').dataset.open);}
});
$('mentionMenu').addEventListener('mousedown',e=>{if(e.target.closest('[data-mention]'))e.preventDefault();});
document.addEventListener('mousedown',e=>{if(e.target.closest('[data-format]'))e.preventDefault();});
let dragDepth=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer?.types?.includes('Files')){dragDepth++;$('dropveil').classList.remove('hidden');}});document.addEventListener('dragleave',e=>{if(e.dataTransfer?.types?.includes('Files')){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('dropveil').classList.add('hidden');}});document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files'))e.preventDefault();});document.addEventListener('drop',e=>{if(e.dataTransfer?.files?.length){e.preventDefault();dragDepth=0;$('dropveil').classList.add('hidden');const file=e.dataTransfer.files[0],type=file.type.startsWith('image/')||file.type.startsWith('audio/')||file.type.startsWith('video/')?'image':'file';const o=makeBase(type);db.objects.unshift(o);handleUpload(file,o);openEditor(o.id,true);}});
save();render();
})();
</script>
</body>
</html>
