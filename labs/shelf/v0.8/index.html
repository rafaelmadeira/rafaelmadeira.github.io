function seed(){
 var iv="f-ivrnet", personal="f-personal", alp="p-alpine", pci="p-pci", trip="p-trip", inbox="p-inbox";

  {id:personal,kind:"folder",parent:null,title:"Personal"},

   {id:uid(),type:"list",title:"Next actions",items:[{id:uid(),text:"Review the latest client feedback",done:false},{id:uid(),text:"Check the staging website",done:false},{id:uid(),text:"Record the next action",done:false}]},
   {id:uid(),type:"divider",title:"Reference material",collapsed:false},
   {id:uid(),type:"file",title:"Project files",fileName:"",size:0,mime:"",assetId:""},
   {id:uid(),type:"gallery",title:"Screenshots",photos:[]},
   {id:uid(),type:"note",title:"Decisions & notes",body:"Add a new note whenever something worth remembering changes."}
  ]},
  {id:pci,kind:"page",parent:iv,title:"Schallertel PCI",blocks:[{id:uid(),type:"note",title:"Context",body:"A place to keep the issue details, responses and decisions together."},{id:uid(),type:"list",title:"Follow-up",items:[{id:uid(),text:"Review the latest response",done:false}]}]},
  {id:trip,kind:"page",parent:personal,title:"West coast trip · example",blocks:[{id:uid(),type:"list",title:"Things to do",items:[{id:uid(),text:"See a movie",done:false},{id:uid(),text:"Book the flights",done:false},{id:uid(),text:"Reserve a rental car",done:false}]},{id:uid(),type:"divider",title:"Travel information",collapsed:false},{id:uid(),type:"note",title:"Itinerary",body:"Flight details, directions, reservations, and ideas all live on this page."},{id:uid(),type:"gallery",title:"Trip pictures",photos:[]}]},
  {id:inbox,kind:"page",parent:null,title:"Scratchpad",blocks:[{id:uid(),type:"note",title:"Quick notes",body:"Pages can live directly under Pages, without creating a folder first."}]}
 ],bookmarks:[alp],expanded:{[iv]:true,[personal]:true},active:alp};
}

try{state=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem("shelf-pages-backpack-v07")||"null");if(!state||!Array.isArray(state.nodes))state=seed()}catch(err){state=seed()}

function node(id){return state.nodes.find(function(x){return x.id===id})}
function page(){var n=node(state.active);return n&&n.kind==="page"?n:null}

 if(e.key==="Enter"&&t.hasAttribute("data-task-text")){e.preventDefault();var list=byId(t.getAttribute("data-task-text")),existing=list&&list.items.findIndex(function(i){return i.id===t.getAttribute("data-task-id")});if(existing>=0){list.items.splice(existing+1,0,{id:uid(),text:"",done:false});save();var nextId=list.items[existing+1].id;paintPage();var next=screen.querySelector('[data-task-id="'+nextId+'"][data-task-text]');if(next)next.focus()}}

document.getElementById("search").addEventListener("input",renderSearch);
document.getElementById("modal-form").addEventListener("submit",function(e){e.preventDefault();var val=document.getElementById("modal-input").value.trim();if(val&&dialogDone){var cb=dialogDone;closeDialog();cb(val)}});
document.getElementById("modal-cancel").addEventListener("click",closeDialog);
document.getElementById("modal-back").addEventListener("click",function(e){if(e.target===this)closeDialog()});
document.getElementById("photo-overlay").addEventListener("click",function(){this.classList.remove("visible")});
document.getElementById("pick-files").addEventListener("change",async function(){var files=Array.from(this.files||[]),pending=pendingPicker;this.value="";pendingPicker=null;if(!files.length||!pending)return;var p=page();if(!p)return;var file=files[0],assetId=uid();try{await putAsset(assetId,file);if(pending.type==="newfile"){p.blocks.splice(Math.max(0,Math.min(pending.index,p.blocks.length)),0,{id:uid(),type:"file",title:"",fileName:file.name,mime:file.type,size:file.size,assetId:assetId})}else{var b=byId(pending.blockId);if(!b)return;b.fileName=file.name;b.mime=file.type;b.size=file.size;b.assetId=assetId}save();paintPage();notify("File attached to page.")}catch(err){notify("Could not store file: "+err.message)}});
document.getElementById("pick-photos").addEventListener("change",async function(){var files=Array.from(this.files||[]),pending=pendingPicker;this.value="";pendingPicker=null;if(!pending||!files.length)return;var b=byId(pending.blockId);if(!b)return;try{for(var file of files){var aid=uid();await putAsset(aid,file);b.photos.push({id:aid,name:file.name})}save();paintPage();notify(files.length+" picture(s) added.")}catch(err){notify("Could not store pictures: "+err.message)}});
document.getElementById("pick-import").addEventListener("change",function(){if(this.files&&this.files[0])importBackup(this.files[0]);this.value=""});
document.addEventListener("dragstart",function(e){var handle=e.target.closest("[data-drag]");if(!handle)return;dragIndex=Number(handle.getAttribute("data-drag"));e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragIndex))});
document.addEventListener("dragover",function(e){var target=e.target.closest("[data-block-index]");if(dragIndex!==null&&target){e.preventDefault();e.dataTransfer.dropEffect="move";target.classList.add("drag-target")}});
document.addEventListener("dragleave",function(e){var target=e.target.closest("[data-block-index]");if(target)target.classList.remove("drag-target")});
document.addEventListener("drop",function(e){var target=e.target.closest("[data-block-index]");if(dragIndex===null||!target)return;e.preventDefault();var to=Number(target.getAttribute("data-block-index")),p=page();if(p&&to!==dragIndex){var moved=p.blocks.splice(dragIndex,1)[0];p.blocks.splice(to,0,moved);save();paintPage()}dragIndex=null});
document.addEventListener("dragend",function(){dragIndex=null;screen.querySelectorAll(".drag-target").forEach(function(t){t.classList.remove("drag-target")})});
save();paint();
})();
</script>
