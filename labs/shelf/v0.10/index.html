<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Shelf — Save anything · v0.10</title>
<style>
:root{
 --bg:#f9f9f8;--side:#f4f4f2;--paper:#ffffff;--ink:#232526;--muted:#797d7f;--dim:#9ba0a2;--line:#e6e7e6;--hover:#e9eae8;--select:#e7edf8;--blue:#287bd2;
 --shadow:0 7px 27px rgba(32,37,44,.075);--shadow-lg:0 19px 65px rgba(34,38,42,.20);
 --radius:11px;color-scheme:light
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.52 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid #7daee7;outline-offset:2px}
svg{vertical-align:middle;flex-shrink:0}
a{color:#216cbd}
.shell{display:flex;height:100dvh;overflow:hidden}
.sidebar{width:250px;flex:0 0 250px;display:flex;flex-direction:column;background:var(--side);border-right:1px solid #e8e8e6}
.side-head{height:60px;display:flex;align-items:center;padding:0 14px 0 17px;gap:9px}
.logo{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;color:#fff;background:#282b2d}
.brand{font-weight:740;font-size:15px;letter-spacing:-.035em;flex:1}
.icon-btn{border:0;background:none;color:#777d81;display:grid;place-items:center;width:31px;height:31px;border-radius:7px;padding:0}
.icon-btn:hover{background:#e6e7e5;color:#34383b}
.side-scroll{overflow:auto;flex:1;scrollbar-width:thin;scrollbar-color:#d7d8d6 transparent;padding-bottom:15px}
.side-top{margin:8px 7px 18px}
.side-row{min-height:34px;display:flex;gap:11px;align-items:center;padding:0 10px;color:#535759;text-align:left;border:0;background:transparent;width:100%;border-radius:7px;font-size:12.5px}
.side-row:hover,.folder-row:hover{background:#e7e8e6}
.side-row.active,.folder-row.active{background:#e2e9f3;color:#1d518f;font-weight:630}
.side-row.active .side-ico{color:#3877b8}
.side-ico{color:#777e82;display:grid;place-items:center;width:18px}
.side-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-size:10.5px;font-weight:480;color:#9b9fa1;flex-shrink:0}
.side-title{font-size:10.5px;color:#9b9c9c;font-weight:670;letter-spacing:.055em;text-transform:uppercase;margin:16px 15px 6px;display:flex;align-items:center;min-height:21px;gap:5px}
.side-title .title-open{background:none;color:inherit;border:0;font-size:inherit;font-weight:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;padding:0;flex:1}
.side-title .title-open:hover{color:#42484b}
.side-title button.add{border:0;background:none;color:#999e9f;border-radius:5px;width:22px;height:22px;display:grid;place-items:center;padding:0}
.side-title button.add:hover{color:#454a4d;background:#e7e7e4}
.sidebar-section{margin:0 7px 5px}
.folder-row{min-height:34px;display:flex;gap:4px;align-items:center;padding:0 7px;border-radius:7px;color:#515659}
.folder-row.active{color:#195b94}
.folder-chevron{background:none;border:0;color:#9ca1a4;display:grid;place-items:center;padding:0;flex-shrink:0;width:17px;height:24px;border-radius:4px}
.folder-chevron:hover{background:#dedfdd}
.folder-label{flex:1;display:flex;align-items:center;gap:9px;background:none;border:0;min-width:0;text-align:left;padding:0;color:inherit;font-size:12.5px}
.folder-label .truncate{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.folder-symbol{color:#7e8790;display:grid;place-items:center}
.quicklink{padding-left:15px}
.filter-list{max-height:none}
.sidebar-section .side-row{padding-left:12px}
.side-footer{border-top:1px solid #e2e3e1;padding:11px 8px 8px}
.bottom-meta{border-top:1px solid #e6e7e6;margin-top:8px;padding:10px 9px 0;display:flex;justify-content:space-between;gap:5px;align-items:center;color:#a2a5a6;font-size:10px}
.bottom-meta button{border:0;background:none;color:#8e9293;padding:2px;font-size:10.5px}
.bottom-meta button:hover{color:#34383b}
.main{min-width:0;flex:1;overflow-y:auto;position:relative;scrollbar-width:thin;scrollbar-color:#dcdddb transparent}
.topbar{position:sticky;top:0;z-index:8;height:61px;border-bottom:1px solid #ececea;background:#f9f9f8f2;backdrop-filter:blur(14px);display:flex;align-items:center;gap:16px;padding:0 31px}
.search-wrap{display:flex;gap:10px;align-items:center;max-width:480px;flex:1;color:#989da0;position:relative}
.search-wrap input{border:0;outline:0;background:transparent;font-size:13px;min-width:0;flex:1;height:39px;color:#313639}
.search-wrap input::placeholder{color:#999d9e}
.keycap{color:#aeb2b2;border:1px solid #e2e3e2;font-size:10px;padding:1px 6px;border-radius:5px}
.top-spacer{flex:1}
.avatar-mini{height:31px;width:31px;border:1px solid #dddeda;border-radius:50%;background:#f0efea;display:grid;place-items:center;color:#777b78}
.new-capture{border:1px solid #e0e3e1;border-radius:8px;background:white;color:#404a51;padding:7px 12px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:12px}
.new-capture:hover{background:#f0f6fb;border-color:#b6d1e8}
.content{max-width:1550px;margin:0 auto;padding:30px 34px 80px;min-height:100%}
.view-head{display:flex;gap:14px;align-items:flex-start;margin:4px 0 19px}
.head-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#ededeb;color:#6e767a;flex-shrink:0}
.view-head h1{font-size:23px;font-weight:730;letter-spacing:-.045em;line-height:1.25;margin:2px 0 3px}
.view-sub{font-size:12px;color:#909596}
.head-right{margin-left:auto;display:flex;align-items:center;gap:7px}
.soft-btn{border:1px solid #e0e1df;background:white;color:#646b6f;padding:7px 11px;border-radius:8px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.soft-btn:hover{background:#f5f8fa;color:#344f66;border-color:#cbd8e2}
.capture{background:#fff;border:1px solid #e3e4e2;border-radius:12px;box-shadow:0 3px 12px #171d2310;margin:22px 0 29px;max-width:770px;transition:border-color .16s,box-shadow .16s}
.capture:focus-within,.capture.drop-over{border-color:#adcbe6;box-shadow:0 5px 23px #3975b21b}
.capture-main{display:flex;align-items:flex-start;gap:13px;padding:16px 17px 10px}
.capture-mark{color:#8d9699;margin-top:3px}
.capture-text{width:100%;min-height:26px;max-height:165px;resize:vertical;background:none;outline:0;border:0;line-height:1.6;color:#333638;font-size:13px;overflow:auto}
.capture-text::placeholder{color:#9b9fa1}
.capture-bottom{display:flex;align-items:center;gap:8px;border-top:1px solid #f1f1ee;padding:8px 12px 9px}
.capture-hint{font-size:11px;color:#a1a5a7;flex:1}
.capture-tool{width:31px;height:29px;border:0;background:transparent;color:#868f93;border-radius:6px;display:grid;place-items:center}
.capture-tool:hover{background:#f0f2f3;color:#4b6f8b}
.capture-save{border:0;background:#303a42;color:#fff;border-radius:7px;font-weight:600;padding:7px 12px;font-size:11.5px;min-width:56px}
.capture-save:hover{background:#1e6da8}
.capture-save:disabled{opacity:.35}
.section{margin:0 0 26px}
.section-header{display:flex;align-items:center;gap:11px;margin-bottom:13px}
.section-label{font-size:11px;font-weight:680;color:#777c7e;letter-spacing:.025em}
.section-count{font-size:10.5px;color:#aaaeb0}
.section-rule{height:1px;background:#e8e8e6;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;align-items:start}
.card{min-width:0;position:relative;cursor:pointer;border:1px solid #e5e6e3;background:var(--card-bg,#fff);border-radius:10px;overflow:hidden;box-shadow:0 2px 7px rgba(32,36,38,.025);transition:border-color .13s,box-shadow .13s,transform .13s}
.card:hover,.card:focus-visible{border-color:#cad0d2;box-shadow:var(--shadow);transform:translateY(-1px);outline:none}
.card.dragging{opacity:.48}
.card-image{width:100%;height:143px;background:linear-gradient(135deg,#e4e8e8,#f2f3f3);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9aa7aa}
.card-image img.cover-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.card-image .picture-placeholder{font-size:42px}
.card-link-cover{background:linear-gradient(135deg,#e7ecf2,#f8fafc);color:#8192a7}
.card-media-cover{background:linear-gradient(135deg,#dae7ed,#ecebe6);color:#798f9e}
.card-folder-cover{background:linear-gradient(135deg,#f1eee6,#f7f6f2);color:#b39a70}
.card-file-cover{background:linear-gradient(135deg,#e6edf2,#f6f8f9);color:#7895a9}
.card-cover-domain{position:absolute;bottom:12px;left:13px;color:#75889a;font-size:10.5px;max-width:calc(100% - 26px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cover-domain.favicon-domain{display:flex;align-items:center;gap:6px}
.favicon{height:17px;width:17px;border-radius:4px;object-fit:contain;background:#fff;box-shadow:0 0 0 1px #00000009}
.card-main{padding:12px 14px 13px;min-height:78px}
.card-title{font-size:13px;font-weight:665;line-height:1.4;color:#33383a;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-note{font-size:12.5px;line-height:1.65;color:#4f5558;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.card.note-card .card-main{min-height:118px}
.card.note-card .card-title{margin-bottom:7px}
.card-note:empty{display:none}
.card-summary{font-size:11px;color:#8d9497;margin-top:7px;display:flex;align-items:center;gap:6px;min-width:0}
.card-summary .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.tag-chip{font-size:10px;color:#7b858a;border-radius:5px;background:#f2f3f2;padding:3px 6px}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:5px;z-index:2;opacity:0;transition:opacity .12s}
.card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
.card-action{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;border:1px solid #e3e4e3c9;background:#fffefaed;box-shadow:0 1px 5px #0000000f;color:#6f797e;padding:0}
.card-action:hover{background:#fff;color:#2f5c83}
.card-action.visit{opacity:1;color:#2e7bb9}
.card-pin{position:absolute;left:10px;top:9px;color:#8a969a;background:#ffffffc9;border-radius:5px;padding:3px;z-index:1}
.card-folder-name{color:#8c7a5a}
.empty{border:1px dashed #e1e4e1;border-radius:11px;background:#fff8;padding:42px 18px;text-align:center;color:#a0a5a7}
.empty h3{font-size:15px;font-weight:650;color:#666d70;margin:7px 0 6px}
.empty p{font-size:12px;margin:0;color:#a1a5a7}
.empty button{border:1px solid #dce2e6;background:#fff;padding:8px 12px;border-radius:7px;color:#416b8b;margin-top:12px}
.folder-breadcrumbs{display:flex;gap:7px;align-items:center;font-size:11px;color:#959a9d;margin:0 0 10px}
.folder-breadcrumbs button{border:0;padding:0;background:none;color:#6a8294}
.folder-breadcrumbs button:hover{text-decoration:underline}
.modal-layer{position:fixed;inset:0;z-index:90;background:#1f252b75;display:none;align-items:center;justify-content:center;padding:20px}
.modal-layer.open{display:flex}
.detail{width:min(640px,100%);max-height:min(90vh,950px);background:var(--detail-bg,#fff);border:1px solid #ffffff8c;border-radius:16px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden}
.detail-top{height:48px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:7px 13px;border-bottom:1px solid #ffffff60}
.detail-type{font-size:10.5px;color:#8a9195;letter-spacing:.025em;flex:1;display:flex;align-items:center;gap:7px}
.detail-top .icon-btn:hover{background:#0000000d}
.detail-top .icon-btn.active{color:#bc9350}
.detail-scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#ddd transparent;padding:21px 27px 7px;flex:1}
.detail-title{width:100%;font-size:23px;font-weight:665;letter-spacing:-.035em;line-height:1.3;background:none;border:0;outline:0;color:#2c3335;padding:0;min-height:30px}
.detail-title::placeholder{color:#a5abad}
.detail-body{width:100%;display:block;font-size:13.5px;line-height:1.7;color:#485154;resize:vertical;min-height:130px;background:none;border:0;outline:0;margin:13px 0 10px;padding:0}
.detail-body::placeholder{color:#a3aaad}
.detail-media{margin:6px 0 18px;display:flex;flex-direction:column;gap:8px}
.detail-media img{max-width:100%;max-height:340px;object-fit:contain;border-radius:9px;background:#f1f3f3;align-self:flex-start}
.detail-meta{padding:12px 27px 15px;border-top:1px solid #e5e6e4;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#ffffff65}
.detail-tool{border:1px solid #e3e5e3;border-radius:7px;background:#ffffffb7;display:flex;align-items:center;gap:7px;color:#737d81;font-size:11px;padding:8px 9px;max-width:100%}
.detail-tool:hover{border-color:#cad5dc;color:#35658a}
.detail-tool.active{color:#a77c3a;background:#fff4d8;border-color:#ecddb8}
.detail-tool .crop{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:132px}
.detail-status{margin-left:auto;font-size:10px;color:#a2a6a8}
.detail-url{display:flex;align-items:center;gap:9px;margin:14px 0;padding:11px 12px;background:#f4f6f7;border-radius:8px;font-size:12px;color:#63727b;min-width:0}
.detail-url span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-url a{font-weight:610;text-decoration:none;white-space:nowrap}
.detail-tags{display:flex;align-items:center;gap:8px;margin:13px 0 3px}
.detail-tags label{font-size:10.5px;color:#929a9d;white-space:nowrap}
.detail-tags input{background:#fff9;border:1px solid #e0e2e1;border-radius:7px;color:#566166;padding:7px 9px;flex:1;min-width:0;font-size:12px}
.detail-tags input::placeholder{color:#aab0b3}
.picker-panel{position:fixed;z-index:110;background:#fff;border:1px solid #dfe2e1;border-radius:11px;box-shadow:0 14px 48px #20272d29;padding:7px;width:min(255px,calc(100vw - 24px));max-height:min(420px,75vh);overflow-y:auto;display:none}
.picker-panel.open{display:block}
.pop-row{border:0;background:none;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;font-size:12px;color:#4c5559;border-radius:7px}
.pop-row:hover{background:#f0f3f5}
.pop-row.danger{color:#b35750}
.pop-break{height:1px;background:#edf0ee;margin:6px 2px}
.colors{display:flex;gap:9px;flex-wrap:wrap;padding:11px}
.color-choice{width:27px;height:27px;border:1px solid #d5d9d9;border-radius:50%;position:relative}
.color-choice.selected{outline:2px solid #7da6c8;outline-offset:2px}
.date-pop{padding:13px}
.date-pop label{font-size:11px;color:#7c858a;display:block;margin-bottom:7px}
.date-pop input{width:100%;padding:8px;font-size:12px;border:1px solid #dde0e0;border-radius:6px;color:#485258}
.date-pop .row{display:flex;justify-content:flex-end;gap:7px;margin-top:11px}
.date-pop .row button{border:1px solid #e1e3e1;background:#fff;border-radius:6px;padding:6px 9px;color:#606b70;font-size:11px}
.dialog-overlay{position:fixed;inset:0;z-index:120;background:#2e353959;display:none;align-items:center;justify-content:center;padding:20px}
.dialog-overlay.open{display:flex}
.dialog{width:min(410px,100%);background:#fff;border-radius:13px;box-shadow:var(--shadow-lg);padding:22px 23px}
.dialog h2{font-size:17px;letter-spacing:-.025em;margin:0 0 7px}
.dialog p{font-size:12px;color:#8b9294;margin:0 0 15px}
.dialog input{width:100%;padding:11px 12px;background:#fff;border:1px solid #d8dede;border-radius:8px;font-size:13px;outline:0}
.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
.dialog-actions button{border:1px solid #dce0df;background:#fff;border-radius:7px;padding:8px 13px;font-size:12px}
.dialog-actions .primary{background:#2c7cb7;color:white;border-color:#2c7cb7}
.toast{position:fixed;bottom:22px;right:24px;background:#303b41;color:#fff;box-shadow:var(--shadow);border-radius:9px;padding:11px 15px;font-size:12px;z-index:150;display:none}
.toast.open{display:block}
.drop-indicator{position:fixed;inset:10px;z-index:80;border:3px dashed #9dc0d9;border-radius:14px;background:#e8f2f9cd;display:none;place-items:center;color:#2d6189;font-size:20px;font-weight:650;pointer-events:none}
.drop-indicator.open{display:grid}
@media(max-width:860px){.sidebar{width:217px;flex-basis:217px}.content{padding:25px 22px 70px}.topbar{padding:0 22px}.cards{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}}
@media(max-width:580px){.sidebar{width:174px;flex-basis:174px}.side-row{font-size:11.5px}.side-head{padding-left:10px}.brand{font-size:13px}.content{padding:17px 13px 60px}.topbar{padding:0 12px}.keycap{display:none}.cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.card-image{height:114px}.card-main{padding:10px}.view-head h1{font-size:19px}.capture-hint{font-size:10px}.new-capture{font-size:0;padding:7px}.detail-scroll{padding:15px 19px}.detail-meta{padding:10px 17px}.modal-layer{padding:8px}}
@media(max-width:410px){.sidebar{width:136px;flex-basis:136px}.sidebar .count{display:none}.side-row{gap:7px}.side-row,.folder-label{font-size:10.5px}.section-title{margin-left:8px}.cards{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
  <div class="side-head"><span class="logo" aria-hidden="true" data-icon="shelf"></span><span class="brand">Shelf</span><button class="icon-btn" title="New folder" aria-label="New folder" data-action="new-folder"><span data-icon="plus"></span></button></div>
  <div class="side-scroll">
    <div class="side-top" id="side-top"></div>
    <div class="side-title"><button class="title-open" data-action="go-starred">Starred</button></div><div class="sidebar-section" id="side-starred"></div>
    <div class="side-title"><button class="title-open" data-action="section-folders">Folders</button><button class="add" data-action="new-folder" title="New folder" aria-label="Create folder"><span data-icon="plus"></span></button></div><div class="sidebar-section" id="side-folders"></div>
    <div class="side-title"><button class="title-open" data-action="section-filters">Filters</button></div><div class="sidebar-section filter-list" id="side-filters"></div>
    <div class="side-title"><button class="title-open" data-action="section-tags">Tags</button></div><div class="sidebar-section" id="side-tags"></div>
  </div>
  <div class="side-footer"><div id="side-bottom"></div><div class="bottom-meta"><span>LOCAL · v0.10</span><span><button data-action="export" title="Export a backup">Export</button> · <button data-action="import" title="Import a backup">Import</button></span></div></div>
</aside>
<main class="main" id="main">
  <div class="topbar">
    <div class="search-wrap"><span data-icon="search"></span><input type="search" id="search" placeholder="Search everything…" autocomplete="off" aria-label="Search everything"><span class="keycap">/</span></div>
    <span class="top-spacer"></span><button class="new-capture" data-action="focus-capture"><span data-icon="plus"></span> New</button><span class="avatar-mini" title="Local prototype">◫</span>
  </div>
  <div id="view" class="content"></div>
</main>
</div>
<div id="detail-layer" class="modal-layer" aria-hidden="true"><div class="detail" id="detail-dialog">
  <div class="detail-top"><span class="detail-type" id="detail-type"></span><button class="icon-btn" id="detail-pin" data-action="toggle-pin" title="Pin to top" aria-label="Pin to top"></button><button class="icon-btn" id="detail-star" data-action="toggle-star" title="Add to Starred" aria-label="Add to Starred"></button><button class="icon-btn" data-action="detail-more" title="More options" aria-label="More options"><span data-icon="more"></span></button><button class="icon-btn" data-action="close-detail" title="Close" aria-label="Close"><span data-icon="x"></span></button></div>
  <div class="detail-scroll" id="detail-content"></div>
  <div class="detail-meta" id="detail-meta"></div>
</div></div>
<div class="picker-panel" id="picker"></div>

function descendantsOf(folderId){var ids=new Set([folderId]),changed=true;while(changed){changed=false;state.objects.forEach(function(o){if(o.kind==="folder"&&o.folderId&&ids.has(o.folderId)&&!ids.has(o.id)){ids.add(o.id);changed=true}})}return ids}

function matchesView(o){
 var a=state.active;
 if(a.type==="trash")return !!o.trashed;
 if(o.trashed)return false;
 if(a.type==="archive")return !!o.archived;
 if(o.archived)return false;

 if(a.type==="tag")return (o.tags||[]).includes(a.id);

}
function searchMatch(o,term){var q=term.trim().toLowerCase();if(!q)return true;return [o.title,o.body,o.url,o.fileName,(o.tags||[]).join(" "),o.category].join(" ").toLowerCase().includes(q)}

function viewInfo(){var a=state.active;

 if(a.type==="reminders")return {title:"Reminders",subtitle:"Items with a reminder date.",icon:"bell"};
 if(a.type==="archive")return {title:"Archive",subtitle:"Out of sight, still here when you need it.",icon:"archive"};
 if(a.type==="trash")return {title:"Trash",subtitle:"Removed items stay here until you delete them permanently.",icon:"trash"};
 if(a.type==="folder"){var f=obj(a.id);return {title:f?f.title:"Folder",subtitle:f&&f.body?f.body:"Everything inside this folder.",icon:"folder"}}

function host(url){try{return new URL(url).hostname.replace(/^www\./,"")}catch(e){return ""}}

function favicon(url){var h=host(url);return h?'https://www.google.com/s2/favicons?domain='+encodeURIComponent(h)+'&sz=64':""}

}
function card(o){
 var isNote=o.kind==="note",isFolder=o.kind==="folder",isLink=!!safeUrl(o.url),tags=(o.tags||[]).slice(0,3);
 var title=o.title.trim(),body=excerpt(o),canShowBody=!!body;
 return '<article class="card'+(isNote?" note-card":"")+'" style="--card-bg:'+color(o.color)+'" tabindex="0" role="button" data-action="'+(isFolder?"open-folder":"open-detail")+'" data-id="'+esc(o.id)+'" draggable="true" data-drag-id="'+esc(o.id)+'">'+

  cover(o)+

  (canShowBody?'<div class="card-note">'+esc(body)+'</div>':"")+
  (!title&&!canShowBody?'<div class="card-title">'+esc(bestTitle(o))+'</div>':"")+
  (isFolder?'<div class="card-summary">'+icon("folder",12)+' <span>'+count("folder",o.id)+' items</span></div>':
    isLink?'<div class="card-summary">'+icon(o.kind==="video"?"video":o.kind==="image"?"image":"link",12)+' <span class="ellipsis">'+esc(host(o.url))+'</span></div>':

  '</div>'+
  (isLink?'<button class="card-action visit" style="position:absolute;right:9px;bottom:10px" data-action="visit" data-id="'+esc(o.id)+'" title="Open original" aria-label="Open original">'+icon("external",15)+'</button>':"")+
  '</article>'
}

document.addEventListener("keydown",function(e){
 var t=e.target;
 if(e.key==="Escape"){if(document.getElementById("dialog-overlay").classList.contains("open"))closeDialog();else if(picker.classList.contains("open"))hidePicker();else if(openId)closeDetail();else if(t.id==="search"){t.value="";navigate("all")}return}
 if(e.key==="/"&&!["INPUT","TEXTAREA"].includes(t.tagName)){e.preventDefault();document.getElementById("search").focus();return}
 if(e.key==="Enter"&&t.id==="capture-text"&&!e.shiftKey){e.preventDefault();saveCapture();return}
 if((e.key==="Enter"||e.key===" ")&&t.matches(".card[role=button]")){e.preventDefault();t.click();return}
});
document.getElementById("file-picker").addEventListener("change",function(){addFiles(this.files);this.value=""});
document.getElementById("image-picker").addEventListener("change",function(){addFiles(this.files);this.value=""});
document.getElementById("import-picker").addEventListener("change",function(){if(this.files[0])importBackup(this.files[0]);this.value=""});
document.addEventListener("paste",function(e){if(!e.target.matches("#capture-text"))return;var files=Array.from(e.clipboardData&&e.clipboardData.files||[]);if(files.length){e.preventDefault();addFiles(files)}});
var dragDepth=0,draggedId=null;
document.addEventListener("dragstart",function(e){var el=e.target.closest("[data-drag-id]");if(el){draggedId=el.getAttribute("data-drag-id");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",draggedId)}});
document.addEventListener("dragover",function(e){if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes("Files")){e.preventDefault();document.getElementById("drop-indicator").classList.add("open")}if(draggedId&&e.target.closest("[data-folder-drop]")){e.preventDefault()}});
document.addEventListener("dragleave",function(e){if(e.relatedTarget===null&&!draggedId)document.getElementById("drop-indicator").classList.remove("open")});
document.addEventListener("drop",function(e){document.getElementById("drop-indicator").classList.remove("open");if(draggedId){var f=e.target.closest("[data-folder-drop]");if(f){e.preventDefault();var o=obj(draggedId),destination=f.getAttribute("data-folder-drop");if(o&&o.id!==destination&&!(o.kind==="folder"&&descendantsOf(o.id).has(destination))){o.folderId=destination;touch(o);paint();toast("Moved to folder")}}draggedId=null;return}var files=e.dataTransfer&&e.dataTransfer.files;if(files&&files.length){e.preventDefault();addFiles(files)}});
document.addEventListener("dragend",function(){draggedId=null;document.getElementById("drop-indicator").classList.remove("open")});
save();paint();
})();
</script>
</body>
</html>
