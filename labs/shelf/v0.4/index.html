<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Shelf — Everything library v0.4</title>
  <style>
    :root { --bg:#111113; --sidebar:#202023; --card:#171719; --panel:#1d1d20; --surface:#29292d; --surface2:#323237; --line:#333338; --text:#ececef; --muted:#85858e; --muted2:#63636b; --blue:#2485d7; --blue2:#339df5; --focus:#5baff5; --radius:11px; color-scheme:dark }
    * { box-sizing:border-box }
    html, body { height:100%; margin:0 }
    body { background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; -webkit-font-smoothing:antialiased }
    button,input,textarea,select { font:inherit }
    button { cursor:pointer }
    button:disabled { cursor:not-allowed; opacity:.5 }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px }
    a { color:#7dbcf7 }
    .shell { display:flex; height:100dvh; width:100%; overflow:hidden }
    .sidebar { width:278px; flex:0 0 278px; background:var(--sidebar); border-right:1px solid #27272a; display:flex; flex-direction:column; z-index:2 }
    .side-head { height:54px; padding:12px 14px 7px; display:flex; align-items:center; gap:7px }
    .workspace-button { display:flex; align-items:center; gap:10px; color:#e7e7e9; border:0; background:none; font-weight:650; padding:4px 2px; min-width:0; flex:1; text-align:left }
    .workspace-avatar { border:1.5px solid #69696f; color:#a5a5aa; width:24px;height:24px; display:grid; place-items:center; border-radius:50%; flex-shrink:0 }
    .head-btn,.icon-btn { border:0;background:transparent;color:#a5a5ae;display:inline-grid;place-items:center;border-radius:8px; width:32px;height:32px;flex-shrink:0 }
    .head-btn:hover,.icon-btn:hover { background:#343438;color:#fff }
    .head-btn svg,.icon-btn svg,.nav-icon svg,.mini-icon svg { width:19px;height:19px;stroke-width:1.8 }
    .side-content { overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#454549 transparent; padding-bottom:18px; flex:1 }
    .nav-group { padding:2px 0 8px }
    .nav-caption { color:#77777e; font-size:12px; font-weight:550; margin:14px 14px 8px; display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em }
    .nav-caption button { border:0;background:transparent;color:#8e8e95;padding:2px;display:grid;place-items:center }
    .nav-caption button:hover { color:#fff }
    .nav-item { border:0; background:transparent; width:100%; color:#e2e2e5; font-size:13px; font-weight:480; text-align:left; min-height:34px; display:flex;align-items:center;gap:10px; padding:5px 14px; transition:background .11s; position:relative }
    .nav-item:hover { background:#303034 }
    .nav-item.active { background:var(--blue); color:#fff }
    .nav-item.active .count,.nav-item.active .nav-icon { color:#e5f3ff;opacity:1 }
    .nav-item.drag-over { background:#235074; box-shadow:inset 0 0 0 1px #61b1ff }
    .nav-item .count { color:#77777e; font-size:12px; margin-left:auto; font-variant-numeric:tabular-nums }
    .nav-item .nav-label { white-space:nowrap;overflow:hidden;text-overflow:ellipsis; flex:1 }
    .nav-icon { display:grid; place-items:center; flex:0 0 20px; color:#aaaaaf }
    .nav-icon svg { width:20px; height:20px }
    .nav-item.nested { padding-left:34px }
    .nav-item.nested2 { padding-left:50px }
    .nav-item .collection-edit { border:0; padding:2px; color:inherit; background:transparent; display:none; align-items:center; margin-left:2px; border-radius:5px }
    .nav-item:hover .collection-edit { display:flex }
    .nav-item:hover .count { display:none }
    .nav-item.nested::before,.nav-item.nested2::before { content:"";position:absolute;left:23px;top:0;bottom:0;border-left:1px solid #3d3d42 }
    .side-bottom { padding:12px 13px 13px; border-top:1px solid #2c2c30; display:flex;gap:8px;align-items:center }
    .demo-badge { font-size:11px; color:#85858b;flex:1; white-space:nowrap }
    .bottom-action { border:1px solid #424247; background:transparent;color:#babac0;padding:5px 9px;border-radius:6px;font-size:11px }
    .bottom-action:hover { background:#303036;color:#fff }
    .main { flex:1; overflow:auto; min-width:0; position:relative }
    .main-content { padding:0 28px 84px; max-width:1720px; margin:0 auto; min-height:100% }
    .topbar { height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px; position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 90%,rgba(17,17,19,.95)); }
    .search { display:flex;align-items:center;gap:12px;flex:1; max-width:640px;color:#96969d; position:relative }
    .search svg { width:19px;height:19px;flex-shrink:0 }
    .search input { background:none; border:0;color:#f1f1f3;outline:0;width:100%;height:42px; font-size:14px;min-width:0 }
    .search input::placeholder { color:#77777e }
    .search kbd { border:1px solid #3b3b40; color:#66666c; font-size:11px; font-family:inherit; padding:1px 5px;border-radius:4px;margin-right:8px }
    .top-actions { display:flex;gap:5px;align-items:center; position:relative }
    .top-actions .icon-btn { width:34px;height:34px }
    .top-actions .icon-btn.selected { color:#7bbefa;background:#202f3e }
    .new-top { background:#288bdd;color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:640;display:flex;align-items:center;gap:7px;margin-left:8px }
    .new-top:hover { background:#3c9bea }
    .heading { margin:10px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px }
    .heading-title { display:flex;gap:12px;align-items:center;min-width:0 }
    .heading-title svg { width:24px;height:24px;stroke:#a8a8ad;stroke-width:1.6;flex-shrink:0 }
    h1 { font-size:17px;font-weight:660;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .heading-tools { display:flex;align-items:center;gap:10px;flex-shrink:0 }
    .small-muted { color:var(--muted);font-size:12px }
    .toolbar-select { border:0;background:transparent;color:#9999a2;font-size:12px;padding:5px 3px; cursor:pointer }
    .toolbar-select option { background:#202024 }
    .view-toggle { display:flex;align-items:center;border:1px solid #35353a;border-radius:7px;padding:2px;gap:1px }
    .view-toggle button { border:0;background:none;color:#85858e;display:grid;place-items:center;width:26px;height:25px;border-radius:4px }
    .view-toggle button.active { background:#3c3c42;color:#f0f0f2 }
    .view-toggle svg { width:15px;height:15px }
    .active-chips { display:flex;align-items:center;gap:7px;margin-top:-10px;margin-bottom:20px;flex-wrap:wrap }
    .chip-clear { background:#25282d;border:1px solid #3d4148;color:#b0cbe3;border-radius:16px;padding:5px 9px;font-size:11px }
    .chip-clear:hover { background:#304050 }
    .cards { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:27px 19px;align-content:start }
    .item-card { min-width:0;position:relative;cursor:pointer;outline:none }
    .item-card:hover .card-image,.item-card:focus-visible .card-image { box-shadow:0 0 0 1px #65656e; transform:translateY(-1px) }
    .card-image { background:#222225;aspect-ratio:1.6;overflow:hidden;border:1px solid #242426;border-radius:7px;position:relative;transition:box-shadow .13s,transform .13s; }
    .card-title-row { display:flex;align-items:flex-start;gap:7px;margin:10px 1px 0 }
    .card-title { font-weight:580;font-size:13.5px;line-height:1.4; color:#e8e8eb;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .card-sub { font-size:11px;color:#75757c;margin:2px 1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .card-fave { color:#e98f98;flex-shrink:0; display:grid;place-items:center }
    .card-fave svg { width:14px;height:14px;fill:currentColor }
    .card-tools { display:flex;align-items:center;gap:3px;position:absolute;z-index:1;right:8px;top:7px;opacity:0;transition:opacity .12s }
    .item-card:hover .card-tools,.item-card:focus-within .card-tools { opacity:1 }
    .card-tool { border:1px solid #ffffff25;background:#17171acc;backdrop-filter:blur(6px);color:#ddd;border-radius:6px;width:28px;height:27px;display:grid;place-items:center }
    .card-tool:hover { background:#3d3d43 }
    .card-tool svg { width:15px;height:15px }
    .card-type { position:absolute;left:10px;top:9px;border-radius:5px;color:#eaeaf0;background:#10101390;padding:4px 6px;display:flex;gap:5px;align-items:center;font-size:10px;letter-spacing:.03em;backdrop-filter:blur(4px) }
    .card-type svg { width:12px;height:12px }
    .brand-donetick { background:#f5b95e;display:flex;align-items:center;justify-content:center }
    .donetick-page { width:64%;height:102%;background:#f8f7f4;border-radius:30px 30px 0 0;position:absolute;top:15%;box-shadow:0 0 0 9px #e9ad57 }
    .donetick-face { font-size:48px;position:absolute;top:13%;width:100%;text-align:center;line-height:1 }
    .donetick-face::after { content:"";position:absolute;top:41px;left:27%;width:13%;height:12px;border-radius:50%;background:#ff6280;box-shadow:87px 0 #ff6280;opacity:.85 }
    .donetick-lines {position:absolute;bottom:11%;left:17%;height:6%;width:60%;background:#71dfd7;border-radius:9px }
    .donetick-lines:before { content:"✓";position:absolute;left:-29px;top:-19px;color:#323037;font-size:39px;font-weight:900 }
    .brand-synology { background:#242426;display:grid;place-items:center }
    .synology-nas { width:68%;height:63%;background:linear-gradient(130deg,#29292b,#1c1c1e);border:1px solid #343437;border-radius:7px;display:flex;align-items:end;justify-content:space-evenly;padding:10px;opacity:.47 }
    .synology-nas i { height:79%;width:19%;background:linear-gradient(90deg,#171719,#333337);border-radius:2px;border:1px solid #2a2a2d }
    .synology-nas i:after {content:"";display:block;width:3px;height:3px;background:#72c57a;border-radius:50%;margin:75% 0 0 45%}
    .brand-homarr { background:#100e10; display:grid;place-items:center }
    .homarr-logo { color:#ff4d57;font-weight:900;letter-spacing:-.09em;font-size:clamp(44px,5vw,88px);line-height:1; transform:scale(1.1);font-family:Arial,sans-serif }
    .homarr-logo span { color:#ff4d57;letter-spacing:-.24em; }
    .brand-generic { background:linear-gradient(135deg,var(--accent,#29354b),#17191c);padding:24px;display:flex; flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:9px }
    .generic-orbit { width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#ffffff17;color:#fff;border:1px solid #ffffff22;font-size:25px;transform:rotate(-5deg) }
    .generic-url {color:#ffffffcc;font-size:18px;font-weight:710;line-height:1.12;letter-spacing:-.04em;word-break:break-word;max-height:2.4em;overflow:hidden}
    .generic-domain {font-size:11px;color:#ffffff8c;letter-spacing:.04em}
    .thumb-note { background:linear-gradient(160deg,var(--accent,#383b3e),#242528);display:grid;place-items:center;padding:15px }
    .paper { width:84%;height:115%;background:#eae9e5;color:#24252a;position:absolute;top:13%;border-radius:6px;padding:22px 18px;box-shadow:0 13px 24px #0005;overflow:hidden;transform:rotate(-1.5deg) }
    .paper.paper-warm { background:#e8debd }
    .paper.paper-blue { background:#dbe2eb }
    .paper.paper-green { background:#dfe7d8 }
    .paper-kicker {font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#81818a;font-weight:700;margin-bottom:10px}
    .paper-title {font-size:clamp(14px,1.45vw,19px);font-weight:760;letter-spacing:-.05em;line-height:1.15;margin-bottom:10px;max-height:2.3em;overflow:hidden}
    .paper-body {font-size:10px;line-height:1.55;color:#6d6b69;white-space:pre-line;overflow:hidden;max-height:6em;overflow-wrap:anywhere}
    .thumb-checklist { background:linear-gradient(160deg,var(--accent,#253645),#14171b);display:grid;place-items:center;padding:14px }
    .check-sheet { height:110%;width:85%;position:absolute;top:13%;background:#edece8;border-radius:7px; padding:21px 17px;color:#28282b;box-shadow:0 9px 25px #0006;transform:rotate(.7deg);overflow:hidden }
    .check-head {font-weight:730;font-size:13px;line-height:1.15;margin-bottom:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .check-row {display:flex;gap:7px;align-items:center;font-size:10px;margin:7px 0;color:#555760;min-width:0}
    .check-box {border:1.5px solid #999ba0;border-radius:3px;width:12px;height:12px;flex-shrink:0;display:grid;place-items:center;font-size:10px;line-height:1 }
    .check-row.done .check-box {background:#459c88;border-color:#459c88;color:#fff}
    .check-row.done {color:#aaa; text-decoration:line-through}
    .check-row span:last-child { white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .check-progress { height:4px;border-radius:10px;background:#ccc;overflow:hidden;margin-top:14px }
    .check-progress>div { height:100%;background:#479d8a }
    .thumb-collection { background:linear-gradient(135deg,#3c3b39,#1c1d1e);display:flex;align-items:center;justify-content:center }
    .folder-hero { display:grid;place-items:center;color:#c3ae83;opacity:.93;filter:drop-shadow(0 12px 9px #0005) }
    .folder-hero svg { width:105px;height:105px;stroke-width:1.15; fill:#bb9b5e1a }
    .thumb-collection .folder-number {position:absolute;bottom:17px;color:#a8a7a4;font-size:11px}
    .thumb-image {background:linear-gradient(120deg,#a5af9d,#5b7c91);overflow:hidden}
    .art-sun {position:absolute;right:17%;top:12%;height:83px;width:83px;border-radius:50%;background:#f1c879}
    .art-hill {position:absolute;bottom:-34%;left:-10%;width:105%;height:100%;border-radius:50% 60% 0 0;background:#45675f;transform:rotate(-13deg)}
    .art-hill.two {left:40%;bottom:-42%;background:#294957;transform:rotate(10deg)}
    .thumb-image img {height:100%;width:100%;object-fit:cover;display:block;position:absolute;inset:0;z-index:3}
    .thumb-file {background:linear-gradient(130deg,var(--accent,#313440),#222326);display:grid;place-items:center}
    .file-drawing {width:100px;height:119px;background:#e0e3ec;border-radius:6px 23px 6px 6px;transform:rotate(-4deg);box-shadow:0 10px 22px #0005;position:relative;padding:20px 14px;color:#566578}
    .file-drawing:before { content:"";position:absolute;right:0;top:0;border-top:25px solid #a7afbf;border-left:25px solid transparent }
    .file-drawing:after {content:"";position:absolute;top:64px;left:14px;width:72px;height:4px;background:#b3bbc7;box-shadow:0 12px #b3bbc7,0 24px #b3bbc7}
    .file-ext {font-size:16px;font-weight:800;color:#738aa3}
    .listview { display:flex;flex-direction:column;gap:2px }
    .list-card { display:flex;gap:13px;align-items:center;min-height:63px;padding:7px 11px;border-radius:8px;border:1px solid transparent;cursor:pointer }
    .list-card:hover { background:#1d1d20;border-color:#343439 }
    .list-thumb { width:47px;height:43px;border-radius:6px; flex-shrink:0; background:var(--surface);color:#b6b6bd;display:grid;place-items:center }
    .list-thumb svg {width:21px;height:21px}
    .list-title {font-size:13px;font-weight:600;margin-bottom:4px}
    .list-desc {font-size:11px;color:#7e7e87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list-spacer {flex:1}
    .list-date {color:#73737b;font-size:11px;flex-shrink:0;margin-left:9px}
    .empty-state {text-align:center;min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#93939c }
    .empty-graphic {width:73px;height:73px;border-radius:21px;background:#26262b;display:grid;place-items:center;color:#7e7e88 }
    .empty-graphic svg {width:34px;height:34px}
    .empty-title {color:#e1e1e4;font-size:16px;font-weight:660 }
    .empty-copy {font-size:12px;max-width:280px;line-height:1.6 }
    .empty-state button {background:#303b46;border:1px solid #3d627f;color:#cce4fb;border-radius:7px;padding:8px 13px;margin-top:3px}
    .popover {position:fixed;z-index:20;background:#27272b;border:1px solid #414147;box-shadow:0 16px 60px #0008;border-radius:10px;padding:7px;min-width:205px;display:none }

    .pop-item {display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#e5e5e7;width:100%;text-align:left;border-radius:6px;padding:9px;font-size:12.5px }
    .pop-item:hover { background:#3c3c42 }
    .pop-item svg {width:18px;height:18px;color:#aaaab2}
    .pop-divider {border-top:1px solid #3b3b40;margin:6px 3px}
    .filter-popover {min-width:278px;padding:15px;max-height:75vh;overflow:auto}
    .filter-label { color:#9999a2;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 9px }
    .filter-choices {display:flex;flex-wrap:wrap;gap:6px;margin-bottom:17px }
    .filter-pill {border:1px solid #48484d;background:#303035;color:#c2c2c8;padding:6px 9px;border-radius:7px;font-size:11px }
    .filter-pill.active { background:#244b6f;border-color:#3675ae;color:#cfe8ff }
    .color-dot { display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1px solid #ffffff28 }
    .detail { position:fixed;right:0;top:0;bottom:0;width:min(422px,100vw);background:#202023;box-shadow:-10px 0 60px #0009;z-index:15;transform:translateX(105%);transition:transform .2s ease;display:flex;flex-direction:column;border-left:1px solid #38383d }

    .detail-top {height:59px;padding:12px 17px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #343438; flex-shrink:0}

    .detail-body {overflow:auto; flex:1;padding:22px 26px 34px;scrollbar-width:thin}
    .detail-hero {height:173px;border-radius:9px;position:relative;overflow:hidden;margin-bottom:21px;box-shadow:0 0 0 1px #ffffff12 }
    .detail-hero .card-image {height:100%;aspect-ratio:auto;border:0;border-radius:0}
    .detail-type {color:#93939c;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:750;display:flex;align-items:center;gap:7px }
    .detail-type svg {width:15px;height:15px }
    .detail-title {font-size:23px;font-weight:720;line-height:1.25;letter-spacing:-.035em;margin:12px 0 12px;overflow-wrap:anywhere}
    .detail-content { color:#c9c9d0;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere }
    .detail-section {border-top:1px solid #3b3b41;margin-top:22px;padding-top:18px }

    .detail-chips {display:flex;flex-wrap:wrap;gap:7px }

    .detail-checkline input {accent-color:#2589d7;width:16px;height:16px;margin:1px 0 0;cursor:pointer; flex-shrink:0}

    .task-counter {color:#96969e;font-size:12px;margin:12px 0 }
    .detail-info {color:#8b8b93;font-size:11px;line-height:1.8 }

    .modal-head .grow {flex:1 }
    .modal-content {overflow:auto;padding:22px;scrollbar-width:thin}
    .field {margin-bottom:17px }
    .field label {display:block;color:#aaaab2;margin-bottom:8px;font-size:12px;font-weight:600 }

    const icon = (name,size=19) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" aria-hidden="true">${svgPath[name]||svgPath.note}</svg>`;

      return [

        o('donetick','bookmark','Donetick',['home'],{url:'https://donetick.com',thumb:'donetick',color:'amber',tags:['homelab','tools'],ago:2}),

          }
        }catch(e){}
      }

      return library;
    }
    function loadSidebarPrefs(){
      try{
        const raw=JSON.parse(localStorage.getItem(sidebarPrefsKey)||localStorage.getItem(legacySidebarPrefsKey));
        if(raw&&typeof raw==='object'){
          const valid=Array.isArray(raw.expandedSpaces)?raw.expandedSpaces.filter(x=>typeof x==='string'):[];
          const base={bookmarks:true,spaces:true,filters:true,tags:true};
          for(const key of Object.keys(base))if(typeof raw.sections?.[key]==='boolean')base[key]=raw.sections[key];
          return {expandedSpaces:valid,sections:base};
        }
      }catch(e){}
      return {expandedSpaces:[],sections:{bookmarks:true,spaces:true,filters:true,tags:true}};
    }

    let items = load();
    const savedSidebar = loadSidebarPrefs();
    const ui = {view:'all',search:'',type:'all',tag:'',color:'',sort:'recent',layout:'grid',detail:null,editor:null,editReturn:null,menuItem:null,filterOpen:false,createOpen:false,mobile:false,expandedSpaces:new Set(savedSidebar.expandedSpaces),sections:savedSidebar.sections};
    const persistSidebar = () => {try{localStorage.setItem(sidebarPrefsKey,JSON.stringify({expandedSpaces:[...ui.expandedSpaces],sections:ui.sections}));}catch(e){}};
    const $ = id => document.getElementById(id);
    const persist = () => { try {localStorage.setItem(storage,JSON.stringify({version:4,items}));}catch(e){toast('Storage is unavailable; changes may not persist.')} };
    const one = id => items.find(i=>i.id===id);
    const active = () => items.filter(i=>!i.deleted);
    const count = ids => active().filter(i=>ids.includes(i.id)).length;
    const members = id => active().filter(i=>(i.collectionIds||[]).includes(id));
    const isDescendant = (childId, parentId, seen=new Set()) => { if(childId===parentId) return true; if(seen.has(childId)) return false; seen.add(childId); const item=one(childId); return !!(item?.collectionIds||[]).some(cid=>isDescendant(cid,parentId,seen)); };
    const domain = s => {try{return new URL(s).hostname.replace(/^www\./,'')}catch(e){return s||''}};
    const friendlyDate = s => {const d=new Date(s);return isNaN(d.getTime())?'':d.toLocaleDateString(undefined,{month:'short',day:'numeric'})};
    const key = () => 'i'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
    const typeLabel = item => types[item.type]||'Item';
    const summary = item => item.type==='bookmark'||item.type==='image'||item.type==='file' ? domain(item.url):item.type==='checklist'?`${(item.tasks||[]).filter(t=>t.done).length} of ${(item.tasks||[]).length} complete`:(item.type==='collection'||item.type==='space')?`${members(item.id).length} items`:(item.body||'Note').replace(/\s+/g,' ').slice(0,90);
    function viewLabel(){
  if(ui.view==='all')return ['All items','layers'];
  if(ui.view==='unsorted')return ['Unsorted','inbox'];
  if(ui.view==='trash')return ['Trash','trash'];
  if(ui.view==='favorites')return ['Favorites','heart'];
  if(ui.view==='untagged')return ['Without tags','tag'];
  if(ui.view.startsWith('type:')){
    const type=ui.view.slice(5);
    return [type==='bookmark'?'Links':typeLabel({type})+'s',type];
  }
  if(ui.view.startsWith('space:')){
    const obj=one(ui.view.slice(6));
    return [obj?.title||'Space','space'];
  }
  if(ui.view.startsWith('collection:')){
    const obj=one(ui.view.slice(11));
    return [obj?.title||'Collection','folder'];
  }
  return ['All items','layers'];
}
    function hasLiveParent(item){
  return (item.collectionIds||[]).some(id=>{
    const parent=one(id);
    return parent&&!parent.deleted&&(parent.type==='collection'||parent.type==='space');
  });
}
    function filtered(){
  let list=items.filter(i=>ui.view==='trash'?i.deleted:!i.deleted&&i.type!=='space');
  if(ui.view==='unsorted')list=list.filter(i=>i.type!=='space'&&!hasLiveParent(i));
  else if(ui.view==='favorites')list=list.filter(i=>i.favorite);
  else if(ui.view==='untagged')list=list.filter(i=>!i.tags?.length);
  else if(ui.view.startsWith('type:'))list=list.filter(i=>i.type===ui.view.slice(5));
  else if(ui.view.startsWith('space:'))list=list.filter(i=>i.collectionIds?.includes(ui.view.slice(6)));
  else if(ui.view.startsWith('collection:'))list=list.filter(i=>i.collectionIds?.includes(ui.view.slice(11)));
  if(ui.type!=='all')list=list.filter(i=>i.type===ui.type);
  if(ui.tag)list=list.filter(i=>(i.tags||[]).includes(ui.tag));
  if(ui.color)list=list.filter(i=>i.color===ui.color);
  if(ui.search){
    const query=ui.search.toLowerCase().trim();
    list=list.filter(i=>[i.title,i.body,i.url,...(i.tags||[]),...(i.tasks||[]).map(t=>t.text)].filter(Boolean).join(' ').toLowerCase().includes(query));
  }
  return list.sort((a,b)=>ui.sort==='alpha'?a.title.localeCompare(b.title):ui.sort==='type'?(a.type.localeCompare(b.type)||a.title.localeCompare(b.title)):ui.sort==='oldest'?a.updated.localeCompare(b.updated):b.updated.localeCompare(a.updated));
}

      }
      if(i.type==='space')return `<div class="card-image thumb-space"><div class="space-hero">${icon('space',94)}</div><div class="space-caption">SPACE · ${members(i.id).length} items</div></div>`;
      if(i.type==='collection')return `<div class="card-image thumb-collection"><div class="folder-hero">${icon('folder',100)}</div><div class="folder-number">${members(i.id).length} items</div></div>`;
      if(i.type==='image') return `<div class="card-image thumb-image">${i.url&&/^https?:\/\//i.test(i.url)?`<img src="${esc(i.url)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:''}<div class="art-sun"></div><div class="art-hill"></div><div class="art-hill two"></div></div>`;
      return `<div class="card-image thumb-file" style="--accent:${palettes[i.color]||palettes.slate}"><div class="file-drawing"><div class="file-ext">${esc((i.title.split('.').pop()||'FILE').slice(0,6).toUpperCase())}</div></div></div>`;

    function currentPinContext(item){
  const view=ui.view;
  if(item?.deleted||!(view.startsWith('space:')||view.startsWith('collection:')))return '';
  const id=view.slice(view.indexOf(':')+1);
  const container=one(id);
  if(!container||container.deleted)return '';
  return (item?.collectionIds||[]).includes(id)?view:'';
}
    function isContextPinned(item,context=ui.view){
  return Array.isArray(item.pinnedIn)&&item.pinnedIn.includes(context);
}
    function toggleContextPin(id,context=ui.view){
  const item=one(id);
  if(!item||!context||item.deleted||context!==currentPinContext(item))return;
  item.pinnedIn=Array.isArray(item.pinnedIn)?[...item.pinnedIn]:[];
  if(item.pinnedIn.includes(context))item.pinnedIn=item.pinnedIn.filter(c=>c!==context);
  else item.pinnedIn.push(context);
  item.updated=new Date().toISOString();
  persist();
  renderContent();renderDetail();
  toast(isContextPinned(item,context)?'Pinned here':'Unpinned here');
}
    function contextPinButton(item,format='card'){
  const context=currentPinContext(item);
  if(!context)return '';
  const selected=isContextPinned(item,context);
  const label=selected?'Unpin from this '+(context.startsWith('space:')?'space':'collection'):'Pin in this '+(context.startsWith('space:')?'space':'collection');
  if(format==='detail')return `<button class="icon-btn ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',19)}</button>`;
  if(format==='list')return `<button class="list-pin ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',16)}</button>`;
  return `<button class="card-tool ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',15)}</button>`;
}
    function card(i){
      const bookmark=`<button class="card-tool ${i.pinned?'pinned':''}" data-action="toggle-pin" data-id="${esc(i.id)}" title="${i.pinned?'Remove from sidebar bookmarks':'Bookmark in sidebar'}" aria-label="${i.pinned?'Remove bookmark':'Bookmark'}">${icon('bookmark',15)}</button>`;

    function listCard(i){

    function splitContextSections(list){
     if(ui.view==='trash'){
      const normal=list.filter(i=>i.type!=='space'),spaces=list.filter(i=>i.type==='space');
      if(!spaces.length)return [{id:'all',name:'',icon:'',items:list}];
      const result=[];
      if(normal.length)result.push({id:'trashed-items',name:'Items',icon:'layers',items:normal});
      result.push({id:'trashed-spaces',name:'Spaces',icon:'space',items:spaces});
      return result;
     }
     if(!(ui.view.startsWith('space:')||ui.view.startsWith('collection:')))return [{id:'all',name:'',icon:'',items:list}];
     // A strict one-pass partition; no pinned object is eligible for lower groupings.
     const pinned=[],collections=[],ordinary=[];
     for(const item of list){
      if(isContextPinned(item)&&currentPinContext(item))pinned.push(item);
      else if(item.type==='collection')collections.push(item);
      else ordinary.push(item);
     }
     const groups=[];
     if(pinned.length)groups.push({id:'pinned',name:'Pinned',icon:'pushpin',items:pinned});
     if(collections.length)groups.push({id:'collections',name:'Collections',icon:'folder',items:collections});
     if(ordinary.length)groups.push({id:'rest',name:groups.length?'Everything else':'',icon:'',items:ordinary});
     return groups;
    }

    }

    function findSpaceAncestor(id,seen=new Set()){
  if(seen.has(id))return null;
  seen.add(id);
  const item=one(id);
  if(!item)return null;
  if(item.type==='space')return item.deleted?null:item.id;
  for(const parentId of (item.collectionIds||[])){
    const parent=one(parentId);
    if(!parent||parent.deleted)continue;
    const match=findSpaceAncestor(parentId,seen);
    if(match)return match;
  }
  return null;
}

    function collectionChoices(current,id){
  const candidates=active().filter(i=>(i.type==='collection'||i.type==='space')&&i.id!==id&&(i.type!=='collection'||!isDescendant(i.id,id||'_none_')));

    const available=candidates.filter(i=>i.type===kind).sort((a,b)=>a.title.localeCompare(b.title));

    function normalizeUrl(s){let val=s.trim();if(val && !/^[a-z][a-z\d+.-]*:/i.test(val) && !val.startsWith('/') && !val.startsWith('./')) val='https://'+val;return val;}
    function safeUrl(s) {const val=normalizeUrl(s); if(!val)return ''; if(/^https?:\/\//i.test(val))return val; if(val.startsWith('./')||val.startsWith('/'))return val;return '';}
    function parseTasks(raw,old=[]){return raw.split('\n').map(t=>t.trim()).filter(Boolean).map(rawline=>{const m=rawline.match(/^\[([xX ])\]\s*(.*)$/);const text=(m?m[2]:rawline).trim();const existing=old.find(t=>t.text===text);return {text,done:m?m[1].toLowerCase()==='x':existing?.done||false}}).filter(t=>t.text);}
    function saveEditor(e){

  const url=['bookmark','image','file'].includes(ctx.type)?safeUrl(String(data.get('url')||'')):'';
  if(['bookmark','image','file'].includes(ctx.type)&&String(data.get('url')||'').trim()&&!url){toast('Please use an http(s) URL or a relative file path.');return;}
  const cols=ctx.type==='space'?[]:data.getAll('collections').filter(x=>{
    const p=one(x);return p&&!p.deleted&&(p.type==='collection'||p.type==='space')&&x!==ctx.id;
  });

    });
    document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-item-id]');if(!card)return;e.dataTransfer?.setData('text/plain',card.dataset.itemId);if(e.dataTransfer)e.dataTransfer.effectAllowed='copy';});
    $('sidebar').addEventListener('dragover',e=>{const folder=e.target.closest('[data-drop-collection]');document.querySelectorAll('.drag-over').forEach(x=>{if(x!==folder)x.classList.remove('drag-over')});if(!folder)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy';folder.classList.add('drag-over');});
    $('sidebar').addEventListener('dragleave',e=>{if(!e.relatedTarget?.closest?.('[data-drop-collection]'))document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
    $('sidebar').addEventListener('drop',e=>{const folder=e.target.closest('[data-drop-collection]');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!folder)return;e.preventDefault();dropOnCollection(e.dataTransfer.getData('text/plain'),folder.dataset.dropCollection);});
    // A small addendum allows us to edit a collection from its sidebar row without requiring navigation.
    const style=document.createElement('style');style.textContent='.folder-row{position:relative}.folder-edit-overlay{display:none;position:absolute;right:10px;top:4px;width:26px;height:26px;border:0;border-radius:5px;background:#38383e;color:#bcbcc4;place-items:center}.folder-row:hover .folder-edit-overlay{display:grid}.folder-row:has(.nav-item.active) .folder-edit-overlay{background:#1873bc;color:white}.folder-row .nav-item:hover .count{visibility:hidden}';document.head.append(style);
    const linkSafeClick=e=>{const a=e.target.closest('a[href]');if(a && (/^javascript:/i.test(a.getAttribute('href'))||/^data:/i.test(a.getAttribute('href')))){e.preventDefault();toast('Unsupported link.')}};
    $('detail').addEventListener('click',linkSafeClick);
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
    render();
  })();
  </script>
</body>
</html>
