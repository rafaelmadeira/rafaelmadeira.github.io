<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Shelf — Tasks & Events experiment v0.6</title>
  <style>
    :root { --bg:#111113; --sidebar:#202023; --card:#171719; --panel:#1d1d20; --surface:#29292d; --surface2:#323237; --line:#333338; --text:#ececef; --muted:#85858e; --muted2:#63636b; --blue:#2485d7; --blue2:#339df5; --focus:#5baff5; --radius:11px; color-scheme:dark }
    * { box-sizing:border-box }
    html, body { height:100%; margin:0 }
    body { background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; -webkit-font-smoothing:antialiased }
    button,input,textarea,select { font:inherit }
    button { cursor:pointer }
    button:disabled { cursor:not-allowed; opacity:.5 }
    button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px }
    a { color:#7dbcf7 }
    .shell { display:flex; height:100dvh; width:100%; overflow:hidden }
    .sidebar { width:278px; flex:0 0 278px; background:var(--sidebar); border-right:1px solid #27272a; display:flex; flex-direction:column; z-index:2 }
    .side-head { height:54px; padding:12px 14px 7px; display:flex; align-items:center; gap:7px }
    .workspace-button { display:flex; align-items:center; gap:10px; color:#e7e7e9; border:0; background:none; font-weight:650; padding:4px 2px; min-width:0; flex:1; text-align:left }
    .workspace-avatar { border:1.5px solid #69696f; color:#a5a5aa; width:24px;height:24px; display:grid; place-items:center; border-radius:50%; flex-shrink:0 }
    .head-btn,.icon-btn { border:0;background:transparent;color:#a5a5ae;display:inline-grid;place-items:center;border-radius:8px; width:32px;height:32px;flex-shrink:0 }
    .head-btn:hover,.icon-btn:hover { background:#343438;color:#fff }
    .head-btn svg,.icon-btn svg,.nav-icon svg,.mini-icon svg { width:19px;height:19px;stroke-width:1.8 }
    .side-content { overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:#454549 transparent; padding-bottom:18px; flex:1 }
    .nav-group { padding:2px 0 8px }
    .nav-caption { color:#77777e; font-size:12px; font-weight:550; margin:14px 14px 8px; display:flex;align-items:center;justify-content:space-between;letter-spacing:.01em }
    .nav-caption button { border:0;background:transparent;color:#8e8e95;padding:2px;display:grid;place-items:center }
    .nav-caption button:hover { color:#fff }
    .nav-item { border:0; background:transparent; width:100%; color:#e2e2e5; font-size:13px; font-weight:480; text-align:left; min-height:34px; display:flex;align-items:center;gap:10px; padding:5px 14px; transition:background .11s; position:relative }
    .nav-item:hover { background:#303034 }
    .nav-item.active { background:var(--blue); color:#fff }
    .nav-item.active .count,.nav-item.active .nav-icon { color:#e5f3ff;opacity:1 }
    .nav-item.drag-over { background:#235074; box-shadow:inset 0 0 0 1px #61b1ff }
    .nav-item .count { color:#77777e; font-size:12px; margin-left:auto; font-variant-numeric:tabular-nums }
    .nav-item .nav-label { white-space:nowrap;overflow:hidden;text-overflow:ellipsis; flex:1 }
    .nav-icon { display:grid; place-items:center; flex:0 0 20px; color:#aaaaaf }
    .nav-icon svg { width:20px; height:20px }
    .nav-item.nested { padding-left:34px }
    .nav-item.nested2 { padding-left:50px }
    .nav-item .collection-edit { border:0; padding:2px; color:inherit; background:transparent; display:none; align-items:center; margin-left:2px; border-radius:5px }
    .nav-item:hover .collection-edit { display:flex }
    .nav-item:hover .count { display:none }
    .nav-item.nested::before,.nav-item.nested2::before { content:"";position:absolute;left:23px;top:0;bottom:0;border-left:1px solid #3d3d42 }
    .side-bottom { padding:12px 13px 13px; border-top:1px solid #2c2c30; display:flex;gap:8px;align-items:center }
    .demo-badge { font-size:11px; color:#85858b;flex:1; white-space:nowrap }
    .bottom-action { border:1px solid #424247; background:transparent;color:#babac0;padding:5px 9px;border-radius:6px;font-size:11px }
    .bottom-action:hover { background:#303036;color:#fff }
    .main { flex:1; overflow:auto; min-width:0; position:relative }
    .main-content { padding:0 28px 84px; max-width:1720px; margin:0 auto; min-height:100% }
    .topbar { height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px; position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 90%,rgba(17,17,19,.95)); }
    .search { display:flex;align-items:center;gap:12px;flex:1; max-width:640px;color:#96969d; position:relative }
    .search svg { width:19px;height:19px;flex-shrink:0 }
    .search input { background:none; border:0;color:#f1f1f3;outline:0;width:100%;height:42px; font-size:14px;min-width:0 }
    .search input::placeholder { color:#77777e }
    .search kbd { border:1px solid #3b3b40; color:#66666c; font-size:11px; font-family:inherit; padding:1px 5px;border-radius:4px;margin-right:8px }
    .top-actions { display:flex;gap:5px;align-items:center; position:relative }
    .top-actions .icon-btn { width:34px;height:34px }
    .top-actions .icon-btn.selected { color:#7bbefa;background:#202f3e }
    .new-top { background:#288bdd;color:#fff;border:0;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:640;display:flex;align-items:center;gap:7px;margin-left:8px }
    .new-top:hover { background:#3c9bea }
    .heading { margin:10px 0 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px }
    .heading-title { display:flex;gap:12px;align-items:center;min-width:0 }
    .heading-title svg { width:24px;height:24px;stroke:#a8a8ad;stroke-width:1.6;flex-shrink:0 }
    h1 { font-size:17px;font-weight:660;letter-spacing:-.02em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .heading-tools { display:flex;align-items:center;gap:10px;flex-shrink:0 }
    .small-muted { color:var(--muted);font-size:12px }
    .toolbar-select { border:0;background:transparent;color:#9999a2;font-size:12px;padding:5px 3px; cursor:pointer }
    .toolbar-select option { background:#202024 }
    .view-toggle { display:flex;align-items:center;border:1px solid #35353a;border-radius:7px;padding:2px;gap:1px }
    .view-toggle button { border:0;background:none;color:#85858e;display:grid;place-items:center;width:26px;height:25px;border-radius:4px }
    .view-toggle button.active { background:#3c3c42;color:#f0f0f2 }
    .view-toggle svg { width:15px;height:15px }
    .active-chips { display:flex;align-items:center;gap:7px;margin-top:-10px;margin-bottom:20px;flex-wrap:wrap }
    .chip-clear { background:#25282d;border:1px solid #3d4148;color:#b0cbe3;border-radius:16px;padding:5px 9px;font-size:11px }
    .chip-clear:hover { background:#304050 }
    .cards { display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:27px 19px;align-content:start }
    .item-card { min-width:0;position:relative;cursor:pointer;outline:none }
    .item-card:hover .card-image,.item-card:focus-visible .card-image { box-shadow:0 0 0 1px #65656e; transform:translateY(-1px) }
    .card-image { background:#222225;aspect-ratio:1.6;overflow:hidden;border:1px solid #242426;border-radius:7px;position:relative;transition:box-shadow .13s,transform .13s; }
    .card-title-row { display:flex;align-items:flex-start;gap:7px;margin:10px 1px 0 }
    .card-title { font-weight:580;font-size:13.5px;line-height:1.4; color:#e8e8eb;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .card-sub { font-size:11px;color:#75757c;margin:2px 1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .card-fave { color:#e98f98;flex-shrink:0; display:grid;place-items:center }
    .card-fave svg { width:14px;height:14px;fill:currentColor }
    .card-tools { display:flex;align-items:center;gap:3px;position:absolute;z-index:1;right:8px;top:7px;opacity:0;transition:opacity .12s }
    .item-card:hover .card-tools,.item-card:focus-within .card-tools { opacity:1 }
    .card-tool { border:1px solid #ffffff25;background:#17171acc;backdrop-filter:blur(6px);color:#ddd;border-radius:6px;width:28px;height:27px;display:grid;place-items:center }
    .card-tool:hover { background:#3d3d43 }
    .card-tool svg { width:15px;height:15px }
    .card-type { position:absolute;left:10px;top:9px;border-radius:5px;color:#eaeaf0;background:#10101390;padding:4px 6px;display:flex;gap:5px;align-items:center;font-size:10px;letter-spacing:.03em;backdrop-filter:blur(4px) }
    .card-type svg { width:12px;height:12px }
    .brand-donetick { background:#f5b95e;display:flex;align-items:center;justify-content:center }
    .donetick-page { width:64%;height:102%;background:#f8f7f4;border-radius:30px 30px 0 0;position:absolute;top:15%;box-shadow:0 0 0 9px #e9ad57 }
    .donetick-face { font-size:48px;position:absolute;top:13%;width:100%;text-align:center;line-height:1 }
    .donetick-face::after { content:"";position:absolute;top:41px;left:27%;width:13%;height:12px;border-radius:50%;background:#ff6280;box-shadow:87px 0 #ff6280;opacity:.85 }
    .donetick-lines {position:absolute;bottom:11%;left:17%;height:6%;width:60%;background:#71dfd7;border-radius:9px }
    .donetick-lines:before { content:"✓";position:absolute;left:-29px;top:-19px;color:#323037;font-size:39px;font-weight:900 }
    .brand-synology { background:#242426;display:grid;place-items:center }
    .synology-nas { width:68%;height:63%;background:linear-gradient(130deg,#29292b,#1c1c1e);border:1px solid #343437;border-radius:7px;display:flex;align-items:end;justify-content:space-evenly;padding:10px;opacity:.47 }
    .synology-nas i { height:79%;width:19%;background:linear-gradient(90deg,#171719,#333337);border-radius:2px;border:1px solid #2a2a2d }
    .synology-nas i:after {content:"";display:block;width:3px;height:3px;background:#72c57a;border-radius:50%;margin:75% 0 0 45%}
    .brand-homarr { background:#100e10; display:grid;place-items:center }
    .homarr-logo { color:#ff4d57;font-weight:900;letter-spacing:-.09em;font-size:clamp(44px,5vw,88px);line-height:1; transform:scale(1.1);font-family:Arial,sans-serif }
    .homarr-logo span { color:#ff4d57;letter-spacing:-.24em; }
    .brand-generic { background:linear-gradient(135deg,var(--accent,#29354b),#17191c);padding:24px;display:flex; flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:9px }
    .generic-orbit { width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:#ffffff17;color:#fff;border:1px solid #ffffff22;font-size:25px;transform:rotate(-5deg) }
    .generic-url {color:#ffffffcc;font-size:18px;font-weight:710;line-height:1.12;letter-spacing:-.04em;word-break:break-word;max-height:2.4em;overflow:hidden}
    .generic-domain {font-size:11px;color:#ffffff8c;letter-spacing:.04em}
    .thumb-note { background:linear-gradient(160deg,var(--accent,#383b3e),#242528);display:grid;place-items:center;padding:15px }
    .paper { width:84%;height:115%;background:#eae9e5;color:#24252a;position:absolute;top:13%;border-radius:6px;padding:22px 18px;box-shadow:0 13px 24px #0005;overflow:hidden;transform:rotate(-1.5deg) }
    .paper.paper-warm { background:#e8debd }

    .paper.paper-green { background:#dfe7d8 }
    .paper-kicker {font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:#81818a;font-weight:700;margin-bottom:10px}
    .paper-title {font-size:clamp(14px,1.45vw,19px);font-weight:760;letter-spacing:-.05em;line-height:1.15;margin-bottom:10px;max-height:2.3em;overflow:hidden}
    .paper-body {font-size:10px;line-height:1.55;color:#6d6b69;white-space:pre-line;overflow:hidden;max-height:6em;overflow-wrap:anywhere}
    .thumb-checklist { background:linear-gradient(160deg,var(--accent,#253645),#14171b);display:grid;place-items:center;padding:14px }
    .check-sheet { height:110%;width:85%;position:absolute;top:13%;background:#edece8;border-radius:7px; padding:21px 17px;color:#28282b;box-shadow:0 9px 25px #0006;transform:rotate(.7deg);overflow:hidden }
    .check-head {font-weight:730;font-size:13px;line-height:1.15;margin-bottom:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .check-row {display:flex;gap:7px;align-items:center;font-size:10px;margin:7px 0;color:#555760;min-width:0}
    .check-box {border:1.5px solid #999ba0;border-radius:3px;width:12px;height:12px;flex-shrink:0;display:grid;place-items:center;font-size:10px;line-height:1 }
    .check-row.done .check-box {background:#459c88;border-color:#459c88;color:#fff}
    .check-row.done {color:#aaa; text-decoration:line-through}
    .check-row span:last-child { white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .check-progress { height:4px;border-radius:10px;background:#ccc;overflow:hidden;margin-top:14px }
    .check-progress>div { height:100%;background:#479d8a }
    .thumb-collection { background:linear-gradient(135deg,#3c3b39,#1c1d1e);display:flex;align-items:center;justify-content:center }
    .folder-hero { display:grid;place-items:center;color:#c3ae83;opacity:.93;filter:drop-shadow(0 12px 9px #0005) }
    .folder-hero svg { width:105px;height:105px;stroke-width:1.15; fill:#bb9b5e1a }
    .thumb-collection .folder-number {position:absolute;bottom:17px;color:#a8a7a4;font-size:11px}
    .thumb-image {background:linear-gradient(120deg,#a5af9d,#5b7c91);overflow:hidden}
    .art-sun {position:absolute;right:17%;top:12%;height:83px;width:83px;border-radius:50%;background:#f1c879}
    .art-hill {position:absolute;bottom:-34%;left:-10%;width:105%;height:100%;border-radius:50% 60% 0 0;background:#45675f;transform:rotate(-13deg)}
    .art-hill.two {left:40%;bottom:-42%;background:#294957;transform:rotate(10deg)}
    .thumb-image img {height:100%;width:100%;object-fit:cover;display:block;position:absolute;inset:0;z-index:3}
    .thumb-file {background:linear-gradient(130deg,var(--accent,#313440),#222326);display:grid;place-items:center}
    .file-drawing {width:100px;height:119px;background:#e0e3ec;border-radius:6px 23px 6px 6px;transform:rotate(-4deg);box-shadow:0 10px 22px #0005;position:relative;padding:20px 14px;color:#566578}
    .file-drawing:before { content:"";position:absolute;right:0;top:0;border-top:25px solid #a7afbf;border-left:25px solid transparent }
    .file-drawing:after {content:"";position:absolute;top:64px;left:14px;width:72px;height:4px;background:#b3bbc7;box-shadow:0 12px #b3bbc7,0 24px #b3bbc7}
    .file-ext {font-size:16px;font-weight:800;color:#738aa3}
    .listview { display:flex;flex-direction:column;gap:2px }
    .list-card { display:flex;gap:13px;align-items:center;min-height:63px;padding:7px 11px;border-radius:8px;border:1px solid transparent;cursor:pointer }
    .list-card:hover { background:#1d1d20;border-color:#343439 }
    .list-thumb { width:47px;height:43px;border-radius:6px; flex-shrink:0; background:var(--surface);color:#b6b6bd;display:grid;place-items:center }
    .list-thumb svg {width:21px;height:21px}
    .list-title {font-size:13px;font-weight:600;margin-bottom:4px}
    .list-desc {font-size:11px;color:#7e7e87;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .list-spacer {flex:1}
    .list-date {color:#73737b;font-size:11px;flex-shrink:0;margin-left:9px}
    .empty-state {text-align:center;min-height:44vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#93939c }
    .empty-graphic {width:73px;height:73px;border-radius:21px;background:#26262b;display:grid;place-items:center;color:#7e7e88 }

    .empty-title {color:#e1e1e4;font-size:16px;font-weight:660 }
    .empty-copy {font-size:12px;max-width:280px;line-height:1.6 }
    .empty-state button {background:#303b46;border:1px solid #3d627f;color:#cce4fb;border-radius:7px;padding:8px 13px;margin-top:3px}
    .popover {position:fixed;z-index:20;background:#27272b;border:1px solid #414147;box-shadow:0 16px 60px #0008;border-radius:10px;padding:7px;min-width:205px;display:none }

    .pop-item {display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#e5e5e7;width:100%;text-align:left;border-radius:6px;padding:9px;font-size:12.5px }
    .pop-item:hover { background:#3c3c42 }
    .pop-item svg {width:18px;height:18px;color:#aaaab2}
    .pop-divider {border-top:1px solid #3b3b40;margin:6px 3px}
    .filter-popover {min-width:278px;padding:15px;max-height:75vh;overflow:auto}
    .filter-label { color:#9999a2;font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;margin:7px 0 9px }
    .filter-choices {display:flex;flex-wrap:wrap;gap:6px;margin-bottom:17px }

    .color-dot { display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1px solid #ffffff28 }

    .detail-body {overflow:auto; flex:1;padding:22px 26px 34px;scrollbar-width:thin}

    .detail-type {color:#93939c;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:750;display:flex;align-items:center;gap:7px }
    .detail-type svg {width:15px;height:15px }
    .detail-title {font-size:23px;font-weight:720;line-height:1.25;letter-spacing:-.035em;margin:12px 0 12px;overflow-wrap:anywhere}

    function adaptLibrary(source){
      const legacyGroupOnly=!source.some(i=>i.type==='space'||i.type==='folder');
      const incoming=source.map(i=>({
        ...i,
        type:i.type==='space'||i.type==='collection'?'folder':i.type,
        collectionIds:Array.isArray(i.collectionIds)?[...i.collectionIds]:[],
        tags:Array.isArray(i.tags)?[...i.tags]:[],
        pinned:typeof i.pinned==='boolean'?i.pinned:['home','project-plan'].includes(i.id),
        pinnedIn:[...new Set((Array.isArray(i.pinnedIn)?i.pinnedIn:[]).filter(x=>typeof x==='string').map(key=>{
          const m=key.match(/^(space|collection):(.+)$/);
          return m?'folder:'+m[2]:key;
        }))]
      }));
      // Old v0.1 library used grouping labels instead of actual parent folders.
      if(legacyGroupOnly){
        const roots=incoming.filter(i=>i.type==='folder'&&!i.collectionIds.length&&!i.deleted);
        for(const group of ['Work','Personal']){
          const children=roots.filter(i=>i.group===group);
          if(!children.length)continue;
          const id='shelf-space-'+group.toLowerCase();
          if(!incoming.some(i=>i.id===id)){
            incoming.push({
              id,type:'folder',title:group,collectionIds:[],tags:[],pinned:false,pinnedIn:[],favorite:false,
              color:group==='Work'?'blue':'green',created:new Date().toISOString(),
              updated:new Date().toISOString(),deleted:false,body:'',url:'',tasks:[]
            });
          }
          children.forEach(i=>{if(!i.collectionIds.includes(id))i.collectionIds.push(id);});
        }
      }
      return incoming;
    }

    function load(){

      const library=adaptLibrary(source||seed());
      // Only add demonstrations on the first v0.6 migration, never on reload after deletion.
      if(sourceKey!==storage)addTaskEventSamples(library);

      return library;

        if(i.thumb==='synology') return `<div class="card-image brand-synology"><div class="synology-nas"><i></i><i></i><i></i><i></i></div></div>`;
        if(i.thumb==='homarr') return `<div class="card-image brand-homarr"><div class="homarr-logo">◕<span>◕</span></div></div>`;
        return `<div class="card-image brand-generic" style="--accent:${palettes[i.color]||palettes.slate}"><div class="generic-orbit">${icon('link',28)}</div><div class="generic-url">${esc(i.title)}</div><div class="generic-domain">${esc(domain(i.url))}</div></div>`;
      }
      if(i.type==='note'){
        const paper=i.color==='amber'?'paper-warm':i.color==='blue'||i.color==='violet'?'paper-blue':'paper-green';
        return `<div class="card-image thumb-note" style="--accent:${palettes[i.color]||palettes.slate}"><div class="paper ${paper}"><div class="paper-kicker">NOTE</div><div class="paper-title">${esc(i.title)}</div><div class="paper-body">${esc(i.body||'An empty note…')}</div></div></div>`;
      }
      if(i.type==='checklist'){
        const tasks=i.tasks||[],done=tasks.filter(t=>t.done).length;
        return `<div class="card-image thumb-checklist" style="--accent:${palettes[i.color]||palettes.blue}"><div class="check-sheet"><div class="check-head">${esc(i.title)}</div>${tasks.slice(0,4).map(t=>`<div class="check-row ${t.done?'done':''}"><span class="check-box">${t.done?'✓':''}</span><span>${esc(t.text)}</span></div>`).join('')}<div class="check-progress"><div style="width:${tasks.length?done/tasks.length*100:0}%"></div></div></div></div>`;
      }

      if(i.type==='task'){
        const done=i.status==='done',state=taskStates[i.status]||'To do';
        return `<div class="card-image thumb-task" style="--accent:${palettes[i.color]||palettes.blue}">
          <div class="task-paper ${done?'is-done':''}">
            <div class="task-preview-kicker">${icon('task',13)} <span>TASK</span><span class="task-preview-state">${esc(state)}</span></div>
            <div class="task-preview-main"><div class="task-preview-check">${done?'✓':''}</div><div class="task-preview-heading">
              <div class="task-preview-title">${esc(i.title)}</div>
              <div class="task-preview-notes">${esc(i.body||'One thing to do, one place to keep it.')}</div>
            </div></div>
            <div class="task-preview-footer"><span>${icon('event',12)} ${esc(taskDateText(i))}</span><span>${esc(taskPriorities[i.priority]||'Normal')}</span></div>
          </div></div>`;
      }
      if(i.type==='event'){
        const start=parseLocalDate(i.startDate);
        const month=start?start.toLocaleDateString(undefined,{month:'short'}).toUpperCase():'DATE';
        const day=start?String(start.getDate()).padStart(2,'0'):'--';
        const when=i.allDay?'All day':timeLabel(i.startTime)+(i.endTime?' – '+timeLabel(i.endTime):'');
        return `<div class="card-image thumb-event" style="--accent:${palettes[i.color]||palettes.violet}">
          <div class="event-paper">
            <div class="event-preview-date"><div class="event-preview-month">${esc(month)}</div><div class="event-preview-day">${esc(day)}</div></div>
            <div class="event-preview-details">
              <div class="event-preview-kicker">${icon('event',12)} EVENT</div>
              <div class="event-preview-title">${esc(i.title)}</div>
              <div class="event-preview-time">${esc(when||'Time not set')}</div>
              <div class="event-preview-location">${i.location?icon('map-pin',12):''}${esc(i.location||'')}</div>
            </div>
          </div></div>`;
      }
      if(i.type==='folder')return `<div class="card-image thumb-collection"><div class="folder-hero">${icon('folder',100)}</div><div class="folder-number">${members(i.id).length} items</div></div>`;
      if(i.type==='image') return `<div class="card-image thumb-image">${i.url&&/^https?:\/\//i.test(i.url)?`<img src="${esc(i.url)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:''}<div class="art-sun"></div><div class="art-hill"></div><div class="art-hill two"></div></div>`;
      return `<div class="card-image thumb-file" style="--accent:${palettes[i.color]||palettes.slate}"><div class="file-drawing"><div class="file-ext">${esc((i.title.split('.').pop()||'FILE').slice(0,6).toUpperCase())}</div></div></div>`;
    }
    function currentPinContext(item){
     const view=ui.view;
     if(item?.deleted||!view.startsWith('folder:'))return '';
     const id=view.slice(7),folder=one(id);
     if(!folder||folder.deleted||folder.type!=='folder')return '';
     return (item.collectionIds||[]).includes(id)?view:'';
    }

    function isContextPinned(item,context=ui.view){
  return Array.isArray(item.pinnedIn)&&item.pinnedIn.includes(context);
}
    function toggleTaskDone(id){
      const item=one(id);
      if(!item||item.deleted||item.type!=='task')return;
      item.status=item.status==='done'?'todo':'done';
      item.updated=new Date().toISOString();
      persist();renderContent();renderDetail();
      toast(item.status==='done'?'Task completed':'Task reopened');
    }
    function toggleContextPin(id,context=ui.view){
  const item=one(id);
  if(!item||!context||item.deleted||context!==currentPinContext(item))return;
  item.pinnedIn=Array.isArray(item.pinnedIn)?[...item.pinnedIn]:[];
  if(item.pinnedIn.includes(context))item.pinnedIn=item.pinnedIn.filter(c=>c!==context);
  else item.pinnedIn.push(context);
  item.updated=new Date().toISOString();
  persist();
  renderContent();renderDetail();
  toast(isContextPinned(item,context)?'Pinned here':'Unpinned here');
}
    function contextPinButton(item,format='card'){
  const context=currentPinContext(item);
  if(!context)return '';
  const selected=isContextPinned(item,context);
  const label=selected?'Unpin from this folder':'Pin in this folder';
  if(format==='detail')return `<button class="icon-btn ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',19)}</button>`;
  if(format==='list')return `<button class="list-pin ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',16)}</button>`;
  return `<button class="card-tool ${selected?'context-pinned':''}" data-action="pin-context" data-id="${esc(item.id)}" title="${label}" aria-label="${label}">${icon('pushpin',15)}</button>`;
}
    function card(i){
     const menu=`<button class="card-tool more-tool" data-action="item-menu" data-id="${esc(i.id)}" title="More actions for ${esc(i.title)}" aria-label="More actions for ${esc(i.title)}">${icon('more',18)}</button>`;
     const pinnedHere=isContextPinned(i)&&!!currentPinContext(i);
     const direct=i.type==='bookmark'&&!i.deleted;
     return `<article class="item-card" tabindex="0" role="${direct?'link':'button'}" aria-label="${direct?'Visit':'Open'} ${esc(i.title)}" title="${direct?'Visit link · Use more actions to see details':''}" draggable="${ui.view==='trash'?'false':'true'}" data-item-id="${esc(i.id)}" data-action="open-item"><div class="card-tools">${menu}</div>${makeThumb(i)}<div class="card-title-row"><div class="card-title">${esc(i.title)}</div>${pinnedHere?`<span class="card-in-context-pin" title="Pinned here">${icon('pushpin',13)}</span>`:''}${i.pinned?`<span class="card-pinned" title="Bookmarked">${icon('bookmark',13)}</span>`:''}${i.favorite?`<span class="card-fave">${icon('heart',14)}</span>`:''}</div><div class="card-sub">${esc(summary(i)||typeLabel(i))}${direct?` <span class="sub-external" aria-hidden="true">${icon('external-link',12)}</span>`:''}</div></article>`;
    }
    function listCard(i){
     const pinnedHere=isContextPinned(i)&&!!currentPinContext(i);
     const direct=i.type==='bookmark'&&!i.deleted;
     return `<div class="list-card" tabindex="0" role="${direct?'link':'button'}" aria-label="${direct?'Visit':'Open'} ${esc(i.title)}" draggable="${ui.view==='trash'?'false':'true'}" data-item-id="${esc(i.id)}" data-action="open-item"><div class="list-thumb" style="color:${palettes[i.color]||'#aab'}">${icon(i.type,22)}</div><div style="min-width:0"><div class="list-title">${esc(i.title)} ${pinnedHere?`<span class="inline-pin" title="Pinned here">${icon('pushpin',13)}</span>`:''}${i.favorite?'<span style="color:#d78a95">♥</span>':''}</div><div class="list-desc">${esc(typeLabel(i))} · ${esc(summary(i))}${direct?' ↗':''}</div></div><div class="list-spacer"></div><button class="list-more" data-action="item-menu" data-id="${esc(i.id)}" title="More actions for ${esc(i.title)}" aria-label="More actions for ${esc(i.title)}">${icon('more',18)}</button><div class="list-date">${friendlyDate(i.updated)}</div></div>`;
    }

    function splitContextSections(list){
     if(!ui.view.startsWith('folder:'))return [{id:'all',name:'',icon:'',items:list}];
     const pinned=[],folders=[],ordinary=[];
     for(const item of list){
      if(isContextPinned(item)&&currentPinContext(item))pinned.push(item);
      else if(item.type==='folder')folders.push(item);
      else ordinary.push(item);
     }
     const groups=[];
     if(pinned.length)groups.push({id:'pinned',name:'Pinned',icon:'pushpin',items:pinned});
     if(folders.length)groups.push({id:'folders',name:'Folders',icon:'folder',items:folders});
     if(ordinary.length)groups.push({id:'rest',name:groups.length?'Everything else':'',icon:'',items:ordinary});
     return groups;
    }

    function renderSection(section){
      const content=ui.layout==='grid'?`<div class="cards">${section.items.map(card).join('')}</div>`:`<div class="listview">${section.items.map(listCard).join('')}</div>`;
      const heading=section.name?`<div class="content-section-heading"><div class="content-section-label">${section.icon?icon(section.icon,15):''}<span>${esc(section.name)}</span></div><span class="content-section-total">${section.items.length}</span><div class="content-section-rule"></div></div>`:'';
      return `<section class="content-section" data-section="${esc(section.id)}">${heading}${content}</section>`;
    }
    function renderContent(){
      const [title,ico]=viewLabel(),list=filtered();
      $('heading-text').textContent=title;
      $('heading-icon').innerHTML=icon(ico,24);
      $('item-count').textContent=`${list.length} ${list.length===1?'item':'items'}`;
      $('sort-select').value=ui.sort;
      document.querySelectorAll('[data-action="layout"]').forEach(b=>b.classList.toggle('active',b.dataset.layout===ui.layout));
      const chips=[];
      if(ui.search)chips.push(`<button class="chip-clear" data-action="clear-search">Search: ${esc(ui.search)} ×</button>`);
      if(ui.type!=='all')chips.push(`<button class="chip-clear" data-action="clear-type">${esc(types[ui.type])} ×</button>`);
      if(ui.tag)chips.push(`<button class="chip-clear" data-action="clear-tag">${esc(ui.tag)} ×</button>`);
      if(ui.color)chips.push(`<button class="chip-clear" data-action="clear-color"><span class="color-dot" style="background:${palettes[ui.color]}"></span>${esc(ui.color)} ×</button>`);
      $('active-filters').innerHTML=chips.length?`<div class="active-chips">${chips.join('')}</div>`:'';
      if(!list.length){
        $('content').innerHTML=`<div class="empty-state"><div class="empty-graphic">${icon(ui.search?'search':'folder',34)}</div><div class="empty-title">${ui.search||ui.type!=='all'||ui.tag||ui.color?'Nothing matches yet':ui.view==='trash'?'Trash is empty':'Nothing here yet'}</div><div class="empty-copy">${ui.search||ui.type!=='all'||ui.tag||ui.color?'Try clearing a filter or using a different search.':'Every item has a place here. Create something, or drag an existing card onto this collection in the sidebar.'}</div>${ui.search||ui.type!=='all'||ui.tag||ui.color?'<button data-action="clear-filters">Clear filters</button>':'<button data-action="toggle-create">Add an item</button>'}</div>`;
        return;
      }
      $('content').innerHTML=splitContextSections(list).map(renderSection).join('');
    }

    function renderFilterPopover(){
      let html='<div class="filter-label">Type</div><div class="filter-choices">';
      html+=`<button class="filter-pill ${ui.type==='all'?'active':''}" data-action="filter-type" data-type="all">All types</button>`;
      html+=Object.entries(types).map(([t,n])=>`<button class="filter-pill ${ui.type===t?'active':''}" data-action="filter-type" data-type="${t}">${esc(n)}</button>`).join('');
      html+='</div><div class="filter-label">Color</div><div class="filter-choices">';
      html+=`<button class="filter-pill ${ui.color===''?'active':''}" data-action="filter-color" data-color="">Any</button>`;
      html+=Object.entries(palettes).map(([name,color])=>`<button class="filter-pill ${ui.color===name?'active':''}" data-action="filter-color" data-color="${name}"><span class="color-dot" style="background:${color}"></span>${name}</button>`).join('');
      html+='</div><div class="filter-label">Tag</div><div class="filter-choices">';
      const tags=[...new Set(active().flatMap(i=>i.tags||[]))].sort();
      html+=`<button class="filter-pill ${ui.tag===''?'active':''}" data-action="filter-tag" data-tag="">Any tag</button>`;
      html+=tags.map(tag=>`<button class="filter-pill ${ui.tag===tag?'active':''}" data-action="filter-tag" data-tag="${esc(tag)}">${esc(tag)}</button>`).join('');
      html+='</div><button class="pop-item" style="margin-top:4px" data-action="clear-filters">'+icon('x',14)+' Clear filters</button>';
      $('filter-popover').innerHTML=html;
    }
    function renderCreatePopover() {
      $('create-popover').innerHTML=Object.entries(types).map(([t,name])=>`<button class="pop-item" data-action="new" data-type="${t}">${icon(t)}<span>${name}</span></button>`).join('')+'<div class="pop-divider"></div><button class="pop-item" data-action="import">'+icon('archive')+'<span>Import JSON backup</span></button>';
    }
    function renderDetail(){
     const panel=$('detail'),item=one(ui.detail);
     if(!item){panel.classList.remove('open');panel.innerHTML='';return;}
     const tags=(item.tags||[]).map(t=>`<span class="detail-chip">${esc(t)}</span>`).join('')||'<span class="small-muted">No tags yet</span>';
     const locations=(item.collectionIds||[]).map(id=>one(id)).filter(i=>i&&i.type==='folder'&&!i.deleted).map(i=>`<button class="detail-chip" data-action="nav" data-view="folder:${esc(i.id)}">${icon('folder',12)} ${esc(i.title)}</button>`).join('')||'<span class="small-muted">Not inside another folder</span>';
     let body='';
     if(['bookmark','file','image'].includes(item.type)){
      const url=safeUrl(item.url||'');
      body=`${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="display:block;overflow-wrap:anywhere;font-size:12px;margin:12px 0">${esc(url)}</a>`:'<p class="small-muted">No URL added.</p>'}${item.body?`<div class="detail-content">${esc(item.body)}</div>`:''}${url?`<div class="detail-buttons"><a class="detail-btn primary" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${icon('external-link')} ${item.type==='bookmark'?'Visit link':'Open file'}</a></div>`:''}`;
     }
     if(item.type==='note')body=`<div class="detail-content">${esc(item.body||'Nothing written yet.')}</div>`;
     if(item.type==='folder'){
      const n=members(item.id).length;
      body=`<p class="detail-content">${n} ${n===1?'item belongs':'items belong'} to this folder. Folders can contain other folders, links, notes, checklists, images, and files.</p>${item.deleted?'':`<div class="detail-buttons"><button class="detail-btn primary" data-action="nav" data-view="folder:${esc(item.id)}">${icon('folder')} Open folder</button></div>`}`;
     }
     if(item.type==='task'){
       const done=item.status==='done',status=taskStates[item.status]||'To do';
       const priority=taskPriorities[item.priority]||'Normal';
       const notes=item.body?`<div class="object-notes-label">Notes</div><div class="detail-content">${esc(item.body)}</div>`:'';
       body=`<div class="object-facts">
         <div class="object-fact"><div class="object-fact-label">${icon('task',14)} Status</div><div class="object-fact-value">${esc(status)}</div></div>
         <div class="object-fact"><div class="object-fact-label">${icon('event',14)} Due</div><div class="object-fact-value">${esc(item.dueDate?dateLabel(item.dueDate,true):'No due date')}</div></div>
         <div class="object-fact"><div class="object-fact-label">Priority</div><div class="object-fact-value">${esc(priority)}</div></div>
       </div>${notes}${item.deleted?'':`<div class="detail-buttons"><button class="detail-btn ${done?'':'primary'}" data-action="toggle-task-done" data-id="${esc(item.id)}">${icon('task',16)} ${done?'Reopen task':'Mark as done'}</button></div>`}`;
     }
     if(item.type==='event'){
       const start=item.startDate?dateLabel(item.startDate,true):'Date not set';
       const end=item.endDate?dateLabel(item.endDate,true):start;
       const dateAndTime=date=>date+(item.allDay?' · All day':'');
       const startText=start+(item.allDay?'':item.startTime?' · '+timeLabel(item.startTime):'');
       const endText=end+(item.allDay?'':item.endTime?' · '+timeLabel(item.endTime):'');
       const notes=item.body?`<div class="object-notes-label">Notes</div><div class="detail-content">${esc(item.body)}</div>`:'';
       body=`<div class="object-facts">
         <div class="object-fact"><div class="object-fact-label">${icon('event',14)} Starts</div><div class="object-fact-value">${esc(startText)}</div></div>
         <div class="object-fact"><div class="object-fact-label">${icon('event',14)} Ends</div><div class="object-fact-value">${esc(endText)}</div></div>
         <div class="object-fact"><div class="object-fact-label">${icon('map-pin',14)} Location</div><div class="object-fact-value">${esc(item.location||'No location')}</div></div>
         <div class="object-fact"><div class="object-fact-label">Type</div><div class="object-fact-value">${item.allDay?'All-day event':'Timed event'}</div></div>
       </div>${notes}`;
     }
     if(item.type==='checklist'){
      const tasks=item.tasks||[],done=tasks.filter(t=>t.done).length;
      body=`<div class="task-counter">${done} of ${tasks.length} completed · ${tasks.length?Math.round(done/tasks.length*100):0}%</div>${tasks.map((t,idx)=>`<label class="detail-checkline ${t.done?'done':''}"><input type="checkbox" data-action="toggle-task" data-id="${esc(item.id)}" data-index="${idx}" ${t.done?'checked':''}/><span>${esc(t.text)}</span></label>`).join('')}<input class="new-task-input" id="add-task" aria-label="Add task" placeholder="+ Add an item and press Enter" data-id="${esc(item.id)}"/>`;
     }
     const headActions=item.deleted?'':`${contextPinButton(item,'detail')}<button class="icon-btn" data-action="toggle-pin" data-id="${esc(item.id)}" title="${item.pinned?'Remove sidebar bookmark':'Bookmark in sidebar'}" style="${item.pinned?'color:#c3b3f5':''}" aria-label="Bookmark">${icon('bookmark')}</button><button class="icon-btn" data-action="favorite" data-id="${esc(item.id)}" title="${item.favorite?'Unfavorite':'Favorite'}" style="${item.favorite?'color:#f198a1':''}" aria-label="Toggle favorite">${icon('heart')}</button>`;
     const metadata=`<div class="detail-section"><h3>Folders</h3><div class="detail-chips">${locations}</div></div><div class="detail-section"><h3>Tags</h3><div class="detail-chips">${tags}</div></div>`;
     const details=`<div class="detail-section"><h3>Details</h3><div class="detail-info">Updated ${friendlyDate(item.updated)} · ${esc(item.color||'slate')} color<br>Stored in this browser only</div></div>`;
     const footer=`<div class="detail-buttons"><button class="detail-btn" data-action="edit" data-id="${esc(item.id)}">${icon('pencil')} Edit</button>${item.deleted?`<button class="detail-btn" data-action="restore" data-id="${esc(item.id)}">${icon('rotate')} Restore</button><button class="detail-btn" data-action="purge" data-id="${esc(item.id)}">${icon('trash')} Delete forever</button>`:`<button class="detail-btn" data-action="trash" data-id="${esc(item.id)}">${icon('trash')} Move to Trash</button>`}</div>`;
     panel.innerHTML=`<div class="detail-dialog" role="dialog" aria-modal="true" aria-label="${esc(item.title)}"><div class="detail-top"><span class="detail-type">${icon(item.type,17)} ${typeLabel(item)}</span><span class="grow"></span>${headActions}<button class="icon-btn" data-action="edit" data-id="${esc(item.id)}" title="Edit item" aria-label="Edit">${icon('pencil')}</button><button class="icon-btn" data-action="close-detail" title="Close" aria-label="Close">${icon('x')}</button></div><div class="detail-body"><div class="detail-hero">${makeThumb(item)}</div><div class="detail-title">${esc(item.title)}</div>${body}${metadata}${details}${footer}</div></div>`;
     panel.classList.add('open');
    }

    function render(){renderSidebar();renderContent();renderDetail();renderFilterPopover();renderCreatePopover();$('filter-button').classList.toggle('selected',!!(ui.tag||ui.color||ui.type!=='all'));}
    let toastTimeout;
    function toast(message){const e=$('toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.classList.remove('show'),2400)}
    function setView(view,origin=''){
     ui.view=view;
     if(origin==='tree'&&view.startsWith('folder:')){
      const id=view.slice(7);
      if(ui.expandedFolders.has(id))ui.expandedFolders.delete(id);
      else ui.expandedFolders.add(id);
      persistSidebar();
     }
     ui.mobile=false;ui.detail=null;ui.createOpen=false;ui.filterOpen=false;
     closeMenus();render();$('main').scrollTop=0;
    }

    function closeMenus(){$('create-popover').classList.remove('open');$('filter-popover').classList.remove('open');$('item-popover').classList.remove('open');ui.menuItem=null;ui.createOpen=false;ui.filterOpen=false;}
    function positionPopover(id,button){const pop=$(id),r=button.getBoundingClientRect();const width=pop.offsetWidth||210,height=pop.offsetHeight||250;const left=Math.max(8,Math.min(window.innerWidth-width-8,r.right-width));const top=r.bottom+7+height>window.innerHeight?Math.max(8,r.top-height-7):r.bottom+7;pop.style.top=Math.max(8,Math.min(window.innerHeight-height-8,top))+'px';pop.style.left=left+'px';}
    function toggleMenu(id,button){const open=!$(id).classList.contains('open');closeMenus();if(open){$(id).classList.add('open');positionPopover(id,button)} }
    function itemMenuHTML(item){
 const id=esc(item.id);
 const option=(action,label,ico)=>`<button class="pop-item" data-action="${action}" data-id="${id}">${icon(ico,17)}<span>${esc(label)}</span></button>`;
 if(item.deleted)return option('view-details','View details','note')+'<div class="pop-divider"></div>'+option('restore','Restore','rotate')+option('purge','Delete forever','trash');
 let html='';
 if(item.type==='bookmark'){
  html+=option('visit-link','Visit link','external-link');
  html+=option('view-details','View details','note')+'<div class="pop-divider"></div>';
 }else html+=option('view-details','View details','note');
 if(item.type==='task')html+=option('toggle-task-done',item.status==='done'?'Reopen task':'Mark as done','task');
 const ctx=currentPinContext(item);
 if(ctx)html+=option('pin-context',isContextPinned(item,ctx)?'Unpin here':'Pin here','pushpin');
 html+=option('toggle-pin',item.pinned?'Remove sidebar bookmark':'Bookmark in sidebar','bookmark');
 html+=option('favorite',item.favorite?'Remove from favorites':'Add to favorites','heart');
 html+='<div class="pop-divider"></div>';
 return html+option('edit','Edit','pencil')+option('trash','Move to Trash','trash');
}
    function openItemMenu(trigger,id){
 const item=one(id);
 if(!item)return;
 const pop=$('item-popover');
 if(pop.classList.contains('open')&&ui.menuItem===id){closeMenus();return;}
 closeMenus();
 ui.menuItem=id;
 pop.innerHTML=itemMenuHTML(item);
 pop.classList.add('open');
 positionPopover('item-popover',trigger);
}
    function visitLink(item){
 if(!item||item.type!=='bookmark')return;
 const url=safeUrl(item.url||'');
 if(!url){closeMenus();ui.detail=item.id;renderDetail();toast('This bookmark has no valid link yet.');return;}
 window.open(url,'_blank','noopener,noreferrer');
}
    function openEditor(type,id=null){
     closeMenus();
     ui.editReturn=id&&ui.detail===id?id:null;
     if(ui.editReturn){ui.detail=null;$('detail').classList.remove('open');}
     const existing=id?one(id):null,kind=existing?.type||type;
     ui.editor={id,type:kind};
     const current=existing||{title:'',url:'',body:'',tasks:[],tags:[],collectionIds:[],color:kind==='checklist'?'blue':'slate',favorite:false,pinned:false};
     let contents=`<div class="field"><label for="f-title">${kind==='folder'?'Folder name':'Title'}</label><input required autofocus id="f-title" name="title" class="text-field" maxlength="200" placeholder="${kind==='folder'?'Name this folder':'Give it a name'}" value="${esc(current.title)}"/></div>`;
     if(['bookmark','image','file'].includes(kind))contents+=`<div class="field"><label for="f-url">${kind==='bookmark'?'URL':kind==='image'?'Image URL':'File URL or path'}</label><input id="f-url" name="url" class="text-field" type="text" placeholder="https://…" value="${esc(current.url||'')}"/><small>${kind==='file'?'This prototype stores file references, not uploaded files.':kind==='image'?'Use a direct image URL to display its thumbnail.':'The link opens in a new tab.'}</small></div>`;
     if(kind==='note')contents+=`<div class="field"><label for="f-body">Note</label><textarea id="f-body" name="body" class="text-area" style="min-height:190px" placeholder="Write anything…">${esc(current.body)}</textarea></div>`;
     if(kind==='checklist')contents+=`<div class="field"><label for="f-tasks">Checklist items</label><textarea id="f-tasks" name="tasks" class="text-area" style="min-height:165px" placeholder="One item per line">${esc((current.tasks||[]).map(t=>(t.done?'[x] ':'[ ] ')+t.text).join('\n'))}</textarea><small>One item per line. Use [x] for completed, [ ] for incomplete.</small></div>`;
     if(kind==='task'){
       contents+=`<div class="field-row">
         <div class="field"><label for="f-status">Status</label><select id="f-status" name="status" class="text-field">${Object.entries(taskStates).map(([key,value])=>`<option value="${key}" ${(current.status||'todo')===key?'selected':''}>${esc(value)}</option>`).join('')}</select></div>
         <div class="field"><label for="f-priority">Priority</label><select id="f-priority" name="priority" class="text-field">${Object.entries(taskPriorities).map(([key,value])=>`<option value="${key}" ${(current.priority||'normal')===key?'selected':''}>${esc(value)}</option>`).join('')}</select></div>
       </div>
       <div class="field"><label for="f-due">Due date (optional)</label><input id="f-due" name="dueDate" class="text-field" type="date" value="${esc(current.dueDate||'')}"/></div>
       <div class="field"><label for="f-body">Notes</label><textarea id="f-body" name="body" class="text-area" style="min-height:135px" placeholder="Context, links, or any details for this task…">${esc(current.body||'')}</textarea></div>`;
     }
     if(kind==='event'){
       const begin=current.startDate||(!id?dayOffset(0):'');
       const end=current.endDate||(!id?begin:'');
       contents+=`<div class="field"><label class="choice-check"><input type="checkbox" id="f-all-day" name="allDay" ${current.allDay?'checked':''}/> All-day event</label></div>
       <div class="field-row">
         <div class="field"><label for="f-start-date">Start date</label><input id="f-start-date" name="startDate" type="date" class="text-field" required value="${esc(begin)}"/></div>
         <div class="field"><label for="f-end-date">End date</label><input id="f-end-date" name="endDate" type="date" class="text-field" value="${esc(end)}"/></div>
       </div>
       <div class="field-row" id="event-time-fields" ${current.allDay?'hidden':''}>
         <div class="field"><label for="f-start-time">Start time</label><input id="f-start-time" name="startTime" type="time" class="text-field" value="${esc(current.startTime||'10:00')}"/></div>
         <div class="field"><label for="f-end-time">End time</label><input id="f-end-time" name="endTime" type="time" class="text-field" value="${esc(current.endTime||'11:00')}"/></div>
       </div>
       <div class="field"><label for="f-location">Location (optional)</label><input id="f-location" name="location" type="text" class="text-field" maxlength="220" value="${esc(current.location||'')}" placeholder="In person, online, or wherever"/></div>
       <div class="field"><label for="f-body">Notes</label><textarea id="f-body" name="body" class="text-area" style="min-height:125px" placeholder="Agenda, preparation, meeting link…">${esc(current.body||'')}</textarea></div>`;
     }
     if(['bookmark','image','file'].includes(kind))contents+=`<div class="field"><label for="f-body">Description (optional)</label><textarea id="f-body" name="body" class="text-area" style="min-height:75px" placeholder="Why save this?">${esc(current.body||'')}</textarea></div>`;
     contents+=`<div class="field"><label>${kind==='folder'?'Parent folders (optional)':'Add to folders (optional)'}</label><div class="choice-grid">${folderChoices(current,id)}</div><small>${kind==='folder'?'Folders may be nested at any depth. Leave empty to place this folder at the top level.':'Objects can belong to more than one folder.'}</small></div>`;
     contents+=`<div class="field"><label for="f-tags">Tags</label><input id="f-tags" name="tags" class="text-field" placeholder="design, research, personal" value="${esc((current.tags||[]).join(', '))}"/><small>Separate with commas. Tags work across your library.</small></div>`;
     contents+=`<div class="field"><label>Color</label><div class="choice-grid" role="radiogroup" aria-label="Choose a color">${Object.entries(palettes).map(([name,color])=>`<label title="${name}" class="color-choice ${current.color===name?'selected':''}" style="background:${color}"><input type="radio" name="color" value="${name}" ${current.color===name?'checked':''} style="position:absolute;opacity:0;width:0;height:0"/></label>`).join('')}</div></div>`;
     contents+=`<div class="field"><label class="choice-check" style="display:inline-flex"><input name="pinned" type="checkbox" ${current.pinned?'checked':''}/> ${icon('bookmark',15)} Bookmark in sidebar</label></div>`;
     contents+=`<div class="field"><label class="choice-check" style="display:inline-flex"><input name="favorite" type="checkbox" ${current.favorite?'checked':''}/> ${icon('heart',15)} Add to favorites</label></div>`;
     $('modal-content').innerHTML=contents;
     $('modal-title').textContent=`${id?'Edit':'New'} ${typeLabel({type:kind}).toLowerCase()}`;
     $('modal-hint').textContent='Changes are stored locally';
     $('editor-trash').hidden=!(id&&kind==='folder'&&!current.deleted);
     $('scrim').classList.add('open');
     setTimeout(()=>$('f-title')?.focus(),10);
    }
    function folderChoices(current,id){
     const folders=active().filter(i=>i.type==='folder'&&i.id!==id&&!isDescendant(i.id,id||'_none_')).sort((a,b)=>a.title.localeCompare(b.title));
     if(!folders.length)return '<span class="small-muted">No folders available yet.</span>';
     const selected=current.collectionIds?.length?current.collectionIds:(!id&&ui.view.startsWith('folder:')?[ui.view.slice(7)]:[]);
     return folders.map(i=>`<label class="choice-check"><input type="checkbox" name="collections" value="${esc(i.id)}" ${selected.includes(i.id)?'checked':''}/>${icon('folder',14)}<span>${esc(i.title)}</span></label>`).join('');
    }

    function normalizeUrl(s){let val=s.trim();if(val && !/^[a-z][a-z\d+.-]*:/i.test(val) && !val.startsWith('/') && !val.startsWith('./')) val='https://'+val;return val;}
    function safeUrl(s) {const val=normalizeUrl(s); if(!val)return ''; if(/^https?:\/\//i.test(val))return val; if(val.startsWith('./')||val.startsWith('/'))return val;return '';}
    function parseTasks(raw,old=[]){return raw.split('\n').map(t=>t.trim()).filter(Boolean).map(rawline=>{const m=rawline.match(/^\[([xX ])\]\s*(.*)$/);const text=(m?m[2]:rawline).trim();const existing=old.find(t=>t.text===text);return {text,done:m?m[1].toLowerCase()==='x':existing?.done||false}}).filter(t=>t.text);}
    function saveEditor(e){
     e.preventDefault();
     const data=new FormData(e.target),ctx=ui.editor;
     if(!ctx)return;
     const title=String(data.get('title')||'').trim();
     if(!title){$('f-title').focus();return;}
     const original=ctx.id?one(ctx.id):null;
     if(ctx.type==='task'){
       const due=String(data.get('dueDate')||'');
       if(due&&!parseLocalDate(due)){toast('Choose a valid due date.');return;}
     }
     const url=['bookmark','image','file'].includes(ctx.type)?safeUrl(String(data.get('url')||'')):'';
     if(['bookmark','image','file'].includes(ctx.type)&&String(data.get('url')||'').trim()&&!url){toast('Please use an http(s) URL or a relative file path.');return;}
     const folders=data.getAll('collections').filter(id=>{
      const parent=one(id);
      return parent&&!parent.deleted&&parent.type==='folder'&&id!==ctx.id&&(ctx.type!=='folder'||!isDescendant(id,ctx.id||'_none_'));
     });
     const item=original||{id:key(),type:ctx.type,created:new Date().toISOString(),deleted:false,thumb:'',group:''};
     if(ctx.type==='event'){
       const startDate=String(data.get('startDate')||'');
       const endDate=String(data.get('endDate')||startDate);
       const allDay=!!data.get('allDay');
       const startTime=String(data.get('startTime')||'');
       const endTime=String(data.get('endTime')||'');
       if(!parseLocalDate(startDate)||!parseLocalDate(endDate)){toast('Choose a valid event date.');return;}
       if(endDate<startDate){toast('End date cannot come before start date.');return;}
       if(!allDay){
         if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(startTime)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(endTime)){
           toast('Enter a start and end time, or choose All-day.');return;
         }
         if(endDate+'T'+endTime<startDate+'T'+startTime){toast('Event must end after it begins.');return;}
       }
     }
     item.title=title;item.url=url;item.body=String(data.get('body')||'');
     item.tasks=ctx.type==='checklist'?parseTasks(String(data.get('tasks')||''),original?.tasks||[]):[];
     if(ctx.type==='task'){
       const status=String(data.get('status')||'todo'),priority=String(data.get('priority')||'normal');
       const dueDate=String(data.get('dueDate')||'');
       item.status=Object.hasOwn(taskStates,status)?status:'todo';
       item.priority=Object.hasOwn(taskPriorities,priority)?priority:'normal';
       item.dueDate=dueDate;
     }
     if(ctx.type==='event'){
       item.startDate=String(data.get('startDate')||'');
       item.endDate=String(data.get('endDate')||item.startDate);
       item.startTime=String(data.get('startTime')||'');
       item.endTime=String(data.get('endTime')||'');
       item.allDay=!!data.get('allDay');
       item.location=String(data.get('location')||'').trim();
     }
     item.tags=[...new Set(String(data.get('tags')||'').split(',').map(t=>t.trim().toLowerCase()).filter(Boolean))];
     item.collectionIds=[...new Set(folders)];
     item.pinnedIn=(item.pinnedIn||[]).filter(c=>c.startsWith('folder:')&&item.collectionIds.includes(c.slice(7)));
     item.favorite=!!data.get('favorite');item.pinned=!!data.get('pinned');
     item.color=String(data.get('color')||'slate');
     item.updated=new Date().toISOString();
     if(!original)items.unshift(item);
     if(!original&&ctx.type==='folder'&&folders.length){
      folders.forEach(id=>ui.expandedFolders.add(id));
      persistSidebar();
     }
     persist();$('scrim').classList.remove('open');ui.editor=null;ui.editReturn=null;ui.detail=item.id;render();
     toast(original?'Item updated':'Item created');
    }

    function closeEditor(){
 $('scrim').classList.remove('open');ui.editor=null;
 const restore=ui.editReturn;ui.editReturn=null;
 if(restore&&one(restore)){ui.detail=restore;renderDetail();}
}
    function editFavorite(id){
  const item=one(id);if(!item)return;
  item.favorite=!item.favorite;item.updated=new Date().toISOString();persist();render();
}
    function togglePinned(id){
  const item=one(id);if(!item||item.deleted)return;
  item.pinned=!item.pinned;item.updated=new Date().toISOString();persist();render();
  toast(item.pinned?'Added to sidebar Bookmarks':'Removed from sidebar Bookmarks');
}

    function putInTrash(id){
     const item=one(id);if(!item||item.deleted)return;
     item.deleted=true;item.updated=new Date().toISOString();ui.detail=null;
     if(ui.view==='folder:'+id)ui.view='unsorted';
     // Retain the expansion preference in case this folder is restored.
     persist();render();
     toast(item.type==='folder'?'Moved to Trash; folder contents are preserved.':'Moved to Trash');
    }

    function restore(id){const i=one(id);if(!i)return;i.deleted=false;i.updated=new Date().toISOString();persist();render();toast('Item restored');}
    function purge(id){const i=one(id);if(!i)return;if(!confirm(`Delete “${i.title}” permanently?`))return;items=items.filter(x=>x.id!==id);items.forEach(x=>{x.collectionIds=x.collectionIds.filter(c=>c!==id);x.pinnedIn=(x.pinnedIn||[]).filter(c=>c!=='folder:'+id);});if(ui.expandedFolders.delete(id))persistSidebar();ui.detail=null;persist();render();toast('Deleted permanently');}
    function exportData(){const blob=new Blob([JSON.stringify({version:6,exported:new Date().toISOString(),items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='shelf-library-backup.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exported');}
    function importData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.addEventListener('change',async()=>{const file=input.files?.[0];if(!file)return;try{const json=JSON.parse(await file.text());if(!Array.isArray(json.items)||json.items.some(i=>!i.id||!i.type||!i.title||!Array.isArray(i.collectionIds)))throw Error('Invalid backup');if(!confirm(`Replace your current library with ${json.items.length} imported items? Export a backup first if needed.`))return;items=adaptLibrary(json.items);ui.detail=null;setView('all');persist();render();toast('Library imported');}catch(e){alert('Could not import this file. Please select a Shelf JSON backup.');}});input.click();}
    function dropOnFolder(itemId,folderId){
     const item=one(itemId),folder=one(folderId);
     if(!item||!folder||item.deleted||folder.deleted||item.id===folder.id)return;
     if(folder.type!=='folder')return toast('Drop items onto folders.');
     if(item.type==='folder'&&isDescendant(folderId,item.id))return toast('A folder cannot contain itself or an ancestor.');
     if(item.collectionIds.includes(folderId))return toast('Already in this folder');
     item.collectionIds.push(folderId);item.updated=new Date().toISOString();
     ui.expandedFolders.add(folderId);persistSidebar();
     persist();render();toast(`Added to ${folder.title}`);
    }

    document.addEventListener('click',e=>{
      const el=e.target.closest('[data-action]');if(!el){if(!e.target.closest('.popover'))closeMenus();return;}
      const action=el.dataset.action,id=el.dataset.id;
      if(['favorite','toggle-pin','pin-context','toggle-task-done','edit','close-detail','trash','restore','purge','editor-trash','item-menu','visit-link','view-details'].includes(action))e.stopPropagation();
      switch(action){
        case 'nav':setView(el.dataset.view,el.dataset.origin||'');break;
        case 'toggle-section':ui.sections[el.dataset.section]=!ui.sections[el.dataset.section];persistSidebar();renderSidebar();break;
        case 'new-folder':openEditor('folder');break;
        case 'item-menu':openItemMenu(el,id);break;
        case 'view-details':closeMenus();ui.detail=id;renderDetail();break;
        case 'visit-link':visitLink(one(id));closeMenus();break;
        case 'open-shortcut':{const target=one(id);if(target){ui.mobile=false;renderSidebar();if(target.type==='bookmark'&&!target.deleted)visitLink(target);else{ui.detail=id;renderDetail();}}break;}
        case 'editor-trash':{const target=ui.editor?.id;$('scrim').classList.remove('open');ui.editor=null;ui.editReturn=null;if(target)putInTrash(target);break;}
        case 'toggle-pin':togglePinned(id);closeMenus();break;
        case 'pin-context':toggleContextPin(id);closeMenus();break;
        case 'toggle-task-done':toggleTaskDone(id);closeMenus();break;
        case 'toggle-mobile':ui.mobile=!ui.mobile;renderSidebar();break;
        case 'toggle-create':{renderCreatePopover();toggleMenu('create-popover',el);break;}
        case 'toggle-filter':{renderFilterPopover();toggleMenu('filter-popover',el);break;}
        case 'new':openEditor(el.dataset.type);break;
        case 'open-item':{const i=one(el.dataset.itemId);if(!i)return;closeMenus();if(i.type==='bookmark'&&!i.deleted)visitLink(i);else if(i.type==='folder'&&!i.deleted)setView('folder:'+i.id);else{ui.detail=i.id;renderDetail();}break;}
        case 'close-detail':ui.detail=null;renderDetail();break;
        case 'edit':{const item=one(id);if(item)openEditor(item.type,id);break;}
        case 'favorite':editFavorite(id);closeMenus();break;
        case 'trash':putInTrash(id);closeMenus();break;
        case 'restore':restore(id);closeMenus();break;
        case 'purge':purge(id);closeMenus();break;
        case 'close-modal':closeEditor();break;
        case 'layout':ui.layout=el.dataset.layout;renderContent();break;
        case 'filter-type':ui.type=el.dataset.type;render();$('filter-popover').classList.add('open');positionPopover('filter-popover',$('filter-button'));break;
        case 'filter-color':ui.color=el.dataset.color;render();$('filter-popover').classList.add('open');positionPopover('filter-popover',$('filter-button'));break;
        case 'filter-tag':ui.tag=el.dataset.tag;render();$('filter-popover').classList.add('open');positionPopover('filter-popover',$('filter-button'));break;
        case 'tag':ui.tag=ui.tag===el.dataset.tag?'':el.dataset.tag;ui.view='all';render();break;
        case 'clear-search':ui.search='';$('search-input').value='';renderContent();break;
        case 'clear-type':ui.type='all';render();break;
        case 'clear-tag':ui.tag='';render();break;
        case 'clear-color':ui.color='';render();break;
        case 'clear-filters':ui.type='all';ui.tag='';ui.color='';ui.search='';$('search-input').value='';closeMenus();render();break;
        case 'reset':if(confirm('Reset all local changes and restore the sample items? Export a backup first if you want to keep your changes.')){items=addTaskEventSamples(adaptLibrary(seed()));ui.detail=null;ui.expandedFolders.clear();persistSidebar();ui.type='all';ui.tag='';ui.color='';ui.search='';$('search-input').value='';setView('all');persist();toast('Sample library reset');}break;
        case 'export':exportData();break;
        case 'import':closeMenus();importData();break;
      }
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='f-all-day'){const times=$('event-time-fields');if(times)times.hidden=e.target.checked;}
      if(e.target.id==='sort-select'){ui.sort=e.target.value;renderContent();}
      if(e.target.matches('[data-action="toggle-task"]')){const item=one(e.target.dataset.id),task=item?.tasks?.[Number(e.target.dataset.index)];if(!task)return;task.done=e.target.checked;item.updated=new Date().toISOString();persist();renderContent();renderSidebar();renderDetail();}
      if(e.target.matches('input[name="color"]'))document.querySelectorAll('.color-choice').forEach(c=>c.classList.toggle('selected',c.querySelector('input').checked));
    });
    $('search-input').addEventListener('input',e=>{ui.search=e.target.value;renderContent()});
    $('editor-form').addEventListener('submit',saveEditor);
    $('scrim').addEventListener('click',e=>{if(e.target===$('scrim'))closeEditor();});
    $('detail').addEventListener('click',e=>{if(e.target===$('detail')){ui.detail=null;renderDetail();}});
    $('detail').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='add-task'){e.preventDefault();const t=e.target.value.trim(),item=one(e.target.dataset.id);if(!t||!item)return;item.tasks.push({text:t,done:false});item.updated=new Date().toISOString();persist();renderContent();renderDetail();$('add-task')?.focus();}});
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){if($('scrim').classList.contains('open'))closeEditor();else if(ui.detail){ui.detail=null;renderDetail();}else{closeMenus();ui.mobile=false;renderSidebar();}return;}
      if(e.target.matches('input,textarea,select')||$('scrim').classList.contains('open'))return;
      if(e.key==='/'||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();$('search-input').focus();}
      if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();openEditor('note');}
      if((e.key==='Enter'||e.key===' ')&&e.target.matches('.item-card,.list-card')){e.preventDefault();e.target.click();}
    });
    document.addEventListener('dragstart',e=>{const card=e.target.closest('[data-item-id]');if(!card)return;e.dataTransfer?.setData('text/plain',card.dataset.itemId);if(e.dataTransfer)e.dataTransfer.effectAllowed='copy';});
    $('sidebar').addEventListener('dragover',e=>{const folder=e.target.closest('[data-drop-folder]');document.querySelectorAll('.drag-over').forEach(x=>{if(x!==folder)x.classList.remove('drag-over')});if(!folder)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='copy';folder.classList.add('drag-over');});
    $('sidebar').addEventListener('dragleave',e=>{if(!e.relatedTarget?.closest?.('[data-drop-folder]'))document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));});
    $('sidebar').addEventListener('drop',e=>{const folder=e.target.closest('[data-drop-folder]');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));if(!folder)return;e.preventDefault();dropOnFolder(e.dataTransfer.getData('text/plain'),folder.dataset.dropFolder);});
    const linkSafeClick=e=>{const a=e.target.closest('a[href]');if(a && (/^javascript:/i.test(a.getAttribute('href'))||/^data:/i.test(a.getAttribute('href')))){e.preventDefault();toast('Unsupported link.')}};
    $('detail').addEventListener('click',linkSafeClick);
    document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
    render();
  })();
  </script>
</body>
</html>
