/* Board-centric Shelf experiment */
.main{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.topbar{flex:0 0 60px;height:60px}
#board-screen{overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:#44444b transparent}
.board-wrap{max-width:1560px;padding:36px 33px 90px;margin:0 auto}
.board-kicker{font-size:11px;color:#8b8b93;letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:7px}
.board-heading{display:flex;align-items:flex-start;gap:13px}
.board-mark{width:41px;height:41px;border-radius:11px;background:#2a3f54;color:#93c6fb;display:grid;place-items:center;margin-top:1px;flex-shrink:0}
.board-heading-copy{flex:1;min-width:0}
.board-heading h1{font-size:26px;line-height:1.25;font-weight:720;letter-spacing:-.04em;margin:0 0 6px}
.board-summary{font-size:12px;color:#85858e;display:flex;gap:9px;align-items:center}
.board-options{margin-top:3px}
.board-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #313136;margin:26px 0 30px;padding-bottom:13px}
.views{display:flex;gap:3px;align-items:center;background:#1b1b1d;border:1px solid #313136;border-radius:8px;padding:3px}
.view-btn{border:0;background:none;color:#898992;display:flex;align-items:center;gap:6px;border-radius:6px;padding:7px 11px;font-size:12px}
.view-btn:hover{color:#e9e9eb;background:#29292c}
.view-btn.selected{background:#38383d;color:#f4f4f6}
.board-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.small-check{display:flex;gap:7px;align-items:center;color:#a5a5ae;font-size:12px;cursor:pointer}
.small-check input{accent-color:#2b8fdb;width:14px;height:14px;margin:0}
.tiny-action{display:inline-flex;gap:6px;align-items:center;padding:7px 9px;border:1px solid #3e3e45;border-radius:7px;background:none;color:#aaaab4;font-size:12px}
.tiny-action:hover{color:#fff;background:#2b2b31}
.board-section{margin-bottom:36px}
.group-header{display:flex;gap:9px;align-items:center;margin:0 0 16px}
.group-title{font-size:12px;font-weight:720;color:#c9c9d0;letter-spacing:.008em}
.group-count{font-size:11px;color:#777781}
.group-line{height:1px;flex:1;background:#303035}
.group-action{border:0;background:none;border-radius:5px;color:#888892;padding:4px;display:grid;place-items:center}
.group-action:hover{background:#303037;color:#fff}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:22px 18px;align-items:start}
.board-card{position:relative;min-width:0;cursor:pointer;border-radius:9px;outline:none}
.board-card:focus-visible .card-cover,.board-card:hover .card-cover{border-color:#65707d;box-shadow:0 0 0 1px #414852}
.card-cover{background:linear-gradient(135deg,var(--coverA,#2a394b),var(--coverB,#171a20));border:1px solid #2b2c31;aspect-ratio:1.62;overflow:hidden;position:relative;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#9ebad3;transition:border .15s,box-shadow .15s}
.card-cover svg{width:66px;height:66px;stroke-width:1.1;opacity:.87;filter:drop-shadow(0 6px 10px #0004)}
.card-cover .cover-caption{position:absolute;left:12px;bottom:11px;font-size:10px;letter-spacing:.04em;color:#d2ddebad;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-cover .cover-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-cover .cover-shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#0008)}
.card-content{padding:9px 2px 4px}
.card-name{font-size:13px;color:#e7e7eb;font-weight:590;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.card-meta{display:flex;align-items:center;gap:7px;color:#8a8a95;font-size:11px;margin-top:5px;min-height:17px}
.status-dot{height:7px;width:7px;border-radius:50%;background:#5f626e;flex-shrink:0}
.status-dot.progress{background:#58a7e9}.status-dot.waiting{background:#d7b267}.status-dot.done{background:#71a992}.status-dot.todo{background:#9697a3}
.card-done{position:absolute;right:2px;bottom:25px;height:22px;width:22px;border:0;border-radius:50%;background:#242428;color:#888891;display:grid;place-items:center;opacity:0;z-index:1}
.board-card:hover .card-done,.board-card:focus-within .card-done,.card-done.is-done{opacity:1}
.card-done:hover{background:#314351;color:#abd3f6}.card-done.is-done{color:#8ad0ab}
.card-add{border:1px dashed #393942;background:#171719;border-radius:7px;aspect-ratio:1.62;color:#7d7d89;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:12px;cursor:pointer}
.card-add:hover{background:#1b252f;border-color:#536f89;color:#c6e1fa}
.item-list{display:flex;flex-direction:column;gap:1px}
.item-list-row{border:1px solid transparent;border-radius:7px;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;min-height:53px}
.item-list-row:hover{border-color:#35353b;background:#1d1d20}
.record-name{flex:1;min-width:0;color:#e4e4e8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record-sub{font-size:11px;color:#777781;margin-top:3px}
.row-status{color:#9797a0;font-size:11px;white-space:nowrap}
.row-more{color:#74747c}
.complete-btn{height:18px;width:18px;border:1.5px solid #777985;border-radius:50%;flex-shrink:0;background:none;color:#e9f7ed;display:grid;place-items:center;padding:0}
.complete-btn:hover{border-color:#55a1e5;background:#1e344a}
.complete-btn.done{border-color:#7fc5a5;background:#527f6b}
.item-list-row .done-name,.board-card .done-name,.kanban-tile .done-name{color:#81818b;text-decoration:line-through}
.table-frame{border:1px solid #33333a;border-radius:10px;overflow:auto}
.board-table{border-collapse:collapse;width:100%;min-width:620px}
.board-table th{background:#1e1e21;color:#8f8f99;font-size:11px;font-weight:600;text-align:left;padding:12px 15px;border-bottom:1px solid #37373d}
.board-table td{padding:11px 15px;border-bottom:1px solid #28282d;font-size:12px;color:#c9c9d0;vertical-align:middle}
.board-table tr:last-child td{border-bottom:0}.board-table tbody tr{cursor:pointer}.board-table tbody tr:hover td{background:#232327}
.table-title-cell{display:flex;align-items:center;gap:11px;min-width:210px}
.table-title-cell strong{color:#e8e8eb;font-size:12px;font-weight:590}
.cell-select{background:#222226;color:#c7c7d0;border:1px solid #3a3a41;border-radius:6px;padding:5px 6px;font-size:11px;max-width:190px}
.kanban-scroll{display:flex;align-items:stretch;gap:13px;overflow-x:auto;padding:1px 0 15px;min-height:310px}
.kanban-column{flex:0 0 275px;min-height:260px;background:#1c1c1f;border:1px solid #303038;border-radius:9px;padding:12px}
.kanban-column.over{border-color:#5ba3da;background:#22313f}

function openDb(){return new Promise(function(resolve,reject){var r=indexedDB.open(ASSET_DB,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains("assets"))r.result.createObjectStore("assets")};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}})}

async function exportBackup(){
 var data={format:"shelf-board-item-v09",exported:new Date().toISOString(),state:state,assets:[]},ids=new Set();
 state.items.forEach(function(i){(i.blocks||[]).forEach(function(b){if(b.assetId)ids.add(b.assetId);(b.photos||[]).forEach(function(ph){ids.add(ph.id)})})});
 try{for(var id of ids){var blob=await getAsset(id);if(blob)data.assets.push({id:id,mime:blob.type,data:await fileToBase64(blob)})}
 var blob=new Blob([JSON.stringify(data)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="shelf-boards-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(function(){URL.revokeObjectURL(url)},2500);notify("Backup exported with attachments.")}catch(e){notify("Export failed: "+e.message)}
}
async function importBackup(file){
 try{var data=JSON.parse(await file.text());if(data.format!=="shelf-board-item-v09"||!data.state||!Array.isArray(data.state.boards)||!Array.isArray(data.state.items))throw Error("Unsupported backup format");if(!confirm("Replace current v0.9 data with this backup?"))return;for(var a of data.assets||[])await putAsset(a.id,base64ToBlob(a.data,a.mime));state=data.state;state.activeItem=null;state.fullscreen=false;save();paint();notify("Backup imported.")}catch(e){notify("Import failed: "+e.message)}
}

document.addEventListener("click",function(e){
 var choice=e.target.closest("[data-menu-index]");if(choice){var k=Number(choice.getAttribute("data-menu-index")),fn=currentMenu[k]&&currentMenu[k].run;hideMenu();if(fn)fn();return}
 var bt=e.target.closest("[data-action]");if(!bt){if(!e.target.closest("#menu"))hideMenu();if(!e.target.closest(".search-wrap"))document.getElementById("search-results").classList.remove("visible");return}
 var a=bt.getAttribute("data-action"),id=bt.getAttribute("data-id"),p=id&&item(id),b=id&&board(id),block=id&&byId(id),idx=Number(bt.getAttribute("data-index"));
 if(!["board-menu","item-menu","section-menu","blockmenu","addat"].includes(a))hideMenu();
 if(a==="create-board")createBoard();
 if(a==="create-item")createItem(bt.getAttribute("data-section"));
 if(a==="open-board"&&b){state.activeBoard=b.id;state.activeItem=null;save();paint();boardScreen.scrollTop=0}
 if(a==="open-item"&&p){openItem(p.id);document.getElementById("search").value="";document.getElementById("search-results").classList.remove("visible")}
 if(a==="close-item")closeItem();
 if(a==="expand-item"){state.fullscreen=!state.fullscreen;document.getElementById("drawer").classList.toggle("expanded",state.fullscreen)}
 if(a==="board-menu"&&b)boardMenu(b,bt);
 if(a==="section-menu")sectionMenu(bt.getAttribute("data-section"),bt);
 if(a==="create-section")createSection();
 if(a==="item-menu"&&p)itemMenu(p,bt);
 if(a==="view"){var bd=activeBoard();if(bd){bd.view=bt.getAttribute("data-view");save();paintBoard()}}
 if(a==="toggle-done"&&p)toggleDone(p);
 if(a==="bookmark-item"&&p)toggleBookmark(p.id);
 if(a==="addat")addMenu(bt,idx);
 if(a==="insert")insert(bt.getAttribute("data-type"),idx);
 if(a==="blockmenu"&&block)blockMenu(block,bt);
 if(a==="collapse"&&block){block.collapsed=!block.collapsed;save();paintPage()}
 if(a==="remove-task"&&block){block.items=block.items.filter(function(t){return t.id!==bt.getAttribute("data-task-id")});save();paintPage()}
 if(a==="replacefile"&&block){pendingPicker={type:"replacefile",blockId:block.id};document.getElementById("pick-files").click()}
 if(a==="openfile"&&block&&block.assetId){getAsset(block.assetId).then(function(blob){if(!blob){notify("File missing from browser.");return}var url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=block.fileName||"download";link.click();setTimeout(function(){URL.revokeObjectURL(url)},10000)}).catch(function(){notify("Cannot open file.")})}
 if(a==="addphotos"&&block){pendingPicker={type:"addphotos",blockId:block.id};document.getElementById("pick-photos").click()}
 if(a==="remove-photo"&&block){block.photos=block.photos.filter(function(ph){return ph.id!==bt.getAttribute("data-asset")});save();paintPage();paintBoard()}
 if(a==="preview"){getAsset(bt.getAttribute("data-asset")).then(function(blob){if(!blob)return;var url=URL.createObjectURL(blob),img=document.getElementById("preview-image");if(img.dataset.previewUrl)URL.revokeObjectURL(img.dataset.previewUrl);img.dataset.previewUrl=url;img.src=url;document.getElementById("photo-overlay").classList.add("visible")})}
 if(a==="add-log"){var txt=document.getElementById("new-log"),active=page();if(active&&txt&&txt.value.trim()){active.log=active.log||[];active.log.push({id:uid(),text:txt.value.trim(),at:Date.now()});active.updated=Date.now();save();paintPage();paintBoard();screen.scrollTop=screen.scrollHeight}}
 if(a==="export")exportBackup();
 if(a==="import")document.getElementById("pick-import").click();
});
document.addEventListener("input",function(e){
 var t=e.target,p=page();if(!p)return;
 if(t.id==="page-name"){p.title=t.value;p.updated=Date.now();save();paintBoard();paintSide();return}
 var block=t.hasAttribute("data-edit")?byId(t.getAttribute("data-edit")):null;
 if(block&&t.getAttribute("data-field")){block[t.getAttribute("data-field")]=t.value;save();if(t.tagName==="TEXTAREA"){t.style.height="auto";t.style.height=Math.max(55,t.scrollHeight+5)+"px"}return}
 var list=t.hasAttribute("data-task-text")?byId(t.getAttribute("data-task-text")):null;
 if(list){var task=list.items.find(function(x){return x.id===t.getAttribute("data-task-id")});if(task){task.text=t.value;save()}}
});
document.addEventListener("change",function(e){
 var t=e.target,b=activeBoard();
 if(t.id==="hide-done"&&b){b.hideDone=t.checked;save();paintBoard();return}
 if(t.hasAttribute("data-item-status")){var i=item(t.getAttribute("data-item-status"));if(i){i.status=t.value;i.updated=Date.now();save();paintBoard();if(t.closest(".board-wrap"))return;paintPage();return}}
 if(t.hasAttribute("data-item-section")){var i2=item(t.getAttribute("data-item-section"));if(i2){i2.section=t.value;i2.updated=Date.now();save();paintBoard();if(t.closest(".board-wrap"))return;paintPage();return}}
 if(t.id==="item-date"){var p=page();if(p){p.due=t.value||"";save()}return}
 if(t.hasAttribute("data-task-check")){var block=byId(t.getAttribute("data-task-check"));if(block){var task=block.items.find(function(i){return i.id===t.getAttribute("data-task-id")});if(task){task.done=t.checked;save();paintPage()}}}
});
document.addEventListener("keydown",function(e){
 var t=e.target;
 if(e.key==="Escape"){hideMenu();closeDialog();document.getElementById("search-results").classList.remove("visible");if(document.getElementById("photo-overlay").classList.contains("visible"))document.getElementById("photo-overlay").classList.remove("visible");else if(page())closeItem();return}
 if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(t.tagName)&&!e.ctrlKey&&!e.metaKey){e.preventDefault();document.getElementById("search").focus();return}
 if((e.key==="Enter"||e.key===" ")&&t.getAttribute("role")==="button"&&t.hasAttribute("data-action")&&t.tagName!=="BUTTON"){e.preventDefault();t.click();return}
 if(e.key==="Enter"&&t.hasAttribute("data-add-task")){e.preventDefault();var block=byId(t.getAttribute("data-add-task")),value=t.value.trim();if(block&&value){block.items.push({id:uid(),text:value,done:false});save();paintPage();var next=screen.querySelector('[data-add-task="'+block.id+'"]');if(next)next.focus()}}
 if(e.key==="Enter"&&t.hasAttribute("data-task-text")){e.preventDefault();var list=byId(t.getAttribute("data-task-text")),at=list?list.items.findIndex(function(x){return x.id===t.getAttribute("data-task-id")}):-1;if(at>=0){list.items.splice(at+1,0,{id:uid(),text:"",done:false});save();var newId=list.items[at+1].id;paintPage();var next=screen.querySelector('[data-task-id="'+newId+'"][data-task-text]');if(next)next.focus()}}
});
document.getElementById("search").addEventListener("input",renderSearch);
document.getElementById("modal-form").addEventListener("submit",function(e){e.preventDefault();var v=document.getElementById("modal-input").value.trim();if(v&&dialogDone){var fn=dialogDone;closeDialog();fn(v)}});
document.getElementById("modal-cancel").addEventListener("click",closeDialog);
document.getElementById("modal-back").addEventListener("click",function(e){if(e.target===this)closeDialog()});
document.getElementById("photo-overlay").addEventListener("click",function(){this.classList.remove("visible")});
document.getElementById("pick-files").addEventListener("change",async function(){var files=Array.from(this.files||[]),pending=pendingPicker;this.value="";pendingPicker=null;if(!files.length||!pending)return;var i=page();if(!i)return;var file=files[0],aid=uid();try{await putAsset(aid,file);if(pending.type==="newfile")i.blocks.splice(Math.max(0,Math.min(pending.index,i.blocks.length)),0,{id:uid(),type:"file",title:"",fileName:file.name,mime:file.type,size:file.size,assetId:aid});else{var b=byId(pending.blockId);if(!b)return;b.fileName=file.name;b.mime=file.type;b.size=file.size;b.assetId=aid}save();paintPage();paintBoard();notify("File attached.")}catch(err){notify("File storage failed: "+err.message)}});
document.getElementById("pick-photos").addEventListener("change",async function(){var files=Array.from(this.files||[]),pending=pendingPicker;this.value="";pendingPicker=null;if(!pending||!files.length)return;var b=byId(pending.blockId);if(!b)return;try{for(var file of files){var id=uid();await putAsset(id,file);b.photos.push({id:id,name:file.name})}save();paintPage();paintBoard();notify(files.length+" image(s) added.")}catch(err){notify("Picture storage failed: "+err.message)}});
document.getElementById("pick-import").addEventListener("change",function(){if(this.files&&this.files[0])importBackup(this.files[0]);this.value=""});
document.addEventListener("dragstart",function(e){var itemNode=e.target.closest("[data-drag-item]");if(itemNode){dragItem=itemNode.getAttribute("data-drag-item");e.dataTransfer.setData("text/plain",dragItem);e.dataTransfer.effectAllowed="move";return}var h=e.target.closest("[data-drag]");if(h){dragIndex=Number(h.getAttribute("data-drag"));e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",String(dragIndex))}});
document.addEventListener("dragover",function(e){if(dragItem){var col=e.target.closest("[data-drop-section]");if(col){e.preventDefault();e.dataTransfer.dropEffect="move";col.classList.add("over")}return}var target=e.target.closest("[data-block-index]");if(dragIndex!==null&&target){e.preventDefault();target.classList.add("drag-target")}});
document.addEventListener("dragleave",function(e){var col=e.target.closest("[data-drop-section]");if(col)col.classList.remove("over");var t=e.target.closest("[data-block-index]");if(t)t.classList.remove("drag-target")});
document.addEventListener("drop",function(e){if(dragItem){var col=e.target.closest("[data-drop-section]");if(col){e.preventDefault();var i=item(dragItem);if(i){i.section=col.getAttribute("data-drop-section");save();paintBoard();if(i.id===state.activeItem)paintPage()}}dragItem=null;return}var target=e.target.closest("[data-block-index]");if(dragIndex!==null&&target){e.preventDefault();var to=Number(target.getAttribute("data-block-index")),p=page();if(p&&to!==dragIndex){var moving=p.blocks.splice(dragIndex,1)[0];p.blocks.splice(to,0,moving);save();paintPage()}}dragIndex=null});
document.addEventListener("dragend",function(){dragIndex=null;dragItem=null;document.querySelectorAll(".drag-target,.kanban-column.over").forEach(function(t){t.classList.remove("drag-target","over")})});
save();paint();
})();

</script>
