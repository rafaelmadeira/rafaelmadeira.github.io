function freshState(){return {version:3,career:{level:1,levelScore:0,totalScore:0,totalWords:0,bestSession:0,bestWord:{word:'—',score:0},unlockedPowers:[],unlockedSpecialTiles:[],achievements:[],codex:{},definitionCache:{},packs:{},themes:[],totalSpecials:0,totalLightning:0,pendingPowerUnlock:0},level:freshLevel(),session:null,screen:'dashboard'};}
function freshLevel(){return {initialized:false,activePowers:[],boosts:[],boostsUsed:0,specialBag:[],specialHand:[],specialSpent:[],specialRecycles:SPECIAL_RECYCLES,deck:[],rack:[],discard:[],charge:0,chargeThreshold:12,cooldown:0,tagInfluence:{},chargeSpecials:0,specials:0,words:0,recycleReady:true,recent:[],stats:{score:0,words:0,sessions:0,specials:0,lightning:0,newCodex:0,newSpecialTiles:0,newPowers:0,newPacks:0,boosts:0,bestWord:{word:'—',score:0}},special:null,levelReady:false,bodyParts:[],selectedPrefixes:[],selectedSuffixes:[],selectedMark:null,pendingTyped:'',usedWords:[]};}
function loadState(){try{let s=JSON.parse(localStorage.getItem(SAVE_KEY));if(s&&s.version===3)return normalizeState(s);}catch(e){}return freshState();}
function normalizeState(s){let base=freshState();s.career={...base.career,...(s.career||{})};s.level={...base.level,...(s.level||{})};s.career.unlockedPowers=[...new Set(s.career.unlockedPowers||[])].filter(id=>POWERS[id]);s.career.pendingPowerUnlock=Number.isFinite(s.career.pendingPowerUnlock)?s.career.pendingPowerUnlock:0;s.career.unlockedSpecialTiles=[...new Set(s.career.unlockedSpecialTiles||[])].filter(id=>SPECIAL_TILES[id]);s.career.definitionCache=(s.career.definitionCache&&typeof s.career.definitionCache==='object')?s.career.definitionCache:{};for(const [w,d] of Object.entries(s.career.definitionCache)){if(!ACCEPTED_WORDS.has(w)||isProperNameDefinition(d?.definition,d?.pos))delete s.career.definitionCache[w];}s.career.codex=(s.career.codex&&typeof s.career.codex==='object')?s.career.codex:{};for(const w of Object.keys(s.career.codex)){if(!ACCEPTED_WORDS.has(w)){delete s.career.codex[w];continue;}let e=s.career.codex[w];if(typeof e.mastered!=='boolean')e.mastered=false;if(!Number.isFinite(e.challengeAttempts))e.challengeAttempts=0;if(e.definition&&isProperNameDefinition(e.definition))e.definition=null;}if(s.career.bestWord?.word&&s.career.bestWord.word!=='—'&&!ACCEPTED_WORDS.has(String(s.career.bestWord.word).toLowerCase())){let best=Object.entries(s.career.codex).sort((a,b)=>(b[1].bestScore||0)-(a[1].bestScore||0))[0];s.career.bestWord=best?{word:best[0],score:best[1].bestScore||0}:{word:'—',score:0};}if(s.session){s.session.definitionChallenges=Number.isFinite(s.session.definitionChallenges)?s.session.definitionChallenges:0;s.session.definitionCorrect=Number.isFinite(s.session.definitionCorrect)?s.session.definitionCorrect:0;s.session.forceDefinitionChallenge=!!s.session.forceDefinitionChallenge;}s.level.activePowers=[...new Set(s.level.activePowers||[])].filter(id=>POWERS[id]).slice(0,powerSlots(s.career.level));s.level.boosts=Array.isArray(s.level.boosts)?s.level.boosts.filter(b=>b&&BOOSTS[b.typeId]):[];s.level.boostsUsed=Number.isFinite(s.level.boostsUsed)?s.level.boostsUsed:0;s.level.chargeSpecials=Number.isFinite(s.level.chargeSpecials)?s.level.chargeSpecials:0;s.level.specialRecycles=Number.isFinite(s.level.specialRecycles)?s.level.specialRecycles:specialRecycleCount();s.level.bodyParts=Array.isArray(s.level.bodyParts)?s.level.bodyParts:[];s.level.selectedPrefixes=Array.isArray(s.level.selectedPrefixes)?s.level.selectedPrefixes:[];s.level.selectedSuffixes=Array.isArray(s.level.selectedSuffixes)?s.level.selectedSuffixes:[];s.level.pendingTyped=typeof s.level.pendingTyped==='string'?s.level.pendingTyped:'';s.level.usedWords=Array.isArray(s.level.usedWords)?s.level.usedWords.filter(w=>ACCEPTED_WORDS.has(w)):[];s.level.specialHand=Array.isArray(s.level.specialHand)?s.level.specialHand:[];s.level.specialBag=Array.isArray(s.level.specialBag)?s.level.specialBag:[];if(s.level.special&&!['lightningRush','lightningStrike'].includes(s.level.special.id)){s.level.special=null;s.level.charge=0;s.level.cooldown=0;s.level.tagInfluence={};}repairSpecialHandUniqueness(s.level);s.version=3;return s;}
let state=loadState();
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(state));}catch(e){}}
function targetForLevel(lvl){if(lvl===1)return 100;return Math.round(320*Math.pow(1.45,lvl-1));}
function letterHandSize(lvl=state.career.level){return Math.min(MAX_NATURAL_LETTER_HAND,5+Math.floor(lvl/2));}
function specialCardsUnlocked(lvl=state.career.level){return lvl>=3;}
function powerSlots(lvl=state.career.level){if(lvl<2)return 0;if(lvl<5)return 1;if(lvl<8)return 2;if(lvl<11)return 3;return 4;}
function specialPressureEnabled(){return specialCardsUnlocked()||state.level.activePowers.length>0;}
function specialRecycleCount(lvl=state.career.level){return lvl>=9?3:SPECIAL_RECYCLES;}
function resetSessionCharge(){let L=state.level;if(!L)return;L.charge=0;L.chargeThreshold=12;L.cooldown=0;L.tagInfluence={};L.chargeSpecials=0;}
function levelReward(lvl){if(lvl===2)return {title:'Letter Hand +1',detail:`Your natural Letter Hand grows to ${letterHandSize(lvl)} cards. Power system unlocked: 1 active Power slot.`};if(lvl===3)return {title:'Special Card Deck unlocked',detail:'Your discovered Special Cards can now appear in a 5-card hand. Exclamation (!) is added permanently.'};if(lvl===4)return {title:'Letter Hand +1',detail:`Your natural Letter Hand grows to ${letterHandSize(lvl)} cards.`};if(lvl===5)return {title:'Question (?) + Power Slot',detail:'Question (?) joins your Special Card collection. You may now equip 2 active Powers each level.'};if(lvl===6)return {title:'Letter Hand +1',detail:`Your natural Letter Hand grows to ${letterHandSize(lvl)} cards.`};if(lvl===7)return {title:'Period (.) unlocked',detail:'Period (.) joins your future Special Card Decks.'};if(lvl===8)return {title:'Letter Hand +1 + Power Slot',detail:`Your natural Letter Hand grows to ${letterHandSize(lvl)} cards, and you may equip 3 active Powers.`};if(lvl===9)return {title:'Special Card Recycle +1',detail:'You now get 3 Special Card recycles per Wordsmith level.'};if(lvl===10)return {title:'Letter Hand +1',detail:`Your natural Letter Hand reaches ${letterHandSize(lvl)} cards.`};if(lvl===11)return {title:'Power Slot +1',detail:'You may now equip 4 active Powers each Wordsmith level.'};return {title:'Wordsmith Cache',detail:'Permanent discoveries remain, and the next level begins with a fresh build.'};}
function applyLevelReward(lvl){let add=null;if(lvl===3)add='bang';if(lvl===5)add='question';if(lvl===7)add='period';if(add&&!state.career.unlockedSpecialTiles.includes(add))state.career.unlockedSpecialTiles.push(add);}
function pct(){return Math.min(100,100*state.career.levelScore/targetForLevel(state.career.level));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,n=1){return shuffle(a).slice(0,n);}
function buildDeck(){let arr=[],id=0;for(const [L,n] of Object.entries(LETTER_DIST))for(let i=0;i<n;i++)arr.push({id:'t'+(++id)+'_'+Date.now(),letter:L,value:LETTER_VALUES[L],enhancement:null});return shuffle(arr);}
function drawOne(){let L=state.level;if(!L.deck.length){L.deck=shuffle(L.discard);L.discard=[];}return L.deck.pop();}
function cardCounts(cards){let c={};for(const t of cards)c[t.letter]=(c[t.letter]||0)+1;return c;}
function wordFitsCounts(word,counts){let need={};for(const ch of word.toUpperCase())need[ch]=(need[ch]||0)+1;for(const [ch,n] of Object.entries(need))if((counts[ch]||0)<n)return false;return true;}
function wordFitsStandardDeck(word){let need={};for(const ch of word.toUpperCase())need[ch]=(need[ch]||0)+1;for(const [ch,n] of Object.entries(need))if((LETTER_DIST[ch]||0)<n)return false;return true;}
function fairWordAllowed(word,pendingWord=''){let L=state.level;if(word===pendingWord||L.usedWords.includes(word)||word.length>letterHandSize())return false;return true;}
function findFairPlayableWord(cards,pendingWord=''){let counts=cardCounts(cards);for(const word of FAIR_DEAL_WORDS){if(word.length>letterHandSize())continue;if(!fairWordAllowed(word,pendingWord))continue;if(wordFitsCounts(word,counts))return word;}return null;}
function takeCardFromPool(letter){let L=state.level,i=L.deck.findIndex(t=>t.letter===letter);if(i>=0)return {card:L.deck.splice(i,1)[0],pool:'deck'};i=L.discard.findIndex(t=>t.letter===letter);if(i>=0)return {card:L.discard.splice(i,1)[0],pool:'discard'};return null;}
function putCardBack(card,pool){let L=state.level;(pool==='discard'?L.discard:L.deck).push(card);}
function seedFairDealWord(word,mutableIds=[]){let L=state.level,mutable=new Set(mutableIds||[]),needed={};for(const ch of word.toUpperCase())needed[ch]=(needed[ch]||0)+1;let keep=new Set(),have={};
 // Existing held cards are sacred. Count them toward the target first so a
 // newly drawn duplicate can still be swapped if that helps complete a word.
 for(const t of L.rack){if(mutable.has(t.id))continue;let target=needed[t.letter]||0;if((have[t.letter]||0)<target){keep.add(t.id);have[t.letter]=(have[t.letter]||0)+1;}}
 // Then preserve any newly drawn cards that already help form the seeded word.
 for(const t of L.rack){if(!mutable.has(t.id))continue;let target=needed[t.letter]||0;if((have[t.letter]||0)<target){keep.add(t.id);have[t.letter]=(have[t.letter]||0)+1;}}
 let missing=[];for(const [ch,n] of Object.entries(needed))for(let i=(have[ch]||0);i<n;i++)missing.push(ch);
 if(!missing.length)return true;
 // Fair Deal may only replace cards that were drawn during this refill. It
 // must never touch cards the player deliberately held from the previous play.
 let surplus=L.rack.filter(t=>mutable.has(t.id)&&!keep.has(t.id));if(surplus.length<missing.length)return false;
 let swaps=[];for(const ch of missing){let pulled=takeCardFromPool(ch);if(!pulled){for(const x of swaps){let ri=L.rack.findIndex(t=>t.id===x.incoming.id);if(ri>=0)L.rack[ri]=x.outgoing;putCardBack(x.incoming,x.pool);}return false;}let outgoing=surplus.shift(),ri=L.rack.findIndex(t=>t.id===outgoing.id);L.rack[ri]=pulled.card;putCardBack(outgoing,pulled.pool);swaps.push({incoming:pulled.card,outgoing,pool:pulled.pool});}
 // The rack itself is intentionally not shuffled: held cards keep their exact
 // position and identity. Only hidden deck/discard order may change.
 L.deck=shuffle(L.deck);L.discard=shuffle(L.discard);return true;}
function ensureFairDeal(pendingWord='',mutableIds=[]){let L=state.level;if(!L||L.special)return false;if(findFairPlayableWord(L.rack,pendingWord))return false;let mutable=[...new Set(mutableIds||[])].filter(id=>L.rack.some(t=>t.id===id));if(!mutable.length)return false;let eligible=FAIR_DEAL_WORDS.filter(w=>w.length<=letterHandSize()&&fairWordAllowed(w,pendingWord)&&wordFitsStandardDeck(w));if(!eligible.length)return false;let shortlist=eligible.slice(0,Math.min(1800,eligible.length));for(const word of shuffle(shortlist)){if(seedFairDealWord(word,mutable)){L.fairDealFixes=(L.fairDealFixes||0)+1;L.lastFairDeal=word;return true;}}return false;}
function fillRack(pendingWord=''){let L=state.level,newIds=[];while(L.rack.length<letterHandSize()){let t=drawOne();if(!t)break;L.rack.push(t);newIds.push(t.id);}ensureFairDeal(pendingWord,newIds);}
function makeSpecialInstance(typeId,isNew=false){return {uid:`s_${++specialUidCounter}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,typeId,new:isNew};}
function repairSpecialHandUniqueness(L){if(!L)return;let seen=new Set(),kept=[],dupes=[];for(const item of (L.specialHand||[])){if(!item||!item.typeId)continue;if(seen.has(item.typeId))dupes.push(item);else{seen.add(item.typeId);kept.push(item);}}L.specialHand=kept;if(dupes.length)L.specialBag=[...(L.specialBag||[]),...dupes];}
function fillSpecialHand(){let L=state.level;repairSpecialHandUniqueness(L);if(L.specialHand.length>=SPECIAL_HAND_SIZE||!L.specialBag.length)return;let visible=new Set(L.specialHand.map(x=>x.typeId)),blocked=new Set(L.special?.usedSpecialTypes||[]);let safety=L.specialBag.length;while(L.specialHand.length<SPECIAL_HAND_SIZE&&L.specialBag.length&&safety-->0){let idx=L.specialBag.findIndex(item=>item&&item.typeId&&!visible.has(item.typeId)&&!blocked.has(item.typeId));if(idx<0)break;let [item]=L.specialBag.splice(idx,1);L.specialHand.push(item);visible.add(item.typeId);}}
function initSpecialTilesForLevel(){let L=state.level;L.specialHand=[];L.specialSpent=[];L.specialRecycles=specialRecycleCount();if(!specialCardsUnlocked()){L.specialBag=[];return;}let ids=state.career.unlockedSpecialTiles.filter(id=>SPECIAL_TILES[id]);let types=[...ids];if(ids.length){while(types.length<SPECIAL_DECK_MIN_SIZE)types.push(ids[Math.floor(Math.random()*ids.length)]);}L.specialBag=shuffle(types.map(id=>makeSpecialInstance(id,false)));fillSpecialHand();}
function grantSpecialTileToLevel(id){/* v3: discoveries enter future Special Card Decks, not the current level. */}
function initLevelBase(){let prev=state.level||{},startingPowers=[...(prev.activePowers||[])],heldBoosts=[...(prev.boosts||[])],chargeState={charge:Number.isFinite(prev.charge)?prev.charge:0,chargeThreshold:Number.isFinite(prev.chargeThreshold)?prev.chargeThreshold:12,cooldown:Number.isFinite(prev.cooldown)?prev.cooldown:0,tagInfluence:{...(prev.tagInfluence||{})},chargeSpecials:Number.isFinite(prev.chargeSpecials)?prev.chargeSpecials:0};let L=freshLevel();L.activePowers=startingPowers;L.boosts=heldBoosts;Object.assign(L,chargeState);L.deck=buildDeck();state.level=L;fillRack();initSpecialTilesForLevel();}
function rarity(word){let f=WORD_FREQ[word]||0;if(f>=100)return {name:'Common',rank:0};if(f>=20)return {name:'Familiar',rank:1};if(f>=5)return {name:'Uncommon',rank:2};if(f>=1)return {name:'Rare',rank:3};return {name:'Deep Cut',rank:4};}
function vowelCount(w){return [...w].filter(c=>VOWELS.has(c)).length;}
function validWord(w){return w.length>=3&&ACCEPTED_WORDS.has(w);}
function specialItem(uid){return state.level.specialHand.find(x=>x.uid===uid);}
function specialType(uid){let item=specialItem(uid);return item?SPECIAL_TILES[item.typeId]:null;}
function selectedPhysicalIds(){return state.level.bodyParts.filter(p=>p.kind==='tile').map(p=>p.id);}
function selectedTileObjects(){let ids=selectedPhysicalIds();return ids.map(id=>state.level.rack.find(t=>t.id===id)).filter(Boolean);}
function currentAffixCount(){return state.level.selectedPrefixes.length+state.level.selectedSuffixes.length;}
function currentPatternCount(){return state.level.bodyParts.filter(p=>p.kind==='special'&&specialType(p.uid)?.kind==='pattern').length;}
function selectedSpecialUids(){let L=state.level;return [...L.selectedPrefixes,...L.bodyParts.filter(p=>p.kind==='special').map(p=>p.uid),...L.selectedSuffixes,...(L.selectedMark?[L.selectedMark]:[])];}
function currentWord(){let L=state.level;let pre=L.selectedPrefixes.map(uid=>specialType(uid)?.text||'').join('');let body=L.bodyParts.map(p=>p.kind==='tile'?(L.rack.find(t=>t.id===p.id)?.letter.toLowerCase()||''):(specialType(p.uid)?.text||'')).join('');let suf=L.selectedSuffixes.map(uid=>specialType(uid)?.text||'').join('');return pre+body+suf;}

function startOrResume(){if(!state.level.initialized){initLevelBase();state.level.initialized=true;if(state.career.level===1&&state.career.totalWords===0){showFirstRunIntro();return;}startSession();return;}startSession();}
function startSession(){state.screen='game';if(!state.session){resetSessionCharge();state.session={score:0,words:0,newCodex:0,newSpecialTiles:0,newPowers:0,newPacks:0,specials:0,lightning:0,definitionChallenges:0,definitionCorrect:0,forceDefinitionChallenge:false,bestWord:{word:'—',score:0},startedAt:Date.now()};}state.level.stats.sessions++;save();render();if(state.level.special?.timed)startLightningClock();}
function showFirstRunIntro(){let reward=levelReward(2);openModal(`<div class="eyebrow">Your first Wordsmith level</div><h2>Start with five letters.</h2><div class="modal-sub">No Powers. No Special Cards. Just the Standard Letter Deck and the words you can find.</div><div class="recap-grid"><div class="recap-stat"><strong>5</strong><span>Letter Hand</span></div><div class="recap-stat"><strong>${targetForLevel(1)}</strong><span>Points to Level 2</span></div><div class="recap-stat"><strong>0</strong><span>Starting Powers</span></div></div><div class="note">Every accepted word scores, enters your Codex, and can reveal Packs or discover future Special Cards. You can end a session whenever you want; Level 1 continues until you level up.</div><div class="reward-card"><small>NEXT WORDSMITH REWARD</small><b>${reward.title}</b><small>${reward.detail} You will also unlock your first Power and choose the active loadout for Level 2.</small></div><div class="modal-actions"><button class="btn accent" id="firstRunBtn">BEGIN</button></div>`,true);document.getElementById('firstRunBtn').onclick=()=>{closeModal();startSession();};}
function powerChoiceHTML(id,sel=false){let p=POWERS[id];return `<div class="choice ${sel?'selected':''}" data-id="${id}"><span class="equip-status">${sel?'ACTIVE ✓':'INACTIVE'}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="tag">POWER</div></div>`;}
function boostChoiceHTML(id){let b=BOOSTS[id];return `<div class="choice" data-id="${id}"><h3>${esc(b.name)}</h3><p>${esc(b.desc)}</p><div class="tag">BOOST · ${esc(b.tag)}</div></div>`;}
function boostCardHTML(item){let b=BOOSTS[item.typeId],blocked=!!state.level.special||scoreAnimating;return `<div class="boost-card"><b>${esc(b.name)}</b><small>${esc(b.desc)}</small><button class="btn small" onclick="useBoost('${item.uid}')" ${blocked?'disabled':''}>USE BOOST</button></div>`;}
function boostBoardHTML(){let L=state.level;return `<div class="boost-section"><div class="rack-label" style="margin-top:0"><div><div class="panel-title" style="margin:0">Boosts</div><small style="color:#7a7267">One-use actions earned from Lightning Rounds. Unused Boosts stay in your inventory across Wordsmith levels; the Enhancements they create belong to the current Letter Deck.</small></div><div class="badge">${L.boosts.length} held</div></div><div class="boost-hand">${L.boosts.length?L.boosts.map(boostCardHTML).join(''):'<div class="boost-empty">No Boosts held. Complete a Lightning Round to earn one.</div>'}</div></div>`;}
function storeBoost(id){let L=state.level;if(!Array.isArray(L.boosts))L.boosts=[];let boost=makeBoost(id);L.boosts.push(boost);L.stats.boosts=(L.stats.boosts||0)+1;save();return boost;}

function render(){document.getElementById('app').innerHTML=state.screen==='game'?gameHTML():dashboardHTML();}
function animateLevelProgress(fromScore,toScore){let c=state.career,target=targetForLevel(c.level),fill=document.getElementById('levelProgressFill'),label=document.getElementById('levelProgressLabel');if(!fill||!label)return;let fromPct=Math.min(100,100*fromScore/target),toPct=Math.min(100,100*toScore/target),duration=680;fill.style.transition='none';fill.style.width=fromPct+'%';void fill.offsetWidth;requestAnimationFrame(()=>{fill.style.transition='width .68s cubic-bezier(.22,.8,.25,1)';fill.style.width=toPct+'%';});let started=performance.now();function tick(now){let p=Math.min(1,(now-started)/duration),e=1-Math.pow(1-p,3),v=Math.round(fromScore+(toScore-fromScore)*e);label.textContent=`${v.toLocaleString()} / ${target.toLocaleString()} TO LEVEL ${c.level+1}`;if(p<1)requestAnimationFrame(tick);}requestAnimationFrame(tick);}
function dashboardHTML(){let c=state.career,t=targetForLevel(c.level),packs=Object.keys(c.packs).length,next=levelReward(c.level+1);return `<div class="screen"><div class="dashboard"><div class="brand"><div><div class="version">Playtest build v3.15.1 · Power Loadout Clarity</div><h1>Wordsmith</h1></div></div><div class="dash-grid"><div class="paper hero"><div class="eyebrow">Current pursuit</div><div class="hero-level">Wordsmith Level ${c.level}</div><div class="progress-shell"><div class="progress-fill" style="width:${pct()}%"></div></div><div class="progress-label"><span>${c.levelScore.toLocaleString()} points</span><span>${t.toLocaleString()}</span></div><div class="hero-actions"><button class="btn accent" onclick="startOrResume()">${state.level.initialized?'CONTINUE LEVEL':'BEGIN LEVEL'}</button>${state.session?'<button class="btn secondary" onclick="startSession()">RESUME SESSION</button>':''}${c.pendingPowerUnlock===c.level?'<button class="btn secondary" onclick="claimPendingPower()">CLAIM LEVEL POWER</button>':''}</div><div class="reward-card"><small>NEXT WORDSMITH REWARD · LEVEL ${c.level+1}</small><b>${next.title}</b><small>${next.detail} Every level-up also unlocks a new standard Power.</small></div><div class="note"><b>Standard Letter Deck:</b> ${letterHandSize()}-card natural hand. Cards come from decks; themed vocabulary lives in Packs. ${ACCEPTED_WORD_COUNT.toLocaleString()} words are accepted offline. Sessions can span multiple Wordsmith levels. Special Charge carries across level-ups and resets only when you end the play session. Level-ups unlock new Powers; your active Powers carry over and can be changed at level-up.</div></div><div><div class="stat-grid"><div class="stat"><strong>${c.totalScore.toLocaleString()}</strong><span>Lifetime Score</span></div><div class="stat"><strong>${c.bestSession.toLocaleString()}</strong><span>Best Session</span></div><div class="stat"><strong>${c.bestWord.score.toLocaleString()}</strong><span>Best Word</span></div><div class="stat"><strong>${c.totalWords.toLocaleString()}</strong><span>Words Played</span></div></div></div></div><div class="collection-row">${collectionCard('Codex',Object.keys(c.codex).length,"openCollection('codex')")}${collectionCard('Powers',c.unlockedPowers.length,"openCollection('powers')")}${collectionCard('Special Cards',c.unlockedSpecialTiles.length,"openCollection('specialTiles')")}${collectionCard('Packs',packs,"openCollection('packs')")}${collectionCard('Achievements',c.achievements.length,"openCollection('achievements')")}</div></div></div>`;}
function collectionCard(lab,num,click){return `<div class="collection-card" onclick="${click}"><div class="num">${num}</div><div class="lab">${lab}</div></div>`;}
function gameHTML(){let L=state.level,c=state.career,s=state.session||{score:0},special=L.special,inLightning=!!special?.timed,pressureEnabled=specialPressureEnabled(),chargeRatio=L.cooldown?0:Math.min(100,100*L.charge/L.chargeThreshold),plabel=L.cooldown?`Cooling · ${L.cooldown} word${L.cooldown===1?'':'s'}`:!pressureEnabled?'Dormant':chargeRatio<35?'Calm':chargeRatio<70?'Warming':'Unstable',next=levelReward(c.level+1),systemsOpen=specialCardsUnlocked();let left='';if(inLightning){left+=`<div class="panel-title">Lightning Round</div><div class="path-card"><small>Current event</small><b>⚡ ${esc(special.name)}</b><small>${esc(special.description)}</small></div>`;}else{left+=`<div class="panel-title">Wordsmith Path</div><div class="path-card"><small>Next reward · Level ${c.level+1}</small><b>${next.title}</b><small>${next.detail} Every level-up also unlocks a new standard Power.</small></div>`;}if(L.activePowers.length||c.unlockedPowers.length){left+=`<div class="panel-title" style="margin-top:18px">Active Powers</div><div class="power-slots">${L.activePowers.length} / ${powerSlots(c.level)} slots · carried between levels · reviewed at level-up</div>${inLightning&&special.powersDisabled?'<div class="round-disabled-note">Your selected Powers are still equipped, but Lightning Rush disables their effects for this round.</div>':''}${L.activePowers.map(id=>`<div class="power-card ${inLightning&&special.powersDisabled?'disabled-round':''}" id="power_${id}"><b>${esc(POWERS[id].name)}</b><small>${esc(POWERS[id].desc)}</small></div>`).join('')||'<div class="note">No active Powers this level.</div>'}`;}if(L.boosts.length){left+=`<div class="panel-title" style="margin-top:18px">Boosts</div><div class="boost-summary"><b>${L.boosts.length} Boost${L.boosts.length===1?'':'s'} ready</b><br>Use ${L.boosts.length===1?'it':'them'} below your Letter Hand.</div>`;}if(!inLightning){let pressureHelp=!pressureEnabled?'Choose a Power at level-up, or reach Level 3 to unlock Special Cards.':L.cooldown?'Lightning Charge is temporarily paused after the last round.':'Triggered Powers usually add +1 Charge (the strongest add +2); each used Special Card adds +1. When the meter fills, one of the two Lightning Rounds begins. Charge carries across Wordsmith levels and resets when you end the session. One word can add at most 40% of the current threshold.';left+=`<div class="pressure ${pressureEnabled?'':'locked'}"><div class="panel-title">Lightning Charge</div><div class="pressure-track"><div class="pressure-fill" style="width:${chargeRatio}%"></div></div><div class="pressure-label"><span>${plabel}</span><span class="pressure-value">${L.cooldown?'—':`${L.charge} / ${L.chargeThreshold}`}</span></div><div class="note" style="margin-top:7px">${pressureHelp}</div></div>`;}if(!systemsOpen){left+=`<div class="locked-system" style="margin-top:16px"><b>Special Cards locked</b><br>Reach Wordsmith Level 3 to turn discovered Special Cards into a playable deck.</div>`;}left+=`<div class="keyboard"><b>Keyboard</b><br>Type letters / Special Cards · Backspace undo<br>Enter submit · Space shuffle<br>Esc clear</div>`;let specialSection=systemsOpen?`<div class="special-tile-section"><div class="rack-label" style="margin-top:0"><div><div class="panel-title" style="margin:0">Special Card Hand</div><small style="color:#7a7267">One use each. Click them or type their letters/symbols; physical Letter Cards take priority. Prefixes snap left, suffixes right, Patterns go where typed/clicked, Marks modify the play.${inLightning&&special.specialTilesDisabled?' This hand is visible but disabled during Lightning Rush.':''}</small></div><div class="badge">${L.specialHand.length} hand · ${L.specialBag.length} deck · ${L.specialRecycles} recycle${L.specialRecycles===1?'':'s'}</div></div><div class="special-tile-hand">${specialHandHTML()}</div></div>`:'';let topLeft=inLightning?`<div class="level-mini">⚡ ${esc(special.name)}</div><div class="session-score">Wordsmith ${c.level} · +${s.score.toLocaleString()} session</div>`:`<div class="level-mini">WORDSMITH ${c.level}</div><div class="session-score">+${s.score.toLocaleString()} this session</div>`;let topActions=inLightning?`<button class="btn small danger" onclick="abandonSpecial()">ABANDON ROUND</button>`:`<button class="btn small secondary" onclick="openCollection('codex')">CODEX</button><button class="btn small" onclick="endSession()">END SESSION</button>`;return `<div class="screen game ${inLightning?'special-mode':''}"><div class="gamebar"><div class="g-left">${topLeft}</div><div><div class="mini-progress"><div id="levelProgressFill" style="width:${pct()}%"></div></div><div class="mini-label" id="levelProgressLabel">${c.levelScore.toLocaleString()} / ${targetForLevel(c.level).toLocaleString()} TO LEVEL ${c.level+1}</div></div><div class="g-right">${topActions}</div></div><div class="game-layout"><aside class="sidepanel">${left}</aside><main class="board">${special?specialHTML(special):''}<div id="feedback" class="feedback">${feedbackHTML()}</div><div class="word-zone" id="wordZone">${wordZoneHTML()}</div>${scorePreviewHTML()}<div class="rack-label"><div><div class="panel-title" style="margin:0">Letter Hand</div><small style="color:#7a7267">Standard Letter Deck · ${letterHandSize()} cards in hand · only Letter Cards have innate point value.</small></div><div class="badge">${L.deck.length} in deck · ${L.discard.length} discard</div></div><div class="rack">${L.rack.filter(t=>!selectedPhysicalIds().includes(t.id)).map(tileHTML).join('')}</div><div class="controls"><button class="btn secondary" onclick="clearSelection()">CLEAR</button><button class="btn secondary" onclick="shuffleRack()">SHUFFLE</button><button class="btn secondary recycle-letters" onclick="recycleSelected()" ${!L.recycleReady||special?.id==='lightningRush'?'disabled':''}>RECYCLE LETTERS ≤3</button><button class="btn accent" onclick="submitWord()">${submitButtonLabel()}</button>${special&&special.refreshes>0?`<button class="btn secondary" onclick="specialRefresh()">SPECIAL REFRESH (${special.refreshes})</button>`:''}</div>${boostBoardHTML()}${specialSection}</main><aside class="sidepanel right"><div class="panel-title">Recent Plays</div><div class="activity">${L.recent.slice(-12).reverse().map(r=>`<div class="activity-item ${r.special?'special':''}"><div><b>${esc(r.word.toUpperCase())}</b><br><small>${esc(r.note||r.rarity)}</small></div><div class="pts">+${r.score.toLocaleString()}</div></div>`).join('')||'<div class="note">Your words will appear here.</div>'}</div></aside></div></div>`;}
function tileDecor(t){let cls=t.enhancement?` enh-${t.enhancement}`:'',badge=t.enhancement?`<span class="enh-badge">${t.enhancement==='gold'?'GOLD':'ECHO'}</span>`:'',polish=t.polished?`<span class="polish-badge">+${t.polished}</span>`:'';return {cls,badge,polish};}
function tileHTML(t){let d=tileDecor(t);return `<div class="tile ${t.value>=4?'high':''}${d.cls}" data-tile="${t.id}" onclick="selectTile('${t.id}')">${d.badge}${t.letter}<span class="val">${t.value}</span>${d.polish}</div>`;}
function specialPieceHTML(uid){let d=specialType(uid);if(!d)return '';return `<div class="special-piece ${d.kind}" data-special-uid="${uid}" onclick="removeSpecialSelection('${uid}')">${esc(d.label)}</div>`;}
function wordZoneHTML(){let L=state.level,parts=[];for(const uid of L.selectedPrefixes)parts.push(specialPieceHTML(uid));for(const p of L.bodyParts){if(p.kind==='tile'){let t=L.rack.find(x=>x.id===p.id);if(t){let d=tileDecor(t);parts.push(`<div class="tile${d.cls}" data-word-tile="${p.id}" data-tile-value="${t.value}" onclick="unselectTile('${p.id}')">${d.badge}${t.letter}<span class="val">${t.value}</span>${d.polish}</div>`);}}else parts.push(specialPieceHTML(p.uid));}for(const uid of L.selectedSuffixes)parts.push(specialPieceHTML(uid));if(L.selectedMark)parts.push(specialPieceHTML(L.selectedMark));return parts.length?parts.join(''):'<div class="empty-word">Build a word</div>';}
function specialHandHTML(){let L=state.level,disabled=L.special?.specialTilesDisabled;if(!L.specialHand.length)return '<span class="note">The Special Card Deck is empty.</span>';return L.specialHand.map(item=>{let d=SPECIAL_TILES[item.typeId],sel=selectedSpecialUids().includes(item.uid);return `<div class="special-card ${d.kind} ${disabled?'disabled':''} ${sel?'selected':''}" title="${esc(d.desc)}" onclick="toggleSpecial('${item.uid}')"><button class="special-recycle" title="Recycle this Special Card" onclick="event.stopPropagation();recycleSpecial('${item.uid}')" ${disabled||L.specialRecycles<=0?'disabled':''}>↻</button><strong>${esc(d.label)}</strong><small>${d.kind==='prefix'||d.kind==='suffix'?'AFFIX':d.kind.toUpperCase()}</small><span class="special-desc">${esc(d.desc)}</span>${item.new?'<span class="new">NEW</span>':''}</div>`;}).join('');}

function currentScorePreview(){let L=state.level,word=currentWord(),tiles=selectedTileObjects(),physical=tiles.reduce((n,t)=>n+t.value,0),specials=selectedSpecialUids().map(uid=>({uid,def:specialType(uid)})).filter(x=>x.def),letterAdds=specials.filter(x=>x.def.kind!=='mark').reduce((n,x)=>n+x.def.text.length,0);if(!tiles.length)return {status:'empty',word,physical,specials,letterAdds,reason:'Use at least one physical letter tile.'};if(!validWord(word))return {status:'invalid',word,physical,specials,letterAdds,reason:word.length<3?'Words need at least 3 letters.':'Not currently an accepted word.'};if(L.usedWords.includes(word))return {status:'used',word,physical,specials,letterAdds,reason:'Already scored during this Wordsmith level.'};let rar=rarity(word),rule=checkSpecialRule(word,rar);if(!rule.ok)return {status:'blocked',word,physical,specials,letterAdds,rar,reason:rule.msg};let res=scoreWord(word,tiles,rar);return {status:'ready',word,physical,specials,letterAdds,rar,res};}
function scorePreviewHTML(){let p=currentScorePreview();if(p.status==='empty')return `<div class="score-preview"><div><div class="score-preview-label">Score preview</div><div class="score-preview-word">Build a valid word</div></div><div class="score-preview-main"><div class="score-preview-total">—</div></div><div class="score-preview-detail"><span class="score-preview-note">${esc(p.reason)}</span></div></div>`;if(p.status!=='ready'){let bits=[];if(p.physical)bits.push(`<span class="score-chip">${p.physical} physical pts</span>`);if(p.word)bits.push(`<span class="score-chip">${p.word.length} letters</span>`);if(p.letterAdds)bits.push(`<span class="score-chip affix">+${p.letterAdds} Special Card letters · 0 pts</span>`);return `<div class="score-preview blocked"><div><div class="score-preview-label">Score preview</div><div class="score-preview-word">${esc((p.word||'').toUpperCase())}</div></div><div class="score-preview-main"><div class="score-preview-total">—</div></div><div class="score-preview-detail">${bits.join('')}<span class="score-preview-note">${esc(p.reason)}</span></div></div>`;}let r=p.res,bits=[],tiles=selectedTileObjects();let chip=(label,cls='',data={})=>{let attrs=Object.entries(data).filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>` data-${k}="${esc(String(v))}"`).join('');return `<span class="score-chip${cls?' '+cls:''}" data-score-step="1"${attrs}>${esc(label)}</span>`;};bits.push(chip(`Tiles ${r.physical} pts`,'',{'set-points':r.physical}));for(const t of tiles){if(t.enhancement==='echo')bits.push(chip(`Echo ${t.letter} +${t.value} pts`,'affix',{p:t.value}));if(t.enhancement==='gold')bits.push(chip(`Gold ${t.letter} +2 mult`,'affix',{m:2}));}bits.push(chip(`Length ${p.word.length} → ${Math.max(1,p.word.length-2)} mult`,'',{m:Math.max(1,p.word.length-2)}));if(r.rarityAdd)bits.push(chip(`${p.rar.name} +${r.rarityAdd} mult`,'',{m:r.rarityAdd}));if(p.letterAdds)bits.push(chip(`Special letters +${p.letterAdds} length · 0 pts`,'affix'));for(const t of r.triggers){let effect=[];if(t.p)effect.push(`${t.p>0?'+':''}${t.p} pts`);if(t.m)effect.push(`${t.m>0?'+':''}${t.m} mult`);if(t.x!==1)effect.push(`×${fmtX(t.x)}`);bits.push(chip(`${t.name}${effect.length?' · '+effect.join(' · '):''}`,'power',{p:t.p||'',m:t.m||'',x:t.x!==1?t.x:'','power-id':t.id}));}for(const e of r.specialTileEffects){let data={};if(e.startsWith('!'))data.x=2;else if(e.startsWith('? New'))data.x=3;else if(e.startsWith('.'))data.m=6;bits.push(chip(e,'special-tile-chip',data));}if(!state.level.special&&specialPressureEnabled()){if(state.level.cooldown>0)bits.push(chip('Special Charge cooling'));else if(!r.noCharge){let pressureGain=Math.min(r.charge+p.specials.length,Math.ceil(state.level.chargeThreshold*.40));if(pressureGain)bits.push(chip(`+${pressureGain} Special Charge`,'special'));}}if(r.specialX!==1)bits.push(chip(`${state.level.special?.name||'Special'} ×${fmtX(r.specialX)}`,'special',{x:r.specialX}));let finalX=r.x!==1?` <span>×</span> <b>${fmtX(r.x)}</b>`:'';return `<div class="score-preview ready"><div><div class="score-preview-label">Score preview</div><div class="score-preview-word">${esc(p.word.toUpperCase())} · ${esc(p.rar.name)}</div></div><div class="score-preview-main"><div class="score-equation"><b>${r.points}</b> pts <span>×</span> <b>${fmtX(r.mult)}</b> mult${finalX}</div><div class="score-preview-total">+${r.score.toLocaleString()}</div></div><div class="score-preview-detail">${bits.join('')}</div></div>`;}
function fmtX(n){return Number.isInteger(n)?String(n):Number(n).toFixed(2).replace(/0+$/,'').replace(/\.$/,'');}
function submitButtonLabel(){let p=currentScorePreview();return p.status==='ready'?`SUBMIT · +${p.res.score.toLocaleString()}`:'SUBMIT';}

function specialHTML(sp){let time=sp.timed?`<span class="timer" id="lightTimer">${formatTime(Math.max(0,sp.endsAt-Date.now()))}</span>`:'';return `<div class="special-banner lightning"><div class="lightning-kicker">Lightning Round</div><h3>⚡ ${esc(sp.name)}</h3><div>${esc(sp.description)}</div><div class="special-meta">${time}<span>${sp.oneWord?'ONE SUBMISSION':`${sp.completed||0} WORDS SCORED`}</span><span>×${sp.bonus} LIGHTNING BONUS</span>${sp.refreshes?`<span>${sp.refreshes} REFRESHES</span>`:''}</div><div style="margin-top:12px"><button class="btn small danger" onclick="abandonSpecial()">ABANDON ROUND · NO BOOST REWARD</button></div></div>`;}
let uiFeedback={kind:'',title:'',detail:''};
function feedbackHTML(){if(!uiFeedback.title)return '<span style="color:#9a9286">Find a word that makes your current build happy.</span>';return `<strong>${esc(uiFeedback.title)}</strong><div class="breakdown">${uiFeedback.detail}</div>`;}
function setFeedback(kind,title,detail=''){uiFeedback={kind,title,detail};let el=document.getElementById('feedback');if(el){el.className='feedback '+kind;el.innerHTML=feedbackHTML();}}

function selectTile(id){if(scoreAnimating)return;let L=state.level;if(selectedPhysicalIds().includes(id))return;L.bodyParts.push({kind:'tile',id});save();render();}
function unselectTile(id){let L=state.level;let idx=L.bodyParts.findIndex(p=>p.kind==='tile'&&p.id===id);if(idx>=0)L.bodyParts.splice(idx,1);save();render();}
function availableTypedSpecials(){let L=state.level,used=new Set(selectedSpecialUids()),blocked=new Set(L.special?.usedSpecialTypes||[]);if(L.special?.specialTilesDisabled)return [];return L.specialHand.filter(item=>!used.has(item.uid)&&!blocked.has(item.typeId)).map(item=>({item,d:SPECIAL_TILES[item.typeId]})).filter(x=>x.d);}
function trailingPhysicalMatch(text){let L=state.level,n=text.length;if(!n)return [];let tail=L.bodyParts.slice(-n);if(tail.length!==n||tail.some(p=>p.kind!=='tile'))return null;let got=tail.map(p=>L.rack.find(t=>t.id===p.id)?.letter.toLowerCase()||'').join('');return got===text?tail.map(p=>p.id):null;}
function activateTypedSpecial(entry,replaceIds=[]){let L=state.level,d=entry.d,uid=entry.item.uid;if(d.kind==='prefix'){let remain=L.bodyParts.filter(p=>!(p.kind==='tile'&&replaceIds.includes(p.id)));if(remain.length||L.selectedSuffixes.length||L.selectedMark)return false;L.bodyParts=remain;L.selectedPrefixes.push(uid);}else if(d.kind==='suffix'){L.bodyParts=L.bodyParts.filter(p=>!(p.kind==='tile'&&replaceIds.includes(p.id)));L.selectedSuffixes.push(uid);}else if(d.kind==='pattern'){L.bodyParts=L.bodyParts.filter(p=>!(p.kind==='tile'&&replaceIds.includes(p.id)));L.bodyParts.push({kind:'special',uid});}else return false;entry.item.new=false;L.pendingTyped='';save();render();return true;}
function tryTypedSpecial(ch){let L=state.level,c=ch.toLowerCase(),pending=L.pendingTyped||'',entries=availableTypedSpecials().filter(x=>x.d.kind!=='mark').sort((a,b)=>b.d.text.length-a.d.text.length);for(const entry of entries){let text=entry.d.text;if(!text.endsWith(c))continue;let before=text.slice(0,-1);if(pending&&!before.endsWith(pending))continue;let physicalNeed=before.slice(0,before.length-pending.length),ids=trailingPhysicalMatch(physicalNeed);if(ids===null)continue;if(entry.d.kind==='prefix'){let remaining=state.level.bodyParts.filter(p=>!(p.kind==='tile'&&ids.includes(p.id)));if(remaining.length)continue;}if(activateTypedSpecial(entry,ids))return true;}return false;}
function hasTypedSpecialPrefix(seq){seq=seq.toLowerCase();return availableTypedSpecials().some(x=>x.d.kind!=='mark'&&x.d.text.startsWith(seq));}
function typeMark(mark){if(scoreAnimating)return;let entry=availableTypedSpecials().find(x=>x.d.kind==='mark'&&x.d.label===mark);if(!entry)return;let L=state.level;if(L.selectedMark===entry.item.uid)L.selectedMark=null;else L.selectedMark=entry.item.uid;entry.item.new=false;L.pendingTyped='';save();render();}
function selectLetter(ch){if(scoreAnimating)return;let L=state.level,c=ch.toLowerCase();if(L.pendingTyped){if(tryTypedSpecial(c))return;let seq=L.pendingTyped+c;if(hasTypedSpecialPrefix(seq)){L.pendingTyped=seq;save();return;}L.pendingTyped='';}let used=new Set(selectedPhysicalIds()),t=L.rack.find(t=>t.letter===ch.toUpperCase()&&!used.has(t.id));if(t){selectTile(t.id);return;}if(tryTypedSpecial(c))return;if(hasTypedSpecialPrefix(c)){L.pendingTyped=c;save();}}
function removeSpecialSelection(uid){let L=state.level;L.selectedPrefixes=L.selectedPrefixes.filter(x=>x!==uid);L.selectedSuffixes=L.selectedSuffixes.filter(x=>x!==uid);L.bodyParts=L.bodyParts.filter(p=>!(p.kind==='special'&&p.uid===uid));if(L.selectedMark===uid)L.selectedMark=null;save();render();}
function clearSelection(){if(scoreAnimating)return;let L=state.level;L.bodyParts=[];L.selectedPrefixes=[];L.selectedSuffixes=[];L.selectedMark=null;L.pendingTyped='';save();render();}
function shuffleRack(){if(scoreAnimating)return;let L=state.level,selected=new Set(selectedPhysicalIds()),loose=shuffle(L.rack.filter(t=>!selected.has(t.id))),picked=L.rack.filter(t=>selected.has(t.id));L.rack=[...loose,...picked];save();render();}
function toggleSpecial(uid){if(scoreAnimating)return;let L=state.level,item=specialItem(uid);if(!item||L.special?.specialTilesDisabled)return;item.new=false;let d=SPECIAL_TILES[item.typeId],selected=selectedSpecialUids().includes(uid);if(selected){removeSpecialSelection(uid);return;}if(d.kind==='prefix')L.selectedPrefixes.push(uid);else if(d.kind==='suffix')L.selectedSuffixes.push(uid);else if(d.kind==='pattern')L.bodyParts.push({kind:'special',uid});else if(d.kind==='mark')L.selectedMark=uid;save();render();}
function recycleSpecial(uid){if(scoreAnimating)return;let L=state.level;if(L.specialRecycles<=0||L.special?.specialTilesDisabled)return;let i=L.specialHand.findIndex(x=>x.uid===uid);if(i<0)return;removeSpecialSelectionNoRender(uid);let [item]=L.specialHand.splice(i,1);L.specialSpent.push({...item,reason:'recycled'});L.specialRecycles--;fillSpecialHand();toast('SPECIAL CARD RECYCLED',L.specialBag.length?`Drew a replacement card · ${L.specialRecycles} recycle${L.specialRecycles===1?'':'s'} left`:`Deck empty · ${L.specialRecycles} recycle${L.specialRecycles===1?'':'s'} left`);save();render();}
function removeSpecialSelectionNoRender(uid){let L=state.level;L.selectedPrefixes=L.selectedPrefixes.filter(x=>x!==uid);L.selectedSuffixes=L.selectedSuffixes.filter(x=>x!==uid);L.bodyParts=L.bodyParts.filter(p=>!(p.kind==='special'&&p.uid===uid));if(L.selectedMark===uid)L.selectedMark=null;}

function discoverWord(word,score,usedDefs,meta={}){let c=state.career,s=state.session,L=state.level,isNew=!c.codex[word];if(isNew){c.codex[word]={firstLevel:c.level,times:0,bestScore:0,lastConstruction:usedDefs.length?'special':'cards',mastered:false,challengeAttempts:0,definition:null};s.newCodex++;L.stats.newCodex++;toast('NEW CODEX ENTRY',word.toUpperCase());}let e=c.codex[word];e.times++;e.bestScore=Math.max(e.bestScore,score);e.lastConstruction=usedDefs.length?'special':'cards';if(meta.challengeAttempt)e.challengeAttempts=(e.challengeAttempts||0)+1;if(meta.definition)e.definition=meta.definition;if(meta.mastered){e.mastered=true;e.masteredLevel=c.level;toast('WORD MASTERED',`${word.toUpperCase()} · Definition Challenge cleared`);}for(const [id,d] of Object.entries(SPECIAL_TILES)){if(c.unlockedSpecialTiles.includes(id)||d.rewardLevel)continue;let unlock=false;if((d.kind==='prefix'||d.kind==='suffix')&&Array.isArray(d.unlock))unlock=d.unlock.includes(word);else if(d.kind==='pattern'&&d.unlockContains)unlock=word.includes(d.text);if(unlock){c.unlockedSpecialTiles.push(id);s.newSpecialTiles++;L.stats.newSpecialTiles++;let type=d.kind==='pattern'?'Pattern':d.kind==='prefix'?'Prefix':'Suffix';toast('NEW SPECIAL CARD DISCOVERED',`${type} ${d.label} · available in future Special Card Decks`);}}
 for(const [id,p] of Object.entries(PACKS)){if(p.words.includes(word)){if(!c.packs[id]){c.packs[id]={words:[]};s.newPacks++;L.stats.newPacks++;toast('NEW PACK DISCOVERED',`${p.icon} ${p.name}`);if(!c.themes.includes(p.theme)){c.themes.push(p.theme);toast('NEW THEME DISCOVERED',p.theme);}}if(!c.packs[id].words.includes(word))c.packs[id].words.push(word);}}}
function unlockAchievement(id){let c=state.career,s=state.session,L=state.level;if(c.achievements.includes(id))return;c.achievements.push(id);let a=ACHIEVEMENTS[id];toast('POWER ACHIEVEMENT',`${a.name} → ${POWERS[a.power].name} unlocked for future level-up loadouts`);if(!c.unlockedPowers.includes(a.power)){c.unlockedPowers.push(a.power);s.newPowers++;L.stats.newPowers++;}}
function checkAchievements(word,res,rar){if(word.length===3&&res.score>=100)unlockAchievement('smallMighty');if(word.length>=8)unlockAchievement('longHaul');if(word.length>=4&&word[0]===word[word.length-1])unlockAchievement('bookended');if(word.length>=6&&new Set(word).size===word.length)unlockAchievement('cleanCut');if(res.affixCount>=2)unlockAchievement('morphologist');if(res.patternCount>=1)unlockAchievement('patternMaker');if(rar.rank>=3)unlockAchievement('deepCut');if(vowelCount(word)>=4)unlockAchievement('vowelMovement');}

function triggerSpecialFromCharge(){if(state.level.special||!specialPressureEnabled())return;beginSpecial(Math.random()<.5?'lightningRush':'lightningStrike');}
function hasAvailableKind(kind){return state.level.specialHand.some(item=>SPECIAL_TILES[item.typeId]?.kind===kind);}
function specialDef(id){let defs={lightningRush:{name:'LIGHTNING RUSH',description:'90 seconds. Score as many words as you can. Powers and Special Cards are disabled. Every word ×10.',total:999,bonus:10,refreshes:0,timed:true,powersDisabled:true,specialTilesDisabled:true},lightningStrike:{name:'LIGHTNING STRIKE',description:'90 seconds. You may submit exactly one word. Your full build remains active, including Powers and Special Cards. Make it count. ×10.',total:1,bonus:10,refreshes:3,timed:true,oneWord:true,powersDisabled:false,specialTilesDisabled:false}};return JSON.parse(JSON.stringify(defs[id]||defs.lightningRush));}
function beginSpecial(id){let L=state.level;if(L.special)return;let sp=specialDef(id);sp.id=id;sp.completed=0;sp.score=0;sp.usedSpecialTypes=[];if(sp.timed)sp.endsAt=Date.now()+90000;L.special=sp;L.charge=0;L.tagInfluence={};clearSelection();toast('⚡ LIGHTNING ROUND',sp.name);save();render();if(sp.timed)startLightningClock();}
function completeSpecial(){let L=state.level,sp=L.special;if(!sp)return;stopLightningClock();L.specials++;L.stats.specials++;state.session.specials++;state.career.totalSpecials++;let lightning=sp.id.startsWith('lightning');if(lightning){L.stats.lightning++;state.session.lightning++;state.career.totalLightning++;unlockAchievement('stormChaser');}let summary={name:sp.name,score:sp.score||0,lightning};L.special=null;L.charge=0;L.cooldown=2;L.chargeSpecials=(L.chargeSpecials||0)+1;L.chargeThreshold=12+L.chargeSpecials*10+L.chargeSpecials*L.chargeSpecials*2;L.tagInfluence={};clearSelection();fillSpecialHand();let levelComplete=state.career.levelScore>=targetForLevel(state.career.level);save();showBoostDraft(summary,levelComplete);}
function makeBoost(typeId){return {uid:'b'+Date.now()+'_'+Math.random().toString(36).slice(2,7),typeId};}
function showBoostDraft(summary,levelComplete=false){let picks=sample(Object.keys(BOOSTS),3);openModal(`<div class="eyebrow">Lightning complete</div><h2>${esc(summary.name)}</h2><div class="modal-sub">Lightning score: <b>+${summary.score.toLocaleString()}</b>. Your Powers stay fixed for this Wordsmith level. Choose a one-use Boost to evolve the Letter Deck.${levelComplete?' Because this Lightning completed the level, the Boost will carry into the next Wordsmith level.':''}</div><div class="eyebrow">Choose a Boost</div><div class="choice-grid" id="boostDraftChoices">${picks.map(boostChoiceHTML).join('')}</div>`,false);document.querySelectorAll('#boostDraftChoices .choice').forEach(el=>el.onclick=()=>{let id=el.dataset.id;if(levelComplete){let boost=makeBoost(id);state.level.stats.boosts=(state.level.stats.boosts||0)+1;save();closeModal();toast('BOOST EARNED',`${BOOSTS[id].name} · carries into next level`);levelUp(boost);}else{let boost=storeBoost(id);closeModal();toast('BOOST ACQUIRED',`${BOOSTS[id].name} · ready below your Letter Hand`);render();}});}
function boostTargetValid(typeId,t){if((typeId==='gild'||typeId==='echo')&&t.enhancement)return false;return true;}
function useBoost(uid){let L=state.level,item=L.boosts.find(b=>b.uid===uid);if(!item)return;if(L.special){toast('Boost unavailable','Use Boosts between Special Rounds.');return;}if(scoreAnimating)return;if(selectedPhysicalIds().length||selectedSpecialUids().length){toast('Finish your word first','Clear the current construction before using a Boost.');return;}let b=BOOSTS[item.typeId],cards=L.rack.map(t=>{let d=tileDecor(t),ok=boostTargetValid(item.typeId,t);return `<div class="boost-target ${ok?'':'disabled'}"><div class="tile ${t.value>=4?'high':''}${d.cls}" onclick="${ok?`applyBoost('${uid}','${t.id}')`:''}">${d.badge}${t.letter}<span class="val">${t.value}</span>${d.polish}</div></div>`;}).join('');openModal(`<div class="eyebrow">Use Boost</div><h2>${esc(b.name)}</h2><div class="modal-sub">${esc(b.desc)}</div><div class="boost-target-grid">${cards}</div><div class="modal-actions"><button class="btn secondary" onclick="closeModal()">CANCEL</button></div>`,true);}
function applyBoost(uid,tileId){let L=state.level,bi=L.boosts.findIndex(b=>b.uid===uid),t=L.rack.find(x=>x.id===tileId);if(bi<0||!t)return;let item=L.boosts[bi],b=BOOSTS[item.typeId];if(!boostTargetValid(item.typeId,t))return;if(item.typeId==='polish'){t.value+=2;t.polished=(t.polished||0)+2;}else if(item.typeId==='gild'){t.enhancement='gold';}else if(item.typeId==='echo'){t.enhancement='echo';}else if(item.typeId==='duplicate'){let copy={...t,id:'t_boost_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)};L.deck.push(copy);L.deck=shuffle(L.deck);}else if(item.typeId==='cut'){let i=L.rack.findIndex(x=>x.id===tileId);if(i>=0)L.rack.splice(i,1);fillRack();}L.boosts.splice(bi,1);L.boostsUsed=(L.boostsUsed||0)+1;closeModal();toast('BOOST USED',`${b.name} → ${t.letter}`);save();render();}
function abandonSpecial(){let L=state.level,sp=L.special;if(!sp)return;if(!confirm('Abandon this Lightning Round? You will not get a Boost reward.'))return;stopLightningClock();L.special=null;L.charge=0;L.cooldown=2;L.tagInfluence={};clearSelection();fillSpecialHand();toast('Lightning Round abandoned','No Boost reward this time.');save();render();if(state.career.levelScore>=targetForLevel(state.career.level))setTimeout(()=>levelUp(),250);}
function specialRefresh(){let sp=state.level.special;if(!sp||sp.refreshes<=0)return;sp.refreshes--;let L=state.level;clearSelection();while(L.rack.length)L.discard.push(L.rack.pop());fillRack();save();render();}
function startLightningClock(){stopLightningClock();lightningTimer=setInterval(()=>{let sp=state.level.special;if(!sp?.timed){stopLightningClock();return;}let left=sp.endsAt-Date.now(),el=document.getElementById('lightTimer');if(el)el.textContent=formatTime(Math.max(0,left));if(left<=0){stopLightningClock();completeSpecial();}},100);}
function stopLightningClock(){if(lightningTimer){clearInterval(lightningTimer);lightningTimer=null;}}
function formatTime(ms){let sec=Math.ceil(ms/1000);return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;}

function levelUp(carryBoost=null){let c=state.career,L=state.level;if(L.special){L.levelReady=true;return;}stopLightningClock();let old=c.level,target=targetForLevel(old),overflow=Math.max(0,c.levelScore-target),build=[...L.activePowers],heldBoosts=[...(L.boosts||[])],chargeState={charge:L.charge,chargeThreshold:L.chargeThreshold,cooldown:L.cooldown,tagInfluence:{...(L.tagInfluence||{})},chargeSpecials:L.chargeSpecials||0};if(carryBoost)heldBoosts.push(carryBoost);c.level++;c.levelScore=overflow;c.pendingPowerUnlock=c.level;applyLevelReward(c.level);let reward=levelReward(c.level),recap=JSON.parse(JSON.stringify(L.stats));state.level=freshLevel();state.level.activePowers=build.slice(0,powerSlots(c.level));state.level.boosts=heldBoosts;Object.assign(state.level,chargeState);state.screen='dashboard';save();showLevelUpModal(c.level,reward,recap);}
function levelPowerUnlockChoices(){return sample(LEVEL_POWER_POOL.filter(id=>!state.career.unlockedPowers.includes(id)),3);}
function showLevelUpModal(level,reward,recap){let picks=levelPowerUnlockChoices();if(!picks.length)state.career.pendingPowerUnlock=0;let newPowerSection=picks.length?`<div class="eyebrow" style="margin-top:18px">Unlock a new Power</div><div class="modal-sub">Every Wordsmith level-up adds a new standard Power to your permanent collection.</div><div class="choice-grid" id="newPowerChoices">${picks.map(id=>`<div class="choice" data-id="${id}"><span class="new-power">NEW POWER</span><h3>${esc(POWERS[id].name)}</h3><p>${esc(POWERS[id].desc)}</p><div class="tag">UNLOCK PERMANENTLY</div></div>`).join('')}</div>`:`<div class="note" style="margin-top:16px">All standard level-up Powers in this prototype are already unlocked. Achievement Powers can still expand your collection.</div>`;openModal(`<div class="eyebrow">Wordsmith level complete</div><h2>WORDSMITH LEVEL ${level}</h2><div class="modal-sub">Your Letter Deck is refreshed for the new level. The current play session continues: Special Charge, unused Boosts, and active Powers carry forward; you can change the Power loadout if you want.</div>${recapHTML(recap)}<div class="reward-card"><small>LEVEL ${level} REWARD</small><b>${reward.title}</b><small>${reward.detail}</small></div>${newPowerSection}<div class="modal-actions">${picks.length?'':'<button class="btn accent" id="continueToLoadout">REVIEW ACTIVE POWERS</button>'}</div>`,false);if(picks.length){document.querySelectorAll('#newPowerChoices .choice').forEach(el=>el.onclick=()=>{let id=el.dataset.id;if(!state.career.unlockedPowers.includes(id))state.career.unlockedPowers.push(id);state.career.pendingPowerUnlock=0;toast('NEW POWER UNLOCKED',POWERS[id].name);save();showPowerLoadoutModal(level,id);});}else{save();document.getElementById('continueToLoadout').onclick=()=>showPowerLoadoutModal(level,null);}}
function claimPendingPower(){let c=state.career;if(c.pendingPowerUnlock!==c.level)return;let picks=levelPowerUnlockChoices();if(!picks.length){c.pendingPowerUnlock=0;save();toast('Power collection','All standard level-up Powers are already unlocked.');render();return;}openModal(`<div class="eyebrow">Level ${c.level} reward</div><h2>Unlock a new Power</h2><div class="modal-sub">This reward was left unclaimed when you closed the level-up screen.</div><div class="choice-grid" id="pendingPowerChoices">${picks.map(id=>`<div class="choice" data-id="${id}"><span class="new-power">NEW POWER</span><h3>${esc(POWERS[id].name)}</h3><p>${esc(POWERS[id].desc)}</p><div class="tag">UNLOCK PERMANENTLY</div></div>`).join('')}</div>`,false);document.querySelectorAll('#pendingPowerChoices .choice').forEach(el=>el.onclick=()=>{let id=el.dataset.id;if(!c.unlockedPowers.includes(id))c.unlockedPowers.push(id);c.pendingPowerUnlock=0;save();toast('NEW POWER UNLOCKED',POWERS[id].name);showPowerLoadoutModal(c.level,id);});}
function showPowerLoadoutModal(level,newPower){let L=state.level,available=state.career.unlockedPowers.filter(id=>POWERS[id]),slots=powerSlots(level),selected=L.activePowers.filter(id=>available.includes(id)).slice(0,slots);let cards=available.length?available.map(id=>powerChoiceHTML(id,selected.includes(id))).join(''):'<div class="note">No Powers are unlocked yet.</div>';openModal(`<div class="eyebrow">Prepare Wordsmith Level ${level}</div><h2>Choose Active Powers</h2><div class="modal-sub"><b>Choose up to ${slots} Power${slots===1?'':'s'} to equip for this level.</b> Only highlighted cards marked ACTIVE will affect your words. Your previous loadout starts selected automatically; unlocked Powers that are not selected stay in your collection but are inactive.</div>${newPower?`<div class="reward-card"><small>NEW POWER UNLOCKED — NOT EQUIPPED AUTOMATICALLY</small><b>${esc(POWERS[newPower].name)}</b><small>${esc(POWERS[newPower].desc)} Select it below if you want it active this level.</small></div>`:''}${L.boosts.length?`<div class="note"><b>Boost inventory:</b> ${L.boosts.length} unused Boost${L.boosts.length===1?'':'s'} carried into this level.</div>`:''}<div class="power-slots"><b>${slots} Power Slot${slots===1?'':'s'}</b> · ${selected.length}/${slots} equipped</div><div class="choice-grid power-loadout" id="levelPowerChoices">${cards}</div><div class="note" style="margin-top:12px"><b>Changes are not saved until you use one of the buttons below.</b></div><div class="modal-actions"><button class="btn secondary" id="levelHomeBtn">SAVE LOADOUT & RETURN HOME</button><button class="btn accent" id="nextLevelBtn">SAVE LOADOUT & BEGIN LEVEL ${level}</button></div>`,false);function sync(){document.querySelectorAll('#levelPowerChoices .choice').forEach(x=>{let on=selected.includes(x.dataset.id);x.classList.toggle('selected',on);let status=x.querySelector('.equip-status');if(status)status.textContent=on?'ACTIVE ✓':'INACTIVE';});let lab=document.querySelector('.power-slots');if(lab)lab.innerHTML=`<b>${slots} Power Slot${slots===1?'':'s'}</b> · ${selected.length}/${slots} equipped`;}document.querySelectorAll('#levelPowerChoices .choice').forEach(el=>el.onclick=()=>{let id=el.dataset.id;if(selected.includes(id))selected=selected.filter(x=>x!==id);else if(selected.length<slots)selected.push(id);else{toast('Power Slots full',`Remove a Power before choosing ${POWERS[id].name}.`);return;}sync();});sync();document.getElementById('nextLevelBtn').onclick=()=>{L.activePowers=[...selected];save();closeModal();startOrResume();};document.getElementById('levelHomeBtn').onclick=()=>{L.activePowers=[...selected];save();closeModal();render();};}
function recapHTML(r){return `<div class="recap-grid"><div class="recap-stat"><strong>${r.score.toLocaleString()}</strong><span>Score earned</span></div><div class="recap-stat"><strong>${r.words}</strong><span>Words</span></div><div class="recap-stat"><strong>${r.specials}</strong><span>Specials</span></div><div class="recap-stat"><strong>${r.lightning}</strong><span>Lightning</span></div><div class="recap-stat"><strong>${r.newCodex}</strong><span>New Codex</span></div><div class="recap-stat"><strong>${r.newSpecialTiles}</strong><span>Special Cards found</span></div><div class="recap-stat"><strong>${r.newPowers}</strong><span>Powers unlocked</span></div><div class="recap-stat"><strong>${r.newPacks}</strong><span>Packs found</span></div><div class="recap-stat"><strong>${esc(r.bestWord.word.toUpperCase())}<br><small>${r.bestWord.score.toLocaleString()}</small></strong><span>Best word</span></div></div>`;}
function endSession(){if(!state.session)return;let s=state.session;state.career.bestSession=Math.max(state.career.bestSession,s.score);resetSessionCharge();state.session=null;state.screen='dashboard';save();openModal(`<div class="eyebrow">Session ended · Level ${state.career.level} continues</div><h2>Session Recap</h2><div class="modal-sub">Your active Powers, Boosts, enhanced Letter Cards, Letter Deck, Special Card hand/deck, and recycles are saved. Special Charge resets between play sessions.</div><div class="recap-grid"><div class="recap-stat"><strong>${s.score.toLocaleString()}</strong><span>Session Score</span></div><div class="recap-stat"><strong>${s.words}</strong><span>Words</span></div><div class="recap-stat"><strong>${s.specials}</strong><span>Specials</span></div><div class="recap-stat"><strong>${s.lightning}</strong><span>Lightning</span></div><div class="recap-stat"><strong>${s.definitionCorrect||0}/${s.definitionChallenges||0}</strong><span>Definition Challenges</span></div><div class="recap-stat"><strong>${s.newCodex}</strong><span>New Codex</span></div><div class="recap-stat"><strong>${s.newSpecialTiles}</strong><span>Special Cards found</span></div><div class="recap-stat"><strong>${esc(s.bestWord.word.toUpperCase())}<br><small>${s.bestWord.score.toLocaleString()}</small></strong><span>Best word</span></div><div class="recap-stat"><strong>${Math.round(pct())}%</strong><span>Level Progress</span></div></div><div class="modal-actions"><button class="btn accent" id="recapHome">RETURN HOME</button></div>`,true);document.getElementById('recapHome').onclick=()=>{closeModal();render();};}

function openCollection(which){let c=state.career,body='';if(which==='codex'){let rows=Object.entries(c.codex).sort((a,b)=>b[1].bestScore-a[1].bestScore).slice(0,250);body=`<h2>Codex</h2><div class="modal-sub">${Object.keys(c.codex).length} unique words discovered. Rare and Deep Cut words can also be Mastered by clearing a Definition Challenge.</div><div class="list two-col">${rows.map(([w,e])=>{let rr=rarity(w),mastery=rr.rank>=3&&e.mastered?`<span class="mastery-badge mastered">Mastered</span>`:'';return `<div class="list-row"><div><b>${w.toUpperCase()}</b>${mastery}<br><small>First seen Lv ${e.firstLevel} · ${e.times} play${e.times===1?'':'s'} · ${e.lastConstruction==='special'?'last built with Special Cards':'last built from Letter Cards'}${e.definition?`<br>${esc(e.definition)}`:''}</small></div><b>${e.bestScore.toLocaleString()}</b></div>`;}).join('')||'<div class="note">No words yet.</div>'}</div>`;}
 if(which==='powers'){let standardIds=LEVEL_POWER_POOL,specialIds=Object.keys(POWERS).filter(id=>!POWERS[id].starter),renderPowerSection=(ids,lockedText)=>`<div class="list two-col">${ids.map(id=>{let p=POWERS[id],u=c.unlockedPowers.includes(id);return `<div class="list-row ${u?'':'locked'}"><div><b>${u?p.name:'???'}</b><br><small>${u?p.desc:lockedText}</small></div><span class="badge ${u?'unlocked':''}">${u?'Unlocked':'Locked'}</span></div>`;}).join('')}</div>`;body=`<h2>Powers</h2><div class="modal-sub">Wordsmith level-ups unlock Standard Powers; Power Achievements unlock Special Powers. Active Powers carry over between levels and can be changed at level-up.</div><h3>Standard Powers</h3><div class="section-note">Unlocked through Wordsmith level-ups.</div>${renderPowerSection(standardIds,'Unlock through a Wordsmith level-up.')}<h3 style="margin-top:24px">Special Powers</h3><div class="section-note">Unlocked through Power Achievements.</div>${renderPowerSection(specialIds,'Complete its Power Achievement to discover this.')}`;}
 if(which==='specialTiles'){let order=['prefix','suffix','pattern','mark'],names={prefix:'Prefixes',suffix:'Suffixes',pattern:'Patterns',mark:'Marks'};body=`<h2>Special Card Library</h2><div class="modal-sub">Affixes and Patterns are discovered by forming words that contain them. Affixes and Patterns are discovered through words; Marks are awarded through Wordsmith level rewards. Each unlocked type contributes cards to future Special Card Decks; duplicate copies may exist in the deck, but only one copy of a given card can be visible in your hand at once.</div>${order.map(kind=>`<h3>${names[kind]}</h3><div class="list two-col">${Object.entries(SPECIAL_TILES).filter(([,d])=>d.kind===kind).map(([id,d])=>{let u=c.unlockedSpecialTiles.includes(id);return `<div class="list-row ${u?'':'locked'}"><div><b>${u?d.label:'???'}</b><br><small>${u?d.desc:`Undiscovered ${kind}`}</small></div><span class="badge ${u?'unlocked':''}">${u?'Discovered':'Hidden'}</span></div>`;}).join('')}</div>`).join('')}`;}
 if(which==='packs')body=`<h2>Packs</h2><div class="modal-sub">Packs are discovered incidentally through normal scoring play.</div><div class="list">${Object.entries(PACKS).map(([id,p])=>{let d=c.packs[id];return `<div class="list-row ${d?'':'locked'}"><div><b>${d?`${p.icon} ${p.name}`:'???'}</b><br><small>${d?`${p.theme} · ${d.words.length}/${p.words.length} found`:'Hidden Pack'}</small></div>${d?`<span class="badge unlocked">${d.words.length}/${p.words.length}</span>`:''}</div>`;}).join('')}</div>`;
 if(which==='achievements')body=`<h2>Power Achievements</h2><div class="modal-sub">Achievements unlock Powers permanently; they do not activate them automatically.</div><div class="list">${Object.entries(ACHIEVEMENTS).map(([id,a])=>{let u=c.achievements.includes(id);return `<div class="list-row ${u?'':'locked'}"><div><b>${a.name}</b><br><small>${a.desc}<br>Reward: ${POWERS[a.power].name}</small></div><span class="badge ${u?'unlocked':''}">${u?'Complete':'Open'}</span></div>`;}).join('')}</div>`;
 openModal(body,false);}
function openModal(html,narrow=false,locked=false){closeModal();let d=document.createElement('div');d.className='modal-back';d.id='modalBack';d.dataset.locked=locked?'1':'0';d.innerHTML=`<div class="modal ${narrow?'narrow':''}">${locked?'':`<button class="modal-close" aria-label="Close" title="Close" onclick="closeModal()">×</button>`}${html}</div>`;d.addEventListener('mousedown',e=>{if(!locked&&e.target===d)closeModal();});document.body.appendChild(d);}
function closeModal(){document.getElementById('modalBack')?.remove();}
function toast(title,msg=''){let t=document.createElement('div');t.className='toast';t.innerHTML=`<b>${esc(title)}</b><small>${esc(msg)}</small>`;document.getElementById('toasts').appendChild(t);setTimeout(()=>t.classList.add('fade-out'),5200);setTimeout(()=>t.remove(),7000);}

function toggleDebug(){document.getElementById('debugPanel').classList.toggle('hidden');}
function debugForceSpecial(){if(state.screen!=='game'||state.level.special)return;beginSpecial(Math.random()<.5?'lightningRush':'lightningStrike');}
function debugLightning(type){if(state.screen!=='game'||state.level.special)return;beginSpecial(type==='rush'?'lightningRush':'lightningStrike');}
function debugUnlockPowers(){for(const id of Object.keys(POWERS))if(!state.career.unlockedPowers.includes(id))state.career.unlockedPowers.push(id);toast('Playtest','All Powers unlocked.');save();render();}
function debugUnlockSpecialTiles(){for(const id of Object.keys(SPECIAL_TILES))if(!state.career.unlockedSpecialTiles.includes(id)){state.career.unlockedSpecialTiles.push(id);}toast('Playtest','All Special Cards unlocked for future decks.');save();render();}
function debugGiveBoost(){let id=sample(Object.keys(BOOSTS),1)[0];storeBoost(id);toast('Playtest Boost',`${BOOSTS[id].name} · ready below your Letter Hand`);render();}
function debugForceDefinitionChallenge(){if(!state.session){toast('Playtest','Start a session first.');return;}state.session.forceDefinitionChallenge=true;save();toast('Playtest','Next eligible Rare/Deep Cut word will trigger a Definition Challenge.');}
function debugNearLevel(){state.career.levelScore=Math.floor(targetForLevel(state.career.level)*.95);save();render();toast('Playtest','Level progress set to 95%.');}
function resetCareer(){if(!confirm('Reset all Wordsmith prototype progress?'))return;stopLightningClock();localStorage.removeItem(SAVE_KEY);state=freshState();uiFeedback={kind:'',title:'',detail:''};closeModal();render();}

window.addEventListener('keydown',e=>{let modal=document.getElementById('modalBack');if(modal){if(e.key==='Escape'&&modal.dataset.locked!=='1'){e.preventDefault();closeModal();}return;}if(scoreAnimating||state.screen!=='game')return;if(e.key==='Enter'){e.preventDefault();submitWord();}else if(e.key==='Backspace'){e.preventDefault();let L=state.level;if(L.pendingTyped){L.pendingTyped=L.pendingTyped.slice(0,-1);save();return;}if(L.selectedMark){L.selectedMark=null;save();render();return;}if(L.selectedSuffixes.length){L.selectedSuffixes.pop();save();render();return;}if(L.bodyParts.length){L.bodyParts.pop();save();render();return;}if(L.selectedPrefixes.length){L.selectedPrefixes.pop();save();render();return;}}else if(e.key==='Escape'){e.preventDefault();clearSelection();}else if(e.code==='Space'){e.preventDefault();shuffleRack();}else if(e.key==='!'||e.key==='?'||e.key==='.'){e.preventDefault();typeMark(e.key);}else if(/^[a-zA-Z]$/.test(e.key))selectLetter(e.key);});
window.addEventListener('beforeunload',save);
if(state.session&&state.level.special?.timed&&state.level.special.endsAt<=Date.now()){state.level.special.score=state.level.special.score||0;completeSpecial();}
render();
</script>
</body>
</html>
